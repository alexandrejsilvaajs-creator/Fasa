<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FASA · Demo</title>
<link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22FASA%20Demo%22%2C%22short_name%22%3A%22FASA%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2316241F%22%2C%22theme_color%22%3A%22%231F6F5C%22%7D">

<style>
/* ============================================================
   FASA — Design System
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --ink:#16241F;--ink-soft:#3B4A44;--muted:#64766F;--paper:#F3F7F3;--paper-2:#EAF1EC;--card:#FFFFFF;--line:#DCE6DF;
  --primary:#1F6F5C;--primary-dk:#164F41;--primary-lt:#E4F1EC;--accent:#E8873A;--accent-dk:#C96A22;--accent-lt:#FBE7D4;
  --danger:#C24545;--gold:#B8933B;
  --f-display:'Fraunces',serif;--f-body:'Inter',system-ui,sans-serif;--f-mono:'JetBrains Mono',monospace;
  --sidebar-w:248px;--radius:14px;--radius-sm:9px;--radius-pill:999px;
  --shadow:0 1px 2px rgba(22,36,31,.05),0 8px 24px -12px rgba(22,36,31,.12);
  --shadow-lg:0 12px 40px -16px rgba(22,36,31,.28);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--f-body);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
ul{list-style:none;margin:0;padding:0}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);color:var(--ink);margin:0;letter-spacing:-.01em}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;padding:11px 20px;border-radius:var(--radius-pill);border:1px solid transparent;cursor:pointer;transition:.15s ease;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dk)}
.btn-accent{background:var(--accent);color:#fff}.btn-accent:hover{background:var(--accent-dk)}
.btn-ghost{background:transparent;color:var(--primary);border-color:var(--line)}.btn-ghost:hover{background:var(--primary-lt)}
.btn-block{width:100%}.btn-sm{padding:7px 14px;font-size:13px}.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;font-weight:500;padding:4px 12px 4px 4px;border-radius:var(--radius-pill);background:var(--primary-lt);color:var(--primary-dk);border:1px solid transparent}
.pill::before{content:"";width:8px;height:16px;border-radius:5px;background:var(--primary);flex:none}
.pill.accent{background:var(--accent-lt);color:var(--accent-dk)}.pill.accent::before{background:var(--accent)}
.pill.muted{background:var(--paper-2);color:var(--muted)}.pill.muted::before{background:var(--muted)}
.auth-shell{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
@media (max-width:860px){.auth-shell{grid-template-columns:1fr}}
.auth-art{background:linear-gradient(160deg,var(--primary-dk),var(--primary) 60%,#2F8A73);color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:48px}
@media (max-width:860px){.auth-art{display:none}}
.auth-art .caps{position:absolute;inset:0;opacity:.15}
.auth-art .caps span{position:absolute;width:120px;height:44px;border-radius:999px;border:2px solid #fff}
.auth-brand{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-size:22px;position:relative;z-index:1}
.auth-quote{font-family:var(--f-display);font-size:28px;line-height:1.3;max-width:420px;position:relative;z-index:1}
.auth-quote small{display:block;font-family:var(--f-mono);font-size:12px;opacity:.75;margin-top:14px;text-transform:uppercase;letter-spacing:.1em}
.auth-form-wrap{display:flex;align-items:center;justify-content:center;padding:32px}
.auth-form{width:100%;max-width:380px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.01em}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--line);background:#fff;font-size:14px;font-family:var(--f-body);color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);outline:none}
.err{background:#FBEAEA;color:var(--danger);border:1px solid #F1C6C6;border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;margin-bottom:16px;display:none}
.err.show{display:block}
.app-shell{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex:none;background:var(--card);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-family:var(--f-display);font-size:19px;color:var(--primary-dk)}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;color:var(--ink-soft);transition:.12s;cursor:pointer}
.nav-item .ic{width:20px;text-align:center;font-size:16px}
.nav-item:hover{background:var(--paper-2)}
.nav-item.active{background:var(--primary-lt);color:var(--primary-dk);font-weight:700}
.sidebar-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;font-family:var(--f-display)}
.avatar.sm{width:30px;height:30px;font-size:12px}.avatar.lg{width:80px;height:80px;font-size:28px;border:4px solid #fff;box-shadow:var(--shadow)}
.sidebar-user .who{min-width:0}
.sidebar-user .who .name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user .who .role{font-size:11px;color:var(--muted)}
.logout-btn{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px}
.logout-btn:hover{color:var(--danger)}
.main{flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:5;background:rgba(243,247,243,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:14px 28px;gap:16px}
.topbar h2{font-size:20px}
.topbar-search{flex:1;max-width:360px;display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:var(--radius-pill);padding:8px 16px;font-size:13px;color:var(--muted)}
.topbar-search input{border:none;outline:none;background:none;font-size:13px;width:100%;font-family:inherit}
.menu-btn{display:none;background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink)}
.page{padding:24px 28px;max-width:1040px}
@media (max-width:900px){.sidebar{position:fixed;left:-260px;z-index:20;transition:.2s;box-shadow:var(--shadow-lg)}.sidebar.open{left:0}.menu-btn{display:block}.page{padding:18px}.topbar{padding:12px 16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.composer{display:flex;gap:12px;align-items:flex-start;margin-bottom:20px}
.composer textarea{flex:1;resize:none;border:none;background:var(--paper-2);border-radius:var(--radius-sm);padding:12px 14px;font-family:inherit;font-size:14px;min-height:44px;color:var(--ink)}
.composer textarea:focus{outline:2px solid var(--primary)}
.composer-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.post{margin-bottom:16px}
.post-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.post-head .meta .name{font-weight:700;font-size:14px}
.post-head .meta .sub{font-size:12px;color:var(--muted)}
.post-body{font-size:14.5px;line-height:1.55;color:var(--ink-soft);margin-bottom:12px;white-space:pre-wrap}

/* Estilo Facebook - Perfil Header e Reações */
.profile-cover{height:160px;background:linear-gradient(135deg,var(--primary-dk),var(--primary),var(--accent));border-radius:var(--radius) var(--radius) 0 0;position:relative}
.profile-header-card{padding:0;overflow:hidden;margin-bottom:20px}
.profile-info-bar{padding:16px 24px 20px;display:flex;align-items:flex-end;gap:16px;margin-top:-40px;position:relative;z-index:2;flex-wrap:wrap}
.profile-details{flex:1;min-width:200px}
.profile-details h1{font-size:24px;margin-bottom:2px}
.profile-details .bio{font-size:13.5px;color:var(--muted);margin-bottom:8px}

.reactions-bar{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.reaction-btn{display:inline-flex;align-items:center;gap:4px;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius-pill);padding:5px 12px;font-size:13px;cursor:pointer;transition:.15s ease}
.reaction-btn:hover,.reaction-btn.active{background:var(--primary-lt);border-color:var(--primary);color:var(--primary-dk);font-weight:600}
.toggle-comments-btn{margin-left:auto;background:none;border:none;font-size:12px;color:var(--muted);cursor:pointer;font-weight:600}
.comments-section{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.comment-item{background:var(--paper-2);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:8px;font-size:13px}
.comment-item .c-head{display:flex;justify-content:space-between;margin-bottom:4px}
.comment-item .c-author{font-weight:700;color:var(--ink)}
.comment-item .c-time{font-size:11px;color:var(--muted)}
.comment-input-box{display:flex;gap:8px;margin-top:10px}
.comment-input-box input{flex:1;border:1px solid var(--line);border-radius:var(--radius-pill);padding:8px 14px;font-size:13px;outline:none}

.two-col{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start}
@media (max-width:900px){.two-col{grid-template-columns:1fr}}
.side-card+.side-card{margin-top:18px}
.side-card h3{font-size:14px;margin-bottom:12px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.25s;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.overlay-bg{position:fixed;inset:0;background:rgba(22,36,31,.4);z-index:15;display:none}
.overlay-bg.show{display:block}
.demo-badge{position:fixed;top:10px;right:10px;z-index:200;background:var(--ink);color:#fff;font-family:var(--f-mono);font-size:10px;padding:5px 10px;border-radius:var(--radius-pill);opacity:.7}
</style>
</head>
<body>
<div id="root"></div>
<div class="demo-badge">FASA · protótipo demo</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://qhmjrdnxjkpqxijhxjuv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_pdI7QD_wTeWcGO1vn1cETg_xnUXUDbz';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const FASA = (() => {
  let _db = null;
  let _session = null;
  const EMOJIS = ['❤️', '👍', '👏', '💡', '🔥'];

  const NAV_ITEMS = [
    { id: 'feed', icon: '🏠', label: 'Início' },
    { id: 'perfil', icon: '👤', label: 'Meu Perfil' },
    { id: 'chat', icon: '💬', label: 'Chat' },
    { id: 'avisos', icon: '📢', label: 'Avisos' },
    { id: 'escala', icon: '📅', label: 'Escalas' },
    { id: 'biblioteca', icon: '📚', label: 'Biblioteca' },
    { id: 'enquetes', icon: '📊', label: 'Enquetes' },
    { id: 'sugestoes', icon: '💡', label: 'Sugestões' },
    { id: 'ranking', icon: '🏆', label: 'Reconhecimento' },
  ];

  function seed() {
    if (_db) return;
    const now = Date.now();
    _db = {
      usuarios: [
        { id: 'u1', nome: 'Alexandre', matricula: '30001', cargo: 'Técnico de Farmácia', setor: 'Farmácia', email: 'alexandre.jsilva.ajs@gmail.com', bio: 'Focado na excelência do atendimento e cuidados com o paciente. 💊', conexoes: 42, foto_url: '', pontos: 260 },
        { id: 'u2', nome: 'Thais', matricula: '30002', cargo: 'Coordenadora', setor: 'Farmácia', email: 'thais@fasa.local', bio: 'Coordenando com paixão!', conexoes: 58, pontos: 480 },
        { id: 'u3', nome: 'Camila', matricula: '30003', cargo: 'Farmacêutica', setor: 'Farmácia', email: 'camila@fasa.local', bio: 'Farmácia clínica e cuidados intensivos.', conexoes: 35, pontos: 400 },
      ],
      posts: [
        { id: 'p1', autorId: 'u1', texto: 'Iniciando o turno com foco total na dispensação rápida e segura! Bom trabalho a todos.', ts: now - 3600e3 * 2, reacoes: { '❤️': ['u2', 'u3'] }, comentarios: [{ autorId: 'u2', texto: 'Bom turno, Alexandre!', ts: now - 3400e3 }] },
      ]
    };
  }

  function getDB() { return _db; }
  function saveDB(db) { _db = db; }
  function getSession() { return _session; }
  function setSession(userId) { _session = { userId, ts: Date.now() }; }
  function clearSession() { _session = null; }
  function currentUser() {
    const s = getSession();
    return s ? getDB().usuarios.find(u => u.id === s.userId) || null : null;
  }
  function initials(nome) { return (nome || '?').split(' ').filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase(); }
  function avatarHtml(pessoa, sizeClass = '') {
    const cls = ('avatar ' + sizeClass).trim();
    if (pessoa && pessoa.foto_url) {
      return `<div class="${cls}" style="padding:0;overflow:hidden"><img src="${pessoa.foto_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%"></div>`;
    }
    return `<div class="${cls}">${initials((pessoa && pessoa.nome) || '?')}</div>`;
  }
  function timeAgo(ts) {
    const h = Math.floor((Date.now() - ts) / 3600e3);
    return h < 1 ? 'agora há pouco' : h < 24 ? `há ${h}h` : `há ${Math.floor(h / 24)}d`;
  }
  function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function logoMark(size = 30) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="12" fill="#1F6F5C"/><rect x="9" y="17" width="22" height="10" rx="5" fill="#F3F7F3"/><rect x="9" y="17" width="11" height="10" rx="5" fill="#E8873A"/></svg>`;
  }
  function toast(msg) {
    let el = document.querySelector('.toast');
    if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
    el.textContent = msg; el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2200);
  }
  function go(route) { location.hash = '#/' + route; }

  return { seed, getDB, saveDB, getSession, setSession, clearSession, currentUser, initials, avatarHtml, timeAgo, escapeHtml, logoMark, toast, go, EMOJIS, NAV_ITEMS };
})();

const root = document.getElementById('root');

function renderShell(activeId, title) {
  const user = FASA.currentUser();
  root.innerHTML = `
    <div class="overlay-bg" id="fasa-overlay"></div>
    <div class="app-shell">
      <aside class="sidebar" id="fasa-sidebar">
        <div class="brand">${FASA.logoMark(30)} FASA</div>
        <nav class="nav-group" id="fasa-nav"></nav>
        <div class="sidebar-user">
          ${FASA.avatarHtml(user, 'sm')}
          <div class="who"><div class="name">${FASA.escapeHtml(user.nome)}</div><div class="role">${FASA.escapeHtml(user.cargo)}</div></div>
          <button class="logout-btn" id="fasa-logout" title="Sair">⏻</button>
        </div>
      </aside>
      <div class="main">
        <div class="topbar">
          <div style="display:flex;align-items:center;gap:10px">
            <button class="menu-btn" id="fasa-menu-btn">☰</button>
            <h2>${title}</h2>
          </div>
          <div class="topbar-search">🔍 <input placeholder="Pesquisar no FASA..."></div>
        </div>
        <div class="page" id="fasa-page"></div>
      </div>
    </div>`;

  const navEl = document.getElementById('fasa-nav');
  navEl.innerHTML = FASA.NAV_ITEMS.map(it => `
    <a class="nav-item ${it.id === activeId ? 'active' : ''}" data-route="${it.id}"><span class="ic">${it.icon}</span>${it.label}</a>
  `).join('');

  navEl.querySelectorAll('.nav-item').forEach(a => a.addEventListener('click', () => FASA.go(a.dataset.route)));
  document.getElementById('fasa-logout').addEventListener('click', async () => { await sb.auth.signOut(); FASA.clearSession(); FASA.go('login'); });
  return { user, pageEl: document.getElementById('fasa-page') };
}

function renderPostCardHTML(post, user) {
  const db = FASA.getDB();
  const autor = db.usuarios.find(u => u.id === post.autorId) || { nome: 'Usuário', cargo: 'Equipe' };
  if (!post.reacoes) post.reacoes = {};
  if (!post.comentarios) post.comentarios = [];

  const emojisButtons = FASA.EMOJIS.map(emoji => {
    const count = (post.reacoes[emoji] || []).length;
    const reacted = (post.reacoes[emoji] || []).includes(user.id);
    return `<button class="reaction-btn ${reacted ? 'active' : ''}" data-post="${post.id}" data-emoji="${emoji}">
      <span>${emoji}</span> ${count > 0 ? `<span>${count}</span>` : ''}
    </button>`;
  }).join('');

  const commentsListHTML = post.comentarios.map(c => {
    const cAutor = db.usuarios.find(u => u.id === c.autorId) || { nome: 'Usuário' };
    return `<div class="comment-item">
      <div class="c-head"><span class="c-author">${FASA.escapeHtml(cAutor.nome)}</span><span class="c-time">${FASA.timeAgo(c.ts)}</span></div>
      <div>${FASA.escapeHtml(c.texto)}</div>
    </div>`;
  }).join('');

  return `
    <div class="card post">
      <div class="post-head">
        ${FASA.avatarHtml(autor)}
        <div class="meta"><div class="name">${FASA.escapeHtml(autor.nome)}</div><div class="sub">${FASA.escapeHtml(autor.cargo)} · ${FASA.timeAgo(post.ts)}</div></div>
      </div>
      <div class="post-body">${FASA.escapeHtml(post.texto)}</div>
      <div class="reactions-bar">
        ${emojisButtons}
        <button class="toggle-comments-btn">💬 ${post.comentarios.length} comentários</button>
      </div>
      <div class="comments-section">
        <div class="comments-list">${commentsListHTML}</div>
        <div class="comment-input-box">
          <input type="text" placeholder="Escreva um comentário..." id="cinput-${post.id}">
          <button class="btn btn-primary btn-sm" data-btn-comment="${post.id}">Enviar</button>
        </div>
      </div>
    </div>`;
}

/* ---------------- MEU PERFIL (Estilo Facebook no Layout FASA) ---------------- */
function renderPerfil() {
  const { user, pageEl } = renderShell('perfil', 'Meu Perfil');
  const db = FASA.getDB();

  function draw() {
    const meusPosts = db.posts.filter(p => p.autorId === user.id);

    pageEl.innerHTML = `
      <!-- Banner de Capa + Foto de Perfil estilo Facebook -->
      <div class="card profile-header-card">
        <div class="profile-cover"></div>
        <div class="profile-info-bar">
          ${FASA.avatarHtml(user, 'lg')}
          <div class="profile-details">
            <h1>${FASA.escapeHtml(user.nome)}</h1>
            <div class="bio">${FASA.escapeHtml(user.bio || 'Sem biografia definida.')}</div>
            <div style="display:flex;gap:12px;font-size:12.5px;color:var(--muted)">
              <span>💼 <b>${FASA.escapeHtml(user.cargo)}</b></span>
              <span>🏢 <b>${FASA.escapeHtml(user.setor)}</b></span>
              <span>👥 <b>${user.conexoes || 0} conexões</b></span>
            </div>
          </div>
          <button class="btn btn-ghost btn-sm" id="btn-edit-perfil">✏️ Editar Perfil</button>
        </div>
      </div>

      <div class="two-col">
        <!-- Coluna Principal: Feed do Usuário -->
        <div>
          <!-- Publicar direto do Perfil -->
          <div class="card composer">
            ${FASA.avatarHtml(user)}
            <div style="flex:1">
              <textarea id="perfil-text" placeholder="No que você está pensando, ${FASA.escapeHtml(user.nome)}?"></textarea>
              <div class="composer-actions">
                <span class="eyebrow">Publicação no Perfil</span>
                <button class="btn btn-primary btn-sm" id="btn-publish-perfil">Publicar</button>
              </div>
            </div>
          </div>

          <div id="perfil-posts-list">
            ${meusPosts.length > 0 ? meusPosts.map(p => renderPostCardHTML(p, user)).join('') : '<div class="card empty"><p>Nenhuma publicação ainda.</p></div>'}
          </div>
        </div>

        <!-- Coluna Lateral: Sobre / Informações -->
        <div>
          <div class="card side-card">
            <h3>Sobre</h3>
            <p style="font-size:13px;color:var(--ink-soft);line-height:1.5">
              <b>Matrícula:</b> ${FASA.escapeHtml(user.matricula)}<br>
              <b>E-mail:</b> ${FASA.escapeHtml(user.email)}<br>
              <b>Pontos:</b> 🏆 ${user.pontos || 0} pts
            </p>
          </div>
        </div>
      </div>
    `;

    // Ação do Botão Editar Perfil
    document.getElementById('btn-edit-perfil').addEventListener('click', () => {
      const novaBio = prompt('Atualize sua Biografia:', user.bio || '');
      const novaFoto = prompt('Cole a URL da sua Foto de Perfil:', user.foto_url || '');
      
      if (novaBio !== null) user.bio = novaBio.trim();
      if (novaFoto !== null) user.foto_url = novaFoto.trim();
      
      FASA.saveDB(db);
      FASA.toast('Perfil atualizado com sucesso!');
      draw();
    });

    // Ação do Botão Publicar no Perfil
    document.getElementById('btn-publish-perfil').addEventListener('click', () => {
      const txt = document.getElementById('perfil-text').value.trim();
      if (!txt) return;
      db.posts.unshift({
        id: 'p_' + Date.now(),
        autorId: user.id,
        texto: txt,
        ts: Date.now(),
        reacoes: {},
        comentarios: []
      });
      FASA.saveDB(db);
      FASA.toast('Publicado!');
      draw();
    });
  }

  draw();
}

function renderFeed() { renderPerfil(); } // Redirecionador temporário

function handleRoute() {
  FASA.seed();
  const route = location.hash.replace('#/', '') || 'perfil';
  const user = FASA.currentUser() || FASA.getDB().usuarios[0];
  FASA.setSession(user.id);
  
  if (route === 'perfil' || route === 'feed') renderPerfil();
  else renderShell(route, route.toUpperCase());
}

window.addEventListener('hashchange', handleRoute);
window.addEventListener('DOMContentLoaded', handleRoute);
</script>
</body>
</html>
