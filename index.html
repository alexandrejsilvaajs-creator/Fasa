<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FASA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f5f5}
.auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#164F41,#1F6F5C)}
.auth h1{color:#fff;margin-bottom:20px}
.auth-box{background:#fff;padding:30px;border-radius:16px;width:100%;max-width:400px}
.btn{background:#1F6F5C;color:#fff;padding:12px;border:none;border-radius:8px;width:100%;font-size:16px;cursor:pointer;margin-top:10px}
input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}
.error{color:red;background:#fee;padding:10px;border-radius:8px;margin-bottom:10px;display:none}
.error.show{display:block}
.card{background:#fff;padding:20px;margin:16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.topbar{background:#1F6F5C;color:#fff;padding:16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.menu-btn{background:none;border:none;color:#fff;font-size:24px;cursor:pointer}
.notification-btn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;position:relative}
.notification-btn .badge{position:absolute;top:-8px;right:-8px;background:red;color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;display:flex;align-items:center;justify-content:center}
.sidebar{position:fixed;left:0;top:0;width:260px;height:100vh;background:#fff;box-shadow:2px 0 8px rgba(0,0,0,.1);transform:translateX(-100%);transition:.3s;z-index:1000;padding:20px}
.sidebar.open{transform:translateX(0)}
.nav-item{padding:15px;border-bottom:1px solid #eee;cursor:pointer}
.nav-item:active{background:#e0e0e0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:999}
.overlay.show{display:block}
.post{margin-bottom:16px}
.post-header{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:#1F6F5C;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold}
.notifications-panel{position:fixed;right:0;top:0;width:350px;height:100vh;background:#fff;box-shadow:-2px 0 8px rgba(0,0,0,.1);z-index:1001;transform:translateX(100%);transition:.3s;padding:20px;overflow-y:auto}
.notifications-panel.open{transform:translateX(0)}
.notifications-panel h3{margin-bottom:15px;padding-bottom:10px;border-bottom:2px solid #eee}
.notification-item{padding:12px;margin-bottom:10px;border-left:4px solid #1F6F5C;background:#f9f9f9;border-radius:4px;cursor:pointer}
.notification-item.unread{background:#e8f4f1;font-weight:600}
.notification-item:active{background:#e0e0e0}
.notification-item .time{font-size:11px;color:#666;margin-top:4px}
.notification-item .action{font-size:12px;color:#1F6F5C;margin-top:6px}
.close-notifications{background:none;border:none;font-size:24px;cursor:pointer;float:right}
.empty-notifs{color:#666;text-align:center;padding:20px}
.mark-all-read{background:#1F6F5C;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;margin-top:10px;width:100%}
</style>
</head>
<body>
<div id="app"></div>
<script>
let currentUser=null;
let db=JSON.parse(localStorage.getItem('fasa_db'))||null;
let showNotifications=false;

function initDB(){
  if(!db){
    db={
      users:[
        {id:'u1',nome:'Alexandre',cargo:'Técnico de Farmácia',setor:'Farmácia',email:'alexandre@fasa.local',senha:'123456',admin:true,pontos:260},
        {id:'u2',nome:'Thais',cargo:'Coordenadora',setor:'Farmácia',email:'thais@fasa.local',senha:'123456',admin:true,pontos:480},
        {id:'u3',nome:'Camila',cargo:'Farmacêutica',setor:'Farmácia',email:'camila@fasa.local',senha:'123456',admin:false,pontos:400}
      ],
      posts:[
        {id:'p1',userId:'u2',content:'Bom dia equipe! Lembrem-se de conferir as validades.',timestamp:Date.now()-3600000,likes:[],comments:[]},
        {id:'p2',userId:'u1',content:'Alguém tem o contato do plantão de hoje?',timestamp:Date.now()-7200000,likes:['u2'],comments:[]}
      ],
      avisos:[{id:'a1',titulo:'Feriado',texto:'Escala disponível',timestamp:Date.now()-86400000}],
      notifications:[],
      enquetes:[],
      sugestoes:[],
      escalas:[],
      biblioteca:[],
      chats:[]
    };
    localStorage.setItem('fasa_db',JSON.stringify(db));
  }
}

function saveDB(){localStorage.setItem('fasa_db',JSON.stringify(db));}

function createNotification(userId,postId,commenterName,commentText){
  const notification={
    id:'n'+Date.now(),
    userId:userId,
    postId:postId,
    commenterName:commenterName,
    commentText:commentText,
    timestamp:Date.now(),
    read:false
  };
  db.notifications.push(notification);
  saveDB();
}

function getUnreadNotificationsCount(userId){
  return db.notifications.filter(n=>n.userId===userId && !n.read).length;
}

function login(email,senha){
  const user=db.users.find(u=>u.email===email&&u.senha===senha);
  if(user){
    currentUser=user;
    localStorage.setItem('fasa_user',JSON.stringify(user));
    render();
  }else{
    const err=document.getElementById('loginErr');
    if(err)err.classList.add('show');
  }
}

function logout(){
  currentUser=null;
  localStorage.removeItem('fasa_user');
  render();
}

function render(){
  const app=document.getElementById('app');
  if(!currentUser){
    app.innerHTML='<div class="auth"><h1>💊 FASA</h1><div class="auth-box"><h2 style="margin-bottom:10px">Bem-vindo de volta</h2><p style="color:#666;margin-bottom:20px">Entre com seu e-mail para acessar o FASA.</p><div id="loginErr" class="error">E-mail ou senha inválidos</div><div style="margin-bottom:12px"><label style="font-size:12px;font-weight:600;color:#666">E-mail</label><input type="email" id="email" value="alexandre@fasa.local"></div><div style="margin-bottom:12px"><label style="font-size:12px;font-weight:600;color:#666">Senha</label><input type="password" id="senha" value="123456"></div><button class="btn" onclick="login(document.getElementById(\'email\').value,document.getElementById(\'senha\').value)">Entrar</button><p style="text-align:center;margin-top:20px;font-size:13px;color:#666">Não tem conta? <a href="#" style="color:#1F6F5C">Como pedir acesso</a></p></div></div>';
  }else{
    app.innerHTML='<div class="overlay" id="overlay" onclick="toggleMenu()"></div><div class="sidebar" id="sidebar"><h2 style="margin-bottom:20px">💊 FASA</h2><div class="nav-item" onclick="setView(\'feed\')">🏠 Início</div><div class="nav-item" onclick="setView(\'perfil\')">👤 Meu Perfil</div><div class="nav-item" onclick="setView(\'avisos\')">📢 Avisos</div><div class="nav-item" onclick="logout()" style="color:red;margin-top:20px">🚪 Sair</div></div><div class="topbar"><button class="menu-btn" onclick="toggleMenu()">☰</button><h2 id="pageTitle">Início</h2><button class="notification-btn" onclick="toggleNotifications()">🔔<span id="notifBadge" class="badge" style="display:none">0</span></button></div><div id="content" style="padding:20px;max-width:900px"></div><div class="notifications-panel" id="notifPanel"><button class="close-notifications" onclick="toggleNotifications()">×</button><h3>Notificações</h3><div id="notifList"></div><button class="mark-all-read" onclick="markAllAsRead()">Marcar todas como lidas</button></div>';
    renderFeed();
  }
}

function toggleMenu(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

function toggleNotifications(){
  showNotifications=!showNotifications;
  const panel=document.getElementById('notifPanel');
  if(showNotifications){
    panel.classList.add('open');
    renderNotifications();
    updateBadge();
  }else{
    panel.classList.remove('open');
  }
}

function updateBadge(){
  const badge=document.getElementById('notifBadge');
  const count=getUnreadNotificationsCount(currentUser.id);
  if(count>0){
    badge.textContent=count;
    badge.style.display='flex';
  }else{
    badge.style.display='none';
  }
}

function renderNotifications(){
  const userNotifs=db.notifications.filter(n=>n.userId===currentUser.id).sort((a,b)=>b.timestamp-a.timestamp);
  const list=document.getElementById('notifList');
  if(userNotifs.length===0){
    list.innerHTML='<div class="empty-notifs">Nenhuma notificação</div>';
    return;
  }
  list.innerHTML=userNotifs.map(n=>{
    const post=db.posts.find(p=>p.id===n.postId);
    const time=new Date(n.timestamp).toLocaleString('pt-BR');
    return '<div class="notification-item '+(!n.read?'unread':'')+'" onclick="goToPost(\''+n.postId+'\')"><div><b>'+n.commenterName+'</b> comentou na sua publicação</div><div style="font-size:12px;color:#666;margin-top:4px">"'+n.commentText.substring(0,50)+(n.commentText.length>50?'...':'')+'"</div><div class="time">'+time+'</div><div class="action">Ver publicação →</div></div>';
  }).join('');
}

function goToPost(postId){
  showNotifications=false;
  document.getElementById('notifPanel').classList.remove('open');
  const postEl=document.querySelector('[data-postid="'+postId+'"]');
  if(postEl){
    postEl.scrollIntoView({behavior:'smooth'});
    postEl.style.background='#e8f4f1';
    setTimeout(()=>postEl.style.background='#fff',2000);
  }
  markAllAsRead();
}

function markAllAsRead(){
  db.notifications.forEach(n=>{
    if(n.userId===currentUser.id)n.read=true;
  });
  saveDB();
  renderNotifications();
  updateBadge();
}

function setView(view){
  if(view==='feed')renderFeed();
  else if(view==='perfil')renderPerfil();
  else if(view==='avisos')renderAvisos();
  toggleMenu();
}

function renderFeed(){
  document.getElementById('pageTitle').textContent='Início';
  updateBadge();
  const posts=db.posts.map(p=>{
    const user=db.users.find(u=>u.id===p.userId);
    const commentsHtml=(p.comments||[]).map(c=>{
      const commenter=db.users.find(u=>u.id===c.userId);
      return '<div class="comment-item"><b>'+(commenter?commenter.nome:'')+'</b>: '+c.text+'</div>';
    }).join('');
    return '<div class="card post" data-postid="'+p.id+'"><div class="post-header"><div class="avatar">'+(user?user.nome[0]:'?')+'</div><div><b>'+(user?user.nome:'')+'</b><div style="font-size:12px;color:#666">'+(user?user.cargo:'')+'</div></div></div><div>'+p.content+'</div><div style="margin-top:12px;padding-top:12px;border-top:1px solid #eee"><button style="background:none;border:none;color:#1F6F5C;cursor:pointer;font-size:13px" onclick="toggleCommentBox(\''+p.id+'\')">💬 Comentar ('+(p.comments?p.comments.length:0)+')</button></div><div id="commentBox-'+p.id+'" style="display:none;margin-top:10px"><textarea id="commentText-'+p.id+'" placeholder="Escreva um comentário..." style="min-height:40px;margin-bottom:8px"></textarea><button class="btn" onclick="addComment(\''+p.id+'\')">Enviar comentário</button></div><div style="margin-top:10px">'+commentsHtml+'</div></div>';
  }).join('');
  document.getElementById('content').innerHTML='<div class="card"><textarea id="newPost" placeholder="No que você está pensando?" style="min-height:60px;margin-bottom:10px"></textarea><button class="btn" onclick="addPost()">Publicar</button></div>'+posts;
}

function toggleCommentBox(postId){
  const box=document.getElementById('commentBox-'+postId);
  box.style.display=box.style.display==='none'?'block':'none';
}

function addComment(postId){
  const text=document.getElementById('commentText-'+postId).value;
  if(!text)return;
  const post=db.posts.find(p=>p.id===postId);
  if(!post.comments)post.comments=[];
  post.comments.push({userId:currentUser.id,text:text,timestamp:Date.now()});
  
  // Criar notificação se o comentário não for do próprio autor
  if(post.userId!==currentUser.id){
    createNotification(post.userId,postId,currentUser.nome,text);
  }
  
  saveDB();
  renderFeed();
}

function renderPerfil(){
  const posts=db.posts.filter(p=>p.userId===currentUser.id);
  document.getElementById('pageTitle').textContent='Meu Perfil';
  document.getElementById('content').innerHTML='<div class="card"><h2>'+currentUser.nome+'</h2><p style="color:#666">'+currentUser.cargo+'</p><p>Pontos: '+currentUser.pontos+'</p></div><div class="card"><h3>Minhas publicações ('+posts.length+')</h3>'+posts.map(p=>'<div style="padding:12px 0;border-bottom:1px solid #eee">'+p.content+'</div>').join('')+'</div>';
}

function renderAvisos(){
  const avisos=db.avisos.map(a=>'<div class="card"><h3>'+a.titulo+'</h3><p>'+a.texto+'</p></div>').join('');
  document.getElementById('pageTitle').textContent='Avisos';
  document.getElementById('content').innerHTML=avisos||'<div class="card">Nenhum aviso</div>';
}

function addPost(){
  const content=document.getElementById('newPost').value;
  if(content){
    db.posts.unshift({id:'p'+Date.now(),userId:currentUser.id,content:content,timestamp:Date.now(),likes:[],comments:[]});
    saveDB();
    renderFeed();
  }
}

initDB();
const savedUser=localStorage.getItem('fasa_user');
if(savedUser)currentUser=JSON.parse(savedUser);
render();
</script>
</body>
</html>
