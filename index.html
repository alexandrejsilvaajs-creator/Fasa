    </div>
    <div class="auth-form-wrap">
      <div class="auth-form" id="login-form">
        <div class="mark-mobile">${FASA.logoMark(34)}<span>FASA</span></div>
        <h1>Bem-vindo de volta</h1>
        <p class="sub">Entre com seu e-mail para acessar o FASA.</p>
        <div class="err" id="login-err">E-mail ou senha inválidos.</div>
        <div class="field"><label>E-mail</label><input id="usuario" type="text" placeholder="voce@email.com" value="alexandre.jsilva.ajs@gmail.com"></div>
        <div class="field"><label>Senha</label><input id="senha" type="password" placeholder="••••••••" value="Farmaciasat@2026"></div>
        <div class="field-row">
          <label class="checkline"><input type="checkbox"> Lembrar acesso</label>
          <a href="#" class="link" id="forgot-link">Esqueci minha senha</a>
        </div>
        <button type="button" id="login-submit" class="btn btn-primary btn-block">Entrar</button>
        <p class="form-foot">Não tem conta? <a class="link" id="go-cadastro">Como pedir acesso</a></p>
      </div>
    </div>
  </div>`;

  document.getElementById('go-cadastro').addEventListener('click', () => FASA.go('cadastro'));
  document.getElementById('forgot-link').addEventListener('click', (e) => {
    e.preventDefault();
    FASA.toast('Link de redefinição enviado para o seu e-mail (simulado).');
  });

  async function doLogin() {
    const email = document.getElementById('usuario').value.trim().toLowerCase();
    const senha = document.getElementById('senha').value;
    const errBox = document.getElementById('login-err');
    const btn = document.getElementById('login-submit');
    errBox.classList.remove('show');
    btn.textContent = 'Entrando...';
    btn.disabled = true;

    const { data: loginData, error: loginError } = await sb.auth.signInWithPassword({ email, password: senha });
    if (loginError) {
      errBox.textContent = 'E-mail ou senha inválidos.';
      errBox.classList.add('show');
      btn.textContent = 'Entrar';
      btn.disabled = false;
      return;
    }

    const { data: perfil, error: perfilError } = await sb.from('usuarios').select('*').eq('id', loginData.user.id).single();
    if (perfilError || !perfil) {
      errBox.textContent = 'Login funcionou, mas seu perfil ainda não foi cadastrado. Fale com a liderança.';
      errBox.classList.add('show');
      btn.textContent = 'Entrar';
      btn.disabled = false;
      return;
    }

    // mescla o perfil real no "banco" local, pra telas ainda não migradas
    // (Chat, Admin, etc.) continuarem funcionando com seu nome/cargo reais
    FASA.seed();
    const db = FASA.getDB();
    const jaExiste = db.usuarios.find(u => u.id === perfil.id);
    if (jaExiste) {
      Object.assign(jaExiste, perfil);
    } else {
      db.usuarios.unshift(perfil);
    }
    FASA.saveDB(db);
    FASA.setSession(perfil.id);
    FASA.go('feed');
  }
  document.getElementById('login-submit').addEventListener('click', doLogin);
  document.getElementById('senha').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  document.getElementById('usuario').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
}

/* ---------------- Feed ---------------- */
function renderFeed() {
  const { user, pageEl } = renderShell('feed', 'Início');
  let arquivoSelecionado = null;

  async function fetchPosts() {
    const { data, error } = await sb
      .from('posts')
      .select('*, usuarios!posts_autor_id_fkey(nome,cargo,foto_url), post_likes(usuario_id), comentarios(id,autor_id,texto,criado_em,usuarios!comentarios_autor_id_fkey(nome,foto_url))')
      .order('criado_em', { ascending: false });
    if (error) { FASA.toast('Erro ao carregar posts: ' + error.message); return []; }
    return data;
  }

  function anexoHtml(p) {
    if (!p.arquivo_url) return '';
    if ((p.arquivo_tipo || '').startsWith('image/')) {
      return `<img src="${p.arquivo_url}" style="max-width:100%;border-radius:10px;margin-bottom:12px;display:block">`;
    }
    return `<a href="${p.arquivo_url}" target="_blank" style="display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:12px;font-size:13px;color:var(--primary-dk)">📎 ${p.arquivo_nome || 'Anexo'}</a>`;
  }

  function postsHtml(list) {
    return list.map(p => {
      const autor = p.usuarios || { nome: 'Ex-colaborador', cargo: '' };
      const likes = p.post_likes || [];
      const liked = likes.some(l => l.usuario_id === user.id);
      const comentarios = (p.comentarios || []).sort((a, b) => new Date(a.criado_em) - new Date(b.criado_em));
      const souAutor = p.autor_id === user.id;
      return `
      <div class="card post" data-id="${p.id}">
        <div class="post-head">${FASA.avatarHtml(autor)}
          <div class="meta" style="flex:1"><div class="name">${autor.nome}</div><div class="sub">${autor.cargo || ''} · ${FASA.timeAgo(new Date(p.criado_em).getTime())}</div></div>
          ${souAutor ? '<button class="icon-btn del-post-btn" title="Excluir publicação">🗑</button>' : ''}
        </div>
        <div class="post-body">${FASA.escapeHtml(p.texto)}</div>
        ${anexoHtml(p)}
        <div class="post-actions">
          <button class="like-btn ${liked ? 'liked' : ''}">${liked ? '❤️' : '🤍'} Curtir ${likes.length ? `(${likes.length})` : ''}</button>
          <button class="comment-btn">💬 Comentar ${comentarios.length ? `(${comentarios.length})` : ''}</button>
          <button class="share-btn">↗ Compartilhar</button>
        </div>
        <div class="comments-list">${comentarios.map(c => `<div class="comment-item"><b>${(c.usuarios || {}).nome || 'Colaborador'}</b><br>${FASA.escapeHtml(c.texto)}</div>`).join('')}</div>
        <div class="comment-box"><input type="text" placeholder="Escreva um comentário..."><button class="btn btn-sm btn-primary send-comment">Enviar</button></div>
      </div>`;
    }).join('') || `<div class="empty"><div class="big">📭</div>Ainda não há publicações. Seja o primeiro a postar!</div>`;
  }

  function side() {
    const comms = FASA.COMUNIDADES.slice(0, 4);
    const emPlantao = FASA.getDB().usuarios.slice(0, 3);
    return `
    <div class="side-card card"><h3>Minhas comunidades</h3><div class="mini-list">
      ${comms.map(c => `<div class="mini-item"><div class="avatar sm" style="background:var(--accent)">${c.nome[0]}</div><div class="t"><div class="n">${c.nome}</div><div class="s">${c.membros} membros</div></div></div>`).join('')}
    </div><a class="btn btn-ghost btn-sm btn-block" style="margin-top:14px" data-route="comunidades">Ver todas</a></div>
    <div class="side-card card"><h3>Quem está de plantão agora</h3><div class="mini-list">
      ${emPlantao.map(u => `<div class="mini-item"><div class="avatar sm">${FASA.initials(u.nome)}</div><div class="t"><div class="n">${u.nome}</div><div class="s">${u.setor}</div></div><span class="pill live">on</span></div>`).join('')}
    </div><a class="btn btn-ghost btn-sm btn-block" style="margin-top:14px" data-route="escala">Ver escala completa</a></div>`;
  }

  function paintPreview() {
    const wrap = document.getElementById('anexo-preview-wrap');
    if (!arquivoSelecionado) { wrap.innerHTML = ''; return; }
    wrap.innerHTML = `<div style="display:flex;align-items:center;gap:8px;background:var(--paper-2);border-radius:var(--radius-sm);padding:6px 12px;font-size:12.5px;margin-top:8px">

    document.getElementById('anexo-remover').addEventListener('click', () => { arquivoSelecionado = null; paintPreview(); });
  }

  async function paint() {
    pageEl.innerHTML = `<div class="two-col"><div>
      <div class="card composer">${FASA.avatarHtml(user)}
        <div style="flex:1"><textarea id="post-text" placeholder="No que você está pensando, ${user.nome.split(' ')[0]}?"></textarea>

    </div><div>${side()}</div></div>`;

    document.getElementById('anexo-btn-composer').addEventListener('click', () => anexoInput.click());
    fotoInput.addEventListener('change', () => { if (fotoInput.files[0]) { arquivoSelecionado = fotoInput.files[0]; paintPreview(); } });
    anexoInput.addEventListener('change', () => { if (anexoInput.files[0]) { arquivoSelecionado = anexoInput.files[0]; paintPreview(); } });

    document.getElementById('post-submit').addEventListener('click', async () => {
      const ta = document.getElementById('post-text'), texto = ta.value.trim();
      if (!texto && !arquivoSelecionado) return;
      const btn = document.getElementById('post-submit');
      btn.disabled = true;
      btn.textContent = 'Publicando...';

      let payload = { autor_id: user.id, texto };
      if (arquivoSelecionado) {
        const path = `${user.id}/${Date.now()}-${arquivoSelecionado.name}`;
        const { error: upError } = await sb.storage.from('posts-media').upload(path, arquivoSelecionado);
        if (upError) { FASA.toast('Erro ao enviar arquivo: ' + upError.message); btn.disabled = false; btn.textContent = 'Publicar'; return; }
        const { data: pub } = sb.storage.from('posts-media').getPublicUrl(path);
        payload.arquivo_url = pub.publicUrl;
        payload.arquivo_tipo = arquivoSelecionado.type;
        payload.arquivo_nome = arquivoSelecionado.name;
      }

      const { error } = await sb.from('posts').insert(payload);
      btn.disabled = false;
      btn.textContent = 'Publicar';
      if (error) { FASA.toast('Erro ao publicar: ' + error.message); return; }
      ta.value = '';
      arquivoSelecionado = null;
      paintPreview();
      FASA.toast('Publicação criada!');
      refresh();
    });

    refresh();
  }

  async function refresh() {
    const list = await fetchPosts();
    const listEl = document.getElementById('posts-list');
    if (!listEl) return;
    listEl.innerHTML = postsHtml(list);
    bindPostEvents();
  }

  function bindPostEvents() {
    pageEl.querySelectorAll('.post').forEach(postEl => {
      const id = postEl.dataset.id;
      postEl.querySelector('.like-btn').addEventListener('click', async () => {
        const liked = postEl.querySelector('.like-btn').classList.contains('liked');
        if (liked) {
          await sb.from('post_likes').delete().eq('post_id', id).eq('usuario_id', user.id);
        } else {
          await sb.from('post_likes').insert({ post_id: id, usuario_id: user.id });
        }
        refresh();
      });
      postEl.querySelector('.comment-btn').addEventListener('click', () => postEl.querySelector('.comment-box').classList.toggle('open'));
      postEl.querySelector('.share-btn').addEventListener('click', () => FASA.toast('Publicação compartilhada no seu perfil!'));
      const sendBtn = postEl.querySelector('.send-comment');
      if (sendBtn) sendBtn.addEventListener('click', async () => {
        const input = postEl.querySelector('.comment-box input'), texto = input.value.trim();
        if (!texto) return;
        const { error } = await sb.from('comentarios').insert({ post_id: id, autor_id: user.id, texto });
        if (error) { FASA.toast('Erro ao comentar: ' + error.message); return; }
        refresh();
      });
      const delBtn = postEl.querySelector('.del-post-btn');
      if (delBtn) delBtn.addEventListener('click', async () => {
        if (!confirm('Excluir esta publicação? Essa ação não pode ser desfeita.')) return;
        const { error } = await sb.from('posts').delete().eq('id', id);
        if (error) { FASA.toast('Erro ao excluir: ' + error.message); return; }
        FASA.toast('Publicação excluída.');
        refresh();
      });
    });
  }

  paint();
}

/* ---------------- Perfil ---------------- */
async function renderPerfil() {
  const { user, pageEl } = renderShell('perfil', 'Meu Perfil');
  pageEl.innerHTML = `<div class="empty">Carregando perfil...</div>`;

  const { data: authData } = await sb.auth.getUser();
  const meuId = (authData && authData.user) ? authData.user.id : user.id;

  const { data: meusPosts, error } = await sb
    .from('posts')
    .select('*, post_likes(usuario_id)')
    .eq('autor_id', meuId)
    .order('criado_em', { ascending: false });

  if (error) { FASA.toast('Erro ao carregar perfil: ' + error.message); }
  const posts = meusPosts || [];
  const curtidasRecebidas = posts.reduce((s, p) => s + (p.post_likes || []).length, 0);

  const conquistas = [
    { ic: '🏅', t: 'Colaborador do mês', d: 'Reconhecido pela equipe' },
    { ic: '📚', t: 'Trilha concluída', d: 'Boas Práticas de Manipulação' },
    { ic: '💬', t: 'Voz ativa', d: '10+ contribuições em comunidades' },
  ];

  let editMode = false;

  function headerHtml() {
    const capaStyle = user.capa_url
      ? `background:url('${user.capa_url}') center/cover no-repeat`
      : `background:linear-gradient(135deg,var(--primary),var(--accent))`;

    if (!editMode) {
      return `
      <div class="card" style="padding:0;overflow:hidden;margin-bottom:20px">
        <div style="height:130px;position:relative;${capaStyle}">
          <button id="capa-btn" title="Alterar capa" style="position:absolute;bottom:10px;right:10px;background:rgba(22,36,31,.55);color:#fff;border:none;border-radius:var(--radius-pill);padding:6px 14px;font-size:12px;cursor:pointer">📷 Capa</button>
          <input type="file" id="capa-input" accept="image/*" style="display:none">
        </div>
        <div style="padding:0 20px 24px;text-align:center;margin-top:-40px">
          <div style="position:relative;width:80px;margin:0 auto 12px">
            ${FASA.avatarHtml(user, 'lg')}
            <button id="foto-btn" title="Alterar foto" style="position:absolute;bottom:-2px;right:-2px;width:26px;height:26px;border-radius:50%;background:var(--accent);border:2px solid #fff;color:#fff;font-size:12px;cursor:pointer">📷</button>
            <input type="file" id="foto-input" accept="image/*" style="display:none">
          </div>
          <h1 style="font-size:22px">${user.nome}</h1>
          <p style="color:var(--muted);font-size:13.5px;margin:4px 0 12px">${user.cargo || ''} · ${user.setor || ''}</p>
          ${user.bio ? `<p style="font-size:13.5px;color:var(--ink-soft);max-width:420px;margin:0 auto 14px">${FASA.escapeHtml(user.bio)}</p>` : ''}
          <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:16px">
            <span class="pill">Matrícula ${user.matricula}</span><span class="pill accent">${user.tempo_empresa || 'A definir'} de empresa</span>
            ${user.admin ? '<span class="pill muted">Administrador</span>' : ''}
          </div>
          <button class="btn btn-ghost btn-sm" id="edit-perfil-btn">✎ Editar perfil</button>
        </div>
      </div>`;
    }

    return `
      <div class="card" style="padding:0;overflow:hidden;margin-bottom:20px">
        <div style="height:130px;position:relative;${capaStyle}"></div>
        <div style="padding:20px">
          <h3 style="margin-bottom:14px">Editar perfil</h3>
          <div class="field"><label>Cargo</label><input id="ep-cargo" value="${user.cargo || ''}"></div>
          <div class="field"><label>Setor</label><input id="ep-setor" value="${user.setor || ''}"></div>
          <div class="field"><label>Tempo de empresa</label><input id="ep-tempo" value="${user.tempo_empresa || ''}"></div>
          <div class="field"><label>Bio (uma frase sobre você)</label><textarea id="ep-bio" rows="3" style="width:100%;padding:12px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit">${user.bio || ''}</textarea></div>
          <div style="display:flex;gap:10px">
            <button class="btn btn-primary" id="ep-salvar">Salvar</button>
            <button class="btn btn-ghost" id="ep-cancelar">Cancelar</button>
          </div>
        </div>
      </div>`;
  }

  function bindHeaderEvents() {
    if (!editMode) {
      document.getElementById('edit-perfil-btn').addEventListener('click', () => { editMode = true; paintHeader(); });

      const fotoBtn = document.getElementById('foto-btn');
      const fotoInput = document.getElementById('foto-input');
      fotoBtn.addEventListener('click', () => fotoInput.click());
      fotoInput.addEventListener('change', () => uploadImagem(fotoInput.files[0], 'avatar', 'foto_url', fotoBtn));

      const capaBtn = document.getElementById('capa-btn');
      const capaInput = document.getElementById('capa-input');
      capaBtn.addEventListener('click', () => capaInput.click());
      capaInput.addEventListener('change', () => uploadImagem(capaInput.files[0], 'capa', 'capa_url', capaBtn));
    } else {
      document.getElementById('ep-cancelar').addEventListener('click', () => { editMode = false; paintHeader(); });
      document.getElementById('ep-salvar').addEventListener('click', async () => {
        const cargo = document.getElementById('ep-cargo').value.trim();
        const setor = document.getElementById('ep-setor').value.trim();
        const tempo_empresa = document.getElementById('ep-tempo').value.trim();
        const bio = document.getElementById('ep-bio').value.trim();
        const { error: updError } = await sb.from('usuarios').update({ cargo, setor, tempo_empresa, bio }).eq('id', user.id);
        if (updError) { FASA.toast('Erro ao salvar: ' + updError.message); return; }
        Object.assign(user, { cargo, setor, tempo_empresa, bio });
        const db = FASA.getDB();
        const jaExiste = db.usuarios.find(u => u.id === user.id);
        if (jaExiste) Object.assign(jaExiste, { cargo, setor, tempo_empresa, bio });
        FASA.saveDB(db);
        editMode = false;
        FASA.toast('Perfil atualizado!');
        paintHeader();
      });
    }
  }

  async function uploadImagem(file, nomeArquivo, coluna, btnEl) {
    if (!file) return;
    btnEl.textContent = '…';
    const ext = file.name.split('.').pop();
    const path = `${user.id}/${nomeArquivo}.${ext}`;

    const { error: upError } = await sb.storage.from('avatars').upload(path, file, { upsert: true });
    if (upError) { FASA.toast('Erro ao enviar imagem: ' + upError.message); paintHeader(); return; }

    const { data: pub } = sb.storage.from('avatars').getPublicUrl(path);
    const url = pub.publicUrl + '?t=' + Date.now();

    const { error: updError } = await sb.from('usuarios').update({ [coluna]: url }).eq('id', user.id);
    if (updError) { FASA.toast('Erro ao salvar imagem: ' + updError.message); paintHeader(); return; }

    user[coluna] = url;
    const db = FASA.getDB();
    const jaExiste = db.usuarios.find(u => u.id === user.id);
    if (jaExiste) jaExiste[coluna] = url;
    FASA.saveDB(db);

    FASA.toast('Imagem atualizada!');
    paintHeader();
  }

  function paintHeader() {
    document.getElementById('perfil-header').outerHTML = `<div id="perfil-header">${headerHtml()}</div>`;
    bindHeaderEvents();
  }

  pageEl.innerHTML = `
    <div id="perfil-header">${headerHtml()}</div>
    <div class="grid grid-3" style="margin-bottom:20px">
      <div class="card stat-card"><div class="num">${posts.length}</div><div class="lbl">Publicações</div></div>
      <div class="card stat-card"><div class="num">${curtidasRecebidas}</div><div class="lbl">Curtidas recebidas</div></div>
      <div class="card stat-card"><div class="num">${user.pontos}</div><div class="lbl">Pontos de reconhecimento</div></div>
    </div>
    <div class="card" style="margin-bottom:20px"><h3 style="margin-bottom:14px">Conquistas</h3><div class="grid grid-3">
      ${conquistas.map(c => `<div style="text-align:center;padding:14px;border:1px solid var(--line);border-radius:var(--radius-sm)"><div style="font-size:26px;margin-bottom:6px">${c.ic}</div><div style="font-weight:700;font-size:13px">${c.t}</div><div style="font-size:11.5px;color:var(--muted)">${c.d}</div></div>`).join('')}
    </div></div>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h3>Minhas publicações</h3><button class="btn btn-ghost btn-sm" id="perfil-refresh-btn">↻ Atualizar</button></div>
      ${posts.length ? posts.map(p => `<div style="padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px"><div style="color:var(--muted);font-size:11.5px;margin-bottom:4px">${FASA.timeAgo(new Date(p.criado_em).getTime())}</div>${FASA.escapeHtml(p.texto)}</div>`).join('') : `<div class="empty">Você ainda não publicou nada.</div>`}
    </div>`;

  bindHeaderEvents();
  document.getElementById('perfil-refresh-btn').addEventListener('click', () => renderPerfil());
}

async function renderComunidades() {
  const { user, pageEl } = renderShell('comunidades', 'Comunidades');
  pageEl.innerHTML = `<div class="empty">Carregando comunidades...</div>`;

  async function load() {
    const { data: comunidades, error: e1 } = await sb.from('comunidades').select('*').order('nome');
    const { data: membros, error: e2 } = await sb.from('comunidade_membros').select('comunidade_id');
    const { data: minhas, error: e3 } = await sb.from('comunidade_membros').select('comunidade_id').eq('usuario_id', user.id);
    if (e1 || e2 || e3) { FASA.toast('Erro ao carregar comunidades'); return; }

    const contagem = {};
    (membros || []).forEach(m => { contagem[m.comunidade_id] = (contagem[m.comunidade_id] || 0) + 1; });
    const joined = new Set((minhas || []).map(m => m.comunidade_id));

    pageEl.innerHTML = `
      <p style="color:var(--muted);font-size:13.5px;margin-bottom:18px">Participe das comunidades da sua equipe para trocar experiências, tirar dúvidas e acompanhar novidades por setor.</p>
      <div class="grid grid-3">
        ${(comunidades || []).map(c => {
          const isIn = joined.has(c.id);
          return `<div class="card comm-card" data-id="${c.id}"><div class="comm-banner"></div><h3>${c.nome}</h3><div class="desc">${c.descricao || ''}</div>
          <div class="foot"><span class="pill muted">${contagem[c.id] || 0} membros</span><button class="btn btn-sm ${isIn ? 'btn-ghost' : 'btn-primary'} join-btn">${isIn ? 'Participando' : 'Participar'}</button></div></div>`;
        }).join('')}
      </div>`;

    pageEl.querySelectorAll('.comm-card').forEach(card => {
      card.querySelector('.join-btn').addEventListener('click', async () => {
        const id = card.dataset.id;
        if (joined.has(id)) {
          await sb.from('comunidade_membros').delete().eq('comunidade_id', id).eq('usuario_id', user.id);
        } else {
          await sb.from('comunidade_membros').insert({ comunidade_id: id, usuario_id: user.id });
        }
        load();
      });
    });
  }
  load();
}

/* ---------------- Escala ---------------- */
async function renderEscala() {
  const { pageEl } = renderShell('escala', 'Escalas');
  pageEl.innerHTML = `<div class="empty">Carregando escala...</div>`;

  const { data: rows, error } = await sb
    .from('escalas')
    .select('dia, turno, usuarios!escalas_usuario_id_fkey(nome)');
  if (error) { FASA.toast('Erro ao carregar escala: ' + error.message); }

  const ordemDias = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
  const grupos = {};
  (rows || []).forEach(r => {
    const chave = r.dia + '|' + r.turno;
    if (!grupos[chave]) grupos[chave] = { dia: r.dia, turno: r.turno, equipe: [] };
    grupos[chave].equipe.push((r.usuarios || {}).nome || '—');
  });
  const escala = Object.values(grupos).sort((a, b) => {
    const d = ordemDias.indexOf(a.dia) - ordemDias.indexOf(b.dia);
    return d !== 0 ? d : a.turno.localeCompare(b.turno);
  });

  pageEl.innerHTML = `
    <div class="card table-wrap"><table><thead><tr><th>Dia</th><th>Turno</th><th>Equipe escalada</th></tr></thead><tbody>
      ${escala.map(e => `<tr><td><b>${e.dia}</b></td><td><span class="pill ${e.turno === 'Manhã' ? '' : e.turno === 'Tarde' ? 'accent' : 'muted'}">${e.turno}</span></td><td>${e.equipe.join(', ')}</td></tr>`).join('') || `<tr><td colspan="3"><div class="empty">Nenhuma escala cadastrada ainda.</div></td></tr>`}
    </tbody></table></div>
    <p style="color:var(--muted);font-size:12.5px;margin-top:14px">A escala é definida pela liderança de cada setor e pode ser ajustada pela Administração.</p>`;
}

/* ---------------- Enquetes ---------------- */
function renderEnquetes() {
  const { user, pageEl } = renderShell('enquetes', 'Enquetes');
  let numOpcoes = 2;

  function formHtml() {
    if (!user.admin) return '';
    let campos = '';
    for (let i = 0; i < numOpcoes; i++) {
      campos += `<div class="field"><input class="eq-opcao" placeholder="Opção ${i + 1}"></div>`;
    }
    return `<div class="card" style="margin-bottom:20px">
      <h3 style="margin-bottom:12px">Criar enquete</h3>
      <div class="field"><input id="eq-pergunta" placeholder="Qual é a pergunta?"></div>
      <div id="eq-opcoes-wrap">${campos}</div>
      <div style="display:flex;gap:10px;margin-bottom:14px">
        <button class="btn btn-ghost btn-sm" id="eq-add-opcao" type="button">+ Adicionar opção</button>
      </div>
      <button class="btn btn-accent" id="eq-submit">Criar enquete</button>
    </div>`;
  }

  function bindForm() {
    if (!user.admin) return;
    document.getElementById('eq-add-opcao').addEventListener('click', () => {
      if (numOpcoes >= 10) { FASA.toast('Máximo de 10 opções.'); return; }
      numOpcoes++;
      document.getElementById('eq-opcoes-wrap').innerHTML = Array.from({ length: numOpcoes }).map((_, i) => `<div class="field"><input class="eq-opcao" placeholder="Opção ${i + 1}"></div>`).join('');
    });
    document.getElementById('eq-submit').addEventListener('click', async () => {
      const pergunta = document.getElementById('eq-pergunta').value.trim();
      const opcoes = [...pageEl.querySelectorAll('.eq-opcao')].map(i => i.value.trim()).filter(Boolean);
      if (!pergunta || opcoes.length < 2) { FASA.toast('Escreva a pergunta e pelo menos 2 opções.'); return; }
      const { data: enq, error: e1 } = await sb.from('enquetes').insert({ pergunta }).select().single();
      if (e1) { FASA.toast('Erro ao criar enquete: ' + e1.message); return; }
      const { error: e2 } = await sb.from('enquete_opcoes').insert(opcoes.map(texto => ({ enquete_id: enq.id, texto })));
      if (e2) { FASA.toast('Erro ao criar opções: ' + e2.message); return; }
      FASA.toast('Enquete criada!');
      numOpcoes = 2;
      paint();
    });
  }

  async function paint() {
    pageEl.innerHTML = `<div class="empty">Carregando enquetes...</div>`;
    const { data: enquetes, error: e1 } = await sb.from('enquetes').select('*, enquete_opcoes(*)').order('criado_em', { ascending: false });
    const { data: meusVotos, error: e2 } = await sb.from('enquete_votos').select('enquete_id, opcao_id').eq('usuario_id', user.id);
    if (e1 || e2) { FASA.toast('Erro ao carregar enquetes'); return; }
    const votosMap = {};
    (meusVotos || []).forEach(v => { votosMap[v.enquete_id] = v.opcao_id; });

    pageEl.innerHTML = `${formHtml()}<div class="grid grid-2">${(enquetes || []).map(e => {
      const opcoes = e.enquete_opcoes || [];
      const total = opcoes.reduce((s, o) => s + o.votos, 0) || 1;
      const voted = !!votosMap[e.id];
      return `<div class="card" data-id="${e.id}"><h3 style="font-size:15px;margin-bottom:14px">${e.pergunta}</h3>
        ${opcoes.map(o => { const pct = Math.round((o.votos / total) * 100); return `<div class="poll-opt ${voted ? 'voted' : ''}" data-opcao="${o.id}">${voted ? `<div class="fill" style="width:${pct}%"></div>` : ''}<div class="txt"><span>${o.texto}</span><span>${voted ? pct + '%' : ''}</span></div></div>`; }).join('')}
        <div style="font-size:11.5px;color:var(--muted);margin-top:8px">${total} voto(s) ${voted ? '· você já votou' : '· toque em uma opção para votar'}</div></div>`;
    }).join('') || `<div class="empty">Nenhuma enquete no momento.${user.admin ? '' : ' Peça pra liderança criar uma!'}</div>`}</div>`;

    bindForm();
    pageEl.querySelectorAll('.card[data-id]').forEach(card => {
      const eid = card.dataset.id;
      card.querySelectorAll('.poll-opt').forEach(opt => opt.addEventListener('click', async () => {
        if (votosMap[eid]) return;
        const opcaoId = opt.dataset.opcao;
        const { error: voteError } = await sb.from('enquete_votos').insert({ enquete_id: eid, usuario_id: user.id, opcao_id: opcaoId });
        if (voteError) { FASA.toast('Erro ao votar: ' + voteError.message); return; }
        const { data: opcaoAtual } = await sb.from('enquete_opcoes').select('votos').eq('id', opcaoId).single();
        await sb.from('enquete_opcoes').update({ votos: (opcaoAtual?.votos || 0) + 1 }).eq('id', opcaoId);
        paint();
      }));
    });
  }
  paint();
}

/* ---------------- Sugestões ---------------- */
function renderSugestoes() {

  async function paint() {
    pageEl.innerHTML = `<div class="empty">Carregando sugestões...</div>`;
    const { data: sugs, error } = await sb
      .from('sugestoes')
      .select('*, usuarios!sugestoes_autor_id_fkey(nome), sugestao_apoios(usuario_id)')
      .order('criado_em', { ascending: false });

    pageEl.innerHTML = `
      <div class="card" style="margin-bottom:20px"><h3 style="margin-bottom:12px">Compartilhe uma ideia</h3>
        <div class="field"><textarea id="sug-texto" rows="3" style="width:100%;padding:12px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit" placeholder="O que podemos melhorar?"></textarea></div>
        <button class="btn btn-accent" id="sug-submit">Enviar sugestão</button></div>
      <div style="display:flex;flex-direction:column;gap:14px">${lista.map(s => {
        const au = s.usuarios || { nome: 'Colaborador' };
        const apoios = s.sugestao_apoios || [];
        const apoiado = apoios.some(a => a.usuario_id === user.id);
        return `<div class="card" data-id="${s.id}"><div class="post-head"><div class="avatar sm">${FASA.initials(au.nome)}</div><div class="meta"><div class="name">${au.nome}</div><div class="sub">${FASA.timeAgo(new Date(s.criado_em).getTime())}</div></div></div>
        <p style="font-size:13.5px;color:var(--ink-soft);margin:10px 0">${FASA.escapeHtml(s.texto)}</p>
        <button class="btn btn-sm ${apoiado ? 'btn-primary' : 'btn-ghost'} apoiar-btn">👍 Apoiar (${apoios.length})</button></div>`;
      }).join('') || `<div class="empty">Nenhuma sugestão ainda. Seja o primeiro!</div>`}</div>`;

    document.getElementById('sug-submit').addEventListener('click', async () => {
      const texto = document.getElementById('sug-texto').value.trim();
      if (!texto) return;
      const { error: insError } = await sb.from('sugestoes').insert({ autor_id: user.id, texto });
      if (insError) { FASA.toast('Erro ao enviar: ' + insError.message); return; }
      FASA.toast('Sugestão enviada!'); paint();
    });
    pageEl.querySelectorAll('.card[data-id]').forEach(card => {
      card.querySelector('.apoiar-btn').addEventListener('click', async () => {
        const id = card.dataset.id;
        const apoiado = card.querySelector('.apoiar-btn').classList.contains('btn-primary');
        if (apoiado) {
          await sb.from('sugestao_apoios').delete().eq('sugestao_id', id).eq('usuario_id', user.id);
        } else {
          await sb.from('sugestao_apoios').insert({ sugestao_id: id, usuario_id: user.id });
        }
        paint();
      });
    });
  }
  paint();
}

/* ---------------- Chat ---------------- */
async function renderChat() {
  const { user, pageEl } = renderShell('chat', 'Chat');
  pageEl.classList.add('wide');
  pageEl.innerHTML = `<div class="empty">Carregando conversas...</div>`;
  const EMOJIS = ['😀','😁','😂','🤣','😊','😇','🙂','😉','😍','🥰','😘','😋','😜','🤔','😐','😴','😪','😢','😭','😱','😡','🤬','🥳','😎','🤩','😷','🤒','🙏','👍','👎','👏','🙌','🤝','💪','👋','✌️','🤞','❤️','🧡','💚','💙','💜','🖤','🔥','✨','🎉','🎂','👏','🙏','✅','❌','❗','❓','💡','📌','📎','⏰','😴','🤯'];

  let outros = [];
  let grupos = [];
  let allMsgs = [];
  let activeType = null, activeId = null;
  let search = '';

  async function carregarBase() {
    const { data: usuarios } = await sb.from('usuarios').select('*').neq('id', user.id).order('nome');
    outros = usuarios || [];

    const { data: minhasGm } = await sb.from('grupo_membros').select('grupo_id').eq('usuario_id', user.id);
    const grupoIds = (minhasGm || []).map(g => g.grupo_id);
    if (grupoIds.length) {
      const { data: gs } = await sb.from('grupos').select('*').in('id', grupoIds);
      grupos = gs || [];
    } else {
      grupos = [];
    }

    if (!activeId) {
      if (grupos[0]) { activeType = 'group'; activeId = grupos[0].id; }
      else if (outros[0]) { activeType = 'user'; activeId = outros[0].id; }
    }
  }

  async function carregarMensagens() {
    const orFiltro = `remetente_id.eq.${user.id},destinatario_id.eq.${user.id}`;
    const { data: dms } = await sb.from('mensagens').select('*').is('grupo_id', null).or(orFiltro).order('criado_em', { ascending: true });
    let gms = [];
    if (grupos.length) {
      const ids = grupos.map(g => g.id);
      const { data } = await sb.from('mensagens').select('*').in('grupo_id', ids).order('criado_em', { ascending: true });
      gms = data || [];
    }
    allMsgs = [...(dms || []), ...gms];
  }

  function userById(id) { return id === user.id ? user : outros.find(u => u.id === id); }

  function convList() {
    const userConvs = outros.filter(u => u.nome.toLowerCase().includes(search.toLowerCase())).map(u => {
      const msgs = allMsgs.filter(m => !m.grupo_id && ((m.remetente_id === user.id && m.destinatario_id === u.id) || (m.remetente_id === u.id && m.destinatario_id === user.id)));
      const last = msgs[msgs.length - 1];
      return { type: 'user', id: u.id, nome: u.nome, pessoa: u, lastMsg: last ? last.texto : 'Diga olá 👋' };
    });
    const groupConvs = grupos.filter(g => g.nome.toLowerCase().includes(search.toLowerCase())).map(g => {
      const msgs = allMsgs.filter(m => m.grupo_id === g.id);
      const last = msgs[msgs.length - 1];
      return { type: 'group', id: g.id, nome: g.nome, lastMsg: last ? last.texto : 'Grupo criado' };
    });
    return [...groupConvs, ...userConvs];
  }

  function paintList() {
    const list = convList();
    pageEl.querySelector('#chat-list-inner').innerHTML = list.map(c => `
      <div class="chat-conv ${c.type === activeType && c.id === activeId ? 'active' : ''}" data-type="${c.type}" data-id="${c.id}">
        ${c.type === 'group' ? '<div class="avatar sm" style="background:var(--accent)">👥</div>' : FASA.avatarHtml(c.pessoa, 'sm')}
        <div class="t"><div class="n">${c.nome}</div><div class="m">${c.lastMsg}</div></div></div>`).join('') || `<div class="empty" style="padding:20px 10px">Nenhuma conversa encontrada.</div>`;
    pageEl.querySelectorAll('.chat-conv').forEach(el => el.addEventListener('click', () => { activeType = el.dataset.type; activeId = el.dataset.id; paintList(); paintMain(); }));
  }

  function paintMain() {
    const mainWrap = pageEl.querySelector('#chat-main-wrap');
    if (!activeId) { mainWrap.innerHTML = `<div class="empty" style="margin:auto">Nenhuma conversa ainda. Escreva pra alguém da equipe!</div>`; return; }
    const isGroup = activeType === 'group';
    const info = isGroup ? grupos.find(g => g.id === activeId) : outros.find(u => u.id === activeId);
    if (!info) { mainWrap.innerHTML = `<div class="empty" style="margin:auto">Conversa não encontrada.</div>`; return; }
    const nome = info.nome;
    const sub = isGroup ? 'Grupo' : `${info.cargo || ''} · ${info.setor || ''}`;
    const msgs = isGroup
      ? allMsgs.filter(m => m.grupo_id === activeId)
      : allMsgs.filter(m => !m.grupo_id && ((m.remetente_id === user.id && m.destinatario_id === activeId) || (m.remetente_id === activeId && m.destinatario_id === user.id)));

    mainWrap.innerHTML = `
      <div class="chat-head">${isGroup ? '<div class="avatar sm" style="background:var(--accent)">👥</div>' : FASA.avatarHtml(info, 'sm')}
        <div><div style="font-weight:700;font-size:14px">${nome}</div><div style="font-size:11.5px;color:var(--muted)">${sub}</div></div></div>
      <div class="chat-msgs" id="chat-msgs">${msgs.map(m => `
        <div class="msg ${m.remetente_id === user.id ? 'out' : 'in'}">${isGroup && m.remetente_id !== user.id ? `<b style="display:block;font-size:11px;opacity:.8">${(userById(m.remetente_id) || {}).nome || ''}</b>` : ''}${FASA.escapeHtml(m.texto)}<span class="time">${new Date(m.criado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</span></div>`).join('') || `<div class="empty" style="margin:auto">Nenhuma mensagem ainda. Diga olá!</div>`}</div>
      <div style="position:relative">
        <div id="emoji-pop" style="display:none;position:absolute;bottom:64px;left:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:var(--shadow-lg);gap:4px;flex-wrap:wrap;width:260px;max-height:220px;overflow-y:auto">
          ${EMOJIS.map(e => `<span style="cursor:pointer;font-size:18px;padding:4px" class="emoji-choice">${e}</span>`).join('')}
        </div>
        <div class="chat-input">
          <button class="icon-btn" id="emoji-btn" title="Emoji">😊</button>
          <input type="text" id="chat-text-input" placeholder="Escreva uma mensagem...">
          <button class="btn btn-primary btn-sm" id="chat-send-btn">Enviar</button>
        </div>
      </div>`;

    const msgsWrap = document.getElementById('chat-msgs');
    msgsWrap.scrollTop = msgsWrap.scrollHeight;
    const input = document.getElementById('chat-text-input');

    async function send(texto) {
      texto = texto.trim();
      if (!texto) return;
      const payload = isGroup ? { remetente_id: user.id, grupo_id: activeId, texto } : { remetente_id: user.id, destinatario_id: activeId, texto };
      const { error } = await sb.from('mensagens').insert(payload);
      if (error) { FASA.toast('Erro ao enviar: ' + error.message); return; }
      input.value = '';
      await carregarMensagens();
      renderMessagesOnly();
      paintList();
    }
    document.getElementById('chat-send-btn').addEventListener('click', () => send(input.value));
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(input.value); });
    const emojiBtn = document.getElementById('emoji-btn'), emojiPop = document.getElementById('emoji-pop');
    emojiBtn.addEventListener('click', () => { emojiPop.style.display = emojiPop.style.display === 'none' ? 'flex' : 'none'; });
    emojiPop.querySelectorAll('.emoji-choice').forEach(e => e.addEventListener('click', () => { input.value += e.textContent; emojiPop.style.display = 'none'; input.focus(); }));
  }

  // Atualiza só a lista de mensagens (sem recriar o input/emoji), pra não
  // fechar o seletor de emoji nem apagar o que a pessoa está digitando
  // quando a conversa atualiza sozinha em segundo plano.
  function renderMessagesOnly() {
    const msgsWrap = document.getElementById('chat-msgs');
    if (!msgsWrap || !activeId) return;
    const isGroup = activeType === 'group';
    const info = isGroup ? grupos.find(g => g.id === activeId) : outros.find(u => u.id === activeId);
    if (!info) return;
    const msgs = isGroup
      ? allMsgs.filter(m => m.grupo_id === activeId)
      : allMsgs.filter(m => !m.grupo_id && ((m.remetente_id === user.id && m.destinatario_id === activeId) || (m.remetente_id === activeId && m.destinatario_id === user.id)));
    const pertoDoFim = msgsWrap.scrollTop + msgsWrap.clientHeight >= msgsWrap.scrollHeight - 40;
    msgsWrap.innerHTML = msgs.map(m => `
      <div class="msg ${m.remetente_id === user.id ? 'out' : 'in'}">${isGroup && m.remetente_id !== user.id ? `<b style="display:block;font-size:11px;opacity:.8">${(userById(m.remetente_id) || {}).nome || ''}</b>` : ''}${FASA.escapeHtml(m.texto)}<span class="time">${new Date(m.criado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</span></div>`).join('') || `<div class="empty" style="margin:auto">Nenhuma mensagem ainda. Diga olá!</div>`;
    if (pertoDoFim) msgsWrap.scrollTop = msgsWrap.scrollHeight;
  }

  await carregarBase();
  await carregarMensagens();

  pageEl.innerHTML = `<div class="chat-shell card" style="padding:0;overflow:hidden">
    <div class="chat-list"><div class="chat-search field"><input id="chat-search-input" placeholder="🔍 Pesquisar conversa..."></div><div id="chat-list-inner"></div></div>
    <div class="chat-main" id="chat-main-wrap"></div></div>`;
  document.getElementById('chat-search-input').addEventListener('input', (e) => { search = e.target.value; paintList(); });
  paintList(); paintMain();

  if (_chatPollInterval) clearInterval(_chatPollInterval);
  _chatPollInterval = setInterval(async () => {
    await carregarMensagens();
    renderMessagesOnly();
    paintList();
  }, 4000);
}

/* ---------------- Admin ---------------- */
function renderAdmin() {
  const { user, pageEl } = renderShell('admin', 'Administração');
  if (!user.admin) { pageEl.innerHTML = `<div class="empty"><div class="big">🔒</div>Esta área é restrita à liderança.</div>`; return; }

  let tab = 'painel';
  const TABS = [{ id: 'painel', label: 'Painel' }, { id: 'usuarios', label: 'Usuários' }, { id: 'avisos', label: 'Avisos' }, { id: 'comunidades', label: 'Comunidades' }, { id: 'documentos', label: 'Documentos' }];
  function shellHtml(inner) { return `<div class="tabs">${TABS.map(t => `<div class="tab ${t.id === tab ? 'active' : ''}" data-tab="${t.id}">${t.label}</div>`).join('')}</div>${inner}`; }
  function bindTabs() { pageEl.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { tab = t.dataset.tab; render(); })); }

  async function paintPainel() {
    pageEl.innerHTML = shellHtml(`<div class="empty">Carregando painel...</div>`);
    const [{ count: totalUsuarios }, { data: postsRecentes }, { count: totalDocs }, { count: totalAvisos }] = await Promise.all([
      sb.from('usuarios').select('*', { count: 'exact', head: true }),
      sb.from('posts').select('*, usuarios!posts_autor_id_fkey(nome)').order('criado_em', { ascending: false }).limit(5),
      sb.from('biblioteca').select('*', { count: 'exact', head: true }),
      sb.from('avisos').select('*', { count: 'exact', head: true }),
    ]);
    const { count: posts24h } = await sb.from('posts').select('*', { count: 'exact', head: true }).gt('criado_em', new Date(Date.now() - 86400e3).toISOString());

    const stats = [
      { n: totalUsuarios || 0, l: 'Usuários cadastrados' },
      { n: posts24h || 0, l: 'Posts nas últimas 24h' },
      { n: totalDocs || 0, l: 'Documentos na Biblioteca' },
      { n: totalAvisos || 0, l: 'Avisos publicados' },
    ];
    pageEl.innerHTML = shellHtml(`
      <div class="grid grid-4" style="margin-bottom:20px">${stats.map(s => `<div class="card stat-card"><div class="num">${s.n}</div><div class="lbl">${s.l}</div></div>`).join('')}</div>
      <div class="card"><h3 style="margin-bottom:14px">Atividade recente</h3>
        ${(postsRecentes || []).map(p => { const au = p.usuarios || { nome: 'Colaborador' }; return `<div style="padding:8px 0;border-bottom:1px solid var(--line);font-size:13px"><b>${au.nome}</b> publicou · <span style="color:var(--muted)">${FASA.timeAgo(new Date(p.criado_em).getTime())}</span></div>`; }).join('') || `<div class="empty">Nenhuma atividade ainda.</div>`}
      </div>`);
    bindTabs();
  }

  async function paintUsuarios() {
    pageEl.innerHTML = shellHtml(`<div class="empty">Carregando usuários...</div>`);
    const { data: usuarios, error } = await sb.from('usuarios').select('*').order('nome');
    if (error) { FASA.toast('Erro ao carregar usuários: ' + error.message); }

    pageEl.innerHTML = shellHtml(`
      <div class="card" style="margin-bottom:18px;color:var(--muted);font-size:13px">
        Pra adicionar alguém novo, convide pelo <b>Supabase → Authentication → Users → Invite user</b>.
        O perfil aparece aqui automaticamente — é só editar matrícula, cargo e setor.
      </div>
      <div class="card table-wrap"><table><thead><tr><th>Nome</th><th>Matrícula</th><th>Cargo</th><th>Setor</th><th>Perfil</th><th></th></tr></thead><tbody>
        ${(usuarios || []).map(u => `<tr data-id="${u.id}">
          <td><input class="ed-nome" value="${u.nome || ''}" style="border:none;background:none;width:100px;font:inherit"></td>
          <td><input class="ed-matricula" value="${u.matricula || ''}" style="border:none;background:none;width:80px;font:inherit"></td>
          <td><input class="ed-cargo" value="${u.cargo || ''}" style="border:none;background:none;width:110px;font:inherit"></td>
          <td><input class="ed-setor" value="${u.setor || ''}" style="border:none;background:none;width:100px;font:inherit"></td>
          <td><label class="checkline"><input type="checkbox" class="ed-admin" ${u.admin ? 'checked' : ''}> <span class="badge ${u.admin ? 'ok' : 'off'}">${u.admin ? 'Admin' : 'Colaborador'}</span></label></td>
          <td style="display:flex;gap:6px"><button class="icon-action salvar-user" title="Salvar">💾</button><button class="icon-action del-user" title="Excluir perfil">🗑</button></td>
        </tr>`).join('')}
      </tbody></table></div>`);
    bindTabs();

    pageEl.querySelectorAll('tr[data-id]').forEach(tr => {
      const id = tr.dataset.id;
      tr.querySelector('.salvar-user').addEventListener('click', async () => {
        const nome = tr.querySelector('.ed-nome').value.trim();
        const matricula = tr.querySelector('.ed-matricula').value.trim();
        const cargo = tr.querySelector('.ed-cargo').value.trim();
        const setor = tr.querySelector('.ed-setor').value.trim();
        const admin = tr.querySelector('.ed-admin').checked;
        const { error: updError } = await sb.from('usuarios').update({ nome, matricula, cargo, setor, admin }).eq('id', id);
        if (updError) { FASA.toast('Erro ao salvar: ' + updError.message); return; }
        FASA.toast('Usuário atualizado!');
        paintUsuarios();
      });
      tr.querySelector('.del-user').addEventListener('click', async () => {
        if (id === user.id) { FASA.toast('Você não pode excluir seu próprio perfil.'); return; }
        if (!confirm('Excluir o perfil deste usuário? Isso não remove o login dele, só os dados no FASA.')) return;
        const { error: delError } = await sb.from('usuarios').delete().eq('id', id);
        if (delError) { FASA.toast('Erro ao excluir: ' + delError.message); return; }
        paintUsuarios();
      });
    });
  }

  async function paintAvisos() {
    pageEl.innerHTML = shellHtml(`<div class="empty">Carregando avisos...</div>`);
    const { data: avisos, error } = await sb.from('avisos').select('*').order('criado_em', { ascending: false });
    if (error) { FASA.toast('Erro ao carregar avisos: ' + error.message); }

    pageEl.innerHTML = shellHtml(`
      <div class="card" style="margin-bottom:18px"><h3 style="margin-bottom:12px">Criar aviso</h3>
        <div class="field"><input id="aa-titulo" placeholder="Título"></div>
        <div class="field"><textarea id="aa-texto" rows="3" style="width:100%;padding:12px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit" placeholder="Texto do aviso"></textarea></div>
        <button class="btn btn-primary" id="aa-submit">Publicar</button></div>
      <div class="card">${(avisos || []).map(a => `<div class="aviso" style="margin-bottom:16px;display:flex;justify-content:space-between;gap:10px"><div><h3>${a.titulo}</h3><p>${a.texto}</p></div><button class="icon-action del-aviso" data-id="${a.id}">🗑</button></div>`).join('') || `<div class="empty">Nenhum aviso ainda.</div>`}</div>`);
    bindTabs();
    document.getElementById('aa-submit').addEventListener('click', async () => {
      const titulo = document.getElementById('aa-titulo').value.trim(), texto = document.getElementById('aa-texto').value.trim();
      if (!titulo || !texto) return;
      const { error: insError } = await sb.from('avisos').insert({ autor_id: user.id, titulo, texto });
      if (insError) { FASA.toast('Erro ao publicar: ' + insError.message); return; }
      FASA.toast('Aviso criado!'); paintAvisos();
    });
    pageEl.querySelectorAll('.del-aviso').forEach(btn => btn.addEventListener('click', async () => {
      const { error: delError } = await sb.from('avisos').delete().eq('id', btn.dataset.id);
      if (delError) { FASA.toast('Erro ao excluir: ' + delError.message); return; }
      paintAvisos();
    }));
  }

  async function paintComunidades() {
    pageEl.innerHTML = shellHtml(`<div class="empty">Carregando comunidades...</div>`);
    const { data: comunidades, error: e1 } = await sb.from('comunidades').select('*').order('nome');
    const { data: membros, error: e2 } = await sb.from('comunidade_membros').select('comunidade_id');
    if (e1 || e2) { FASA.toast('Erro ao carregar comunidades'); }
    const contagem = {};
    (membros || []).forEach(m => { contagem[m.comunidade_id] = (contagem[m.comunidade_id] || 0) + 1; });

    pageEl.innerHTML = shellHtml(`
      <div class="card"><h3 style="margin-bottom:12px">Comunidades ativas</h3>
        <p style="color:var(--muted);font-size:12.5px;margin-bottom:14px">Edite a descrição das comunidades exibidas para a equipe.</p>
        <div class="table-wrap"><table><thead><tr><th>Comunidade</th><th>Descrição</th><th>Membros</th><th></th></tr></thead><tbody>
          ${(comunidades || []).map(c => `<tr data-id="${c.id}"><td><b>${c.nome}</b></td><td><input class="ed-desc" value="${c.descricao || ''}" style="border:none;background:none;width:100%;font:inherit"></td><td>${contagem[c.id] || 0}</td><td><button class="icon-action salvar-com" title="Salvar">💾</button></td></tr>`).join('')}
        </tbody></table></div></div>`);
    bindTabs();
    pageEl.querySelectorAll('tr[data-id]').forEach(tr => {
      tr.querySelector('.salvar-com').addEventListener('click', async () => {
        const descricao = tr.querySelector('.ed-desc').value.trim();
        const { error: updError } = await sb.from('comunidades').update({ descricao }).eq('id', tr.dataset.id);
        if (updError) { FASA.toast('Erro ao salvar: ' + updError.message); return; }
        FASA.toast('Comunidade atualizada!');
      });
    });
  }

  async function paintDocumentos() {
    pageEl.innerHTML = shellHtml(`<div class="empty">Carregando biblioteca...</div>`);
    const { data: docs, error } = await sb.from('biblioteca').select('*').order('atualizado_em', { ascending: false });
    if (error) { FASA.toast('Erro ao carregar biblioteca: ' + error.message); }

    pageEl.innerHTML = shellHtml(`
      <div class="card" style="margin-bottom:18px"><h3 style="margin-bottom:12px">Liberar novo documento</h3>
        <div class="grid grid-3">
          <div class="field"><input id="nd-nome" placeholder="Nome do documento"></div>
          <div class="field"><select id="nd-categoria"><option>POPs</option><option>Protocolos</option><option>Manuais</option><option>Vídeos</option></select></div>
          <div class="field"><select id="nd-tipo"><option>PDF</option><option>Vídeo</option></select></div>
        </div><button class="btn btn-primary" id="nd-submit">Adicionar à Biblioteca</button></div>
      <div class="card table-wrap"><table><thead><tr><th>Nome</th><th>Categoria</th><th>Tipo</th><th></th></tr></thead><tbody>
        ${(docs || []).map(doc => `<tr data-id="${doc.id}"><td>${doc.nome}</td><td>${doc.categoria}</td><td>${doc.tipo}</td><td><button class="icon-action del-doc">🗑</button></td></tr>`).join('') || ''}
      </tbody></table></div>`);
    bindTabs();
    document.getElementById('nd-submit').addEventListener('click', async () => {
      const nome = document.getElementById('nd-nome').value.trim();
      if (!nome) return;
      const categoria = document.getElementById('nd-categoria').value, tipo = document.getElementById('nd-tipo').value;
      const { error: insError } = await sb.from('biblioteca').insert({ nome, categoria, tipo });
      if (insError) { FASA.toast('Erro ao adicionar: ' + insError.message); return; }
      FASA.toast('Documento liberado!'); paintDocumentos();
    });
    pageEl.querySelectorAll('.del-doc').forEach(btn => btn.addEventListener('click', async (e) => {
      const id = e.target.closest('tr').dataset.id;
      const { error: delError } = await sb.from('biblioteca').delete().eq('id', id);
      if (delError) { FASA.toast('Erro ao excluir: ' + delError.message); return; }
      paintDocumentos();
    }));
  }

  function render() { ({ painel: paintPainel, usuarios: paintUsuarios, avisos: paintAvisos, comunidades: paintComunidades, documentos: paintDocumentos })[tab](); }
  render();
}

/* ---------------- Router ---------------- */
const ROUTES = { feed: renderFeed, perfil: renderPerfil, chat: renderChat, comunidades: renderComunidades, avisos: renderAvisos, escala: renderEscala, biblioteca: renderBiblioteca, enquetes: renderEnquetes, sugestoes: renderSugestoes, ranking: renderRanking, admin: renderAdmin };

function router() {
  const route = location.hash.replace('#/', '') || '';
  const user = FASA.currentUser();

  if (route === 'login') { renderLogin(); return; }
  if (route === 'cadastro') { renderCadastro(); return; }

  if (!user) { FASA.go('login'); return; }

  const fn = ROUTES[route] || ROUTES.feed;
  fn();
}

FASA.seed();
window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', router);
router();
</script>
</body>
</html>
