<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FASA · App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f5f5}
.btn{background:#1F6F5C;color:#fff;padding:12px 24px;border:none;border-radius:8px;cursor:pointer;font-size:16px}
.btn:active{background:#164F41}
.card{background:#fff;padding:20px;border-radius:12px;margin:16px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}
.nav-item{padding:15px;border-bottom:1px solid #eee;cursor:pointer}
.nav-item:active{background:#e0e0e0}
.avatar{width:40px;height:40px;border-radius:50%;background:#1F6F5C;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold}
.auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#1F6F5C,#164F41)}
.auth h1{color:#fff;margin-bottom:10px}
.auth p{color:#fff;opacity:.8;margin-bottom:30px}
.auth-box{background:#fff;padding:30px;border-radius:16px;width:100%;max-width:400px}
.error{color:red;background:#fee;padding:10px;border-radius:8px;margin-bottom:16px;display:none}
.error.show{display:block}
.topbar{background:#1F6F5C;color:#fff;padding:16px;display:flex;align-items:center;gap:12px}
.menu-btn{background:none;border:none;color:#fff;font-size:24px;cursor:pointer}
.sidebar{position:fixed;left:0;top:0;width:280px;height:100vh;background:#fff;box-shadow:2px 0 8px rgba(0,0,0,.1);transform:translateX(-100%);transition:.3s;z-index:1000}
.sidebar.open{transform:translateX(0)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:999}
.overlay.show{display:block}
.post{background:#fff;padding:16px;margin:16px;border-radius:12px}
.post-header{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.post-actions{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid #eee}
.post-actions button{flex:1;padding:8px;background:none;border:1px solid #ddd;border-radius:8px;cursor:pointer}
.badge{display:inline-block;padding:4px 12px;border-radius:12px;font-size:12px;background:#e0f0ec;color:#1F6F5C}
</style>
</head>
<body>
<div id="app"></div>

<script>
let currentUser = null;
let currentView = 'feed';
let db = JSON.parse(localStorage.getItem('fasa_db')) || null;

function initDB() {
  if (!db) {
    db = {
      users: [
        {id:'u1',nome:'Alexandre',cargo:'Técnico de Farmácia',setor:'Farmácia',email:'alexandre@fasa.local',senha:'123456',admin:true,pontos:260},
        {id:'u2',nome:'Thais',cargo:'Coordenadora',setor:'Farmácia',email:'thais@fasa.local',senha:'123456',admin:true,pontos:480}
      ],
      posts: [
        {id:'p1',userId:'u2',content:'Bom dia equipe! Lembrem-se de conferir as validades.',timestamp:Date.now()-3600000,likes:[],comments:[]}
      ],
      avisos: [
        {id:'a1',titulo:'Feriado',texto:'Escala disponível',timestamp:Date.now()-86400000}
      ],
      enquetes: [],
      sugestoes: [],
      escalas: [],
      biblioteca: [],
      chats: []
    };
    saveDB();
  }
}

function saveDB() {
  localStorage.setItem('fasa_db', JSON.stringify(db));
}

function login(email, senha) {
  const user = db.users.find(u => u.email === email && u.senha === senha);
  if (user) {
    currentUser = user;
    localStorage.setItem('fasa_user', JSON.stringify(user));
    render();
  } else {
    document.getElementById('loginError').classList.add('show');
  }
}

function logout() {
  currentUser = null;
  localStorage.removeItem('fasa_user');
  render();
}

function render() {
  const app = document.getElementById('app');
  if (!currentUser) {
    app.innerHTML = renderLogin();
  } else {
    app.innerHTML = renderApp();
    if (currentView === 'feed') renderFeed();
    else if (currentView === 'perfil') renderPerfil();
    else if (currentView === 'avisos') renderAvisos();
  }
}

function renderLogin() {
  return `<div class="auth">
    <h1>💊 FASA</h1>
    <p>Bem-vindo de volta</p>
    <div class="auth-box">
      <div id="loginError" class="error">E-mail ou senha inválidos</div>
      <input type="email" id="email" placeholder="E-mail" value="alexandre@fasa.local">
      <input type="password" id="senha" placeholder="Senha" value="123456">
      <button class="btn" onclick="login(document.getElementById('email').value,document.getElementById('senha').value)" style="width:100%;margin-top:16px">Entrar</button>
    </div>
  </div>`;
}

function renderApp() {
  return `<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="sidebar" id="sidebar">
      <div style="padding:20px;border-bottom:1px solid #eee">
        <div style="display:flex;gap:12px;align-items:center">
          <div class="avatar">${currentUser.nome.charAt(0)}</div>
          <div><b>${currentUser.nome}</b><div style="font-size:12px;color:#666">${currentUser.cargo}</div></div>
        </div>
      </div>
      <div class="nav-item" onclick="setView('feed')">🏠 Início</div>
      <div class="nav-item" onclick="setView('perfil')">👤 Meu Perfil</div>
      <div class="nav-item" onclick="setView('avisos')"> Avisos</div>
      <div class="nav-item" onclick="setView('enquetes')"> Enquetes</div>
      <div class="nav-item" onclick="setView('escalas')">📅 Escalas</div>
      <div class="nav-item" onclick="logout()" style="color:red">🚪 Sair</div>
    </div>
    <div class="topbar">
      <button class="menu-btn" onclick="toggleMenu()">☰</button>
      <h2>${currentView === 'feed' ? 'Início' : currentView === 'perfil' ? 'Meu Perfil' : 'Avisos'}</h2>
    </div>
    <div id="content"></div>`;
}

function toggleMenu() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

function setView(view) {
  currentView = view;
  toggleMenu();
  render();
}

function renderFeed() {
  const content = document.getElementById('content');
  const posts = db.posts.map(p => {
    const user = db.users.find(u => u.id === p.userId);
    return `<div class="post">
      <div class="post-header">
        <div class="avatar">${user.nome.charAt(0)}</div>
        <div><b>${user.nome}</b><div style="font-size:12px;color:#666">${user.cargo}</div></div>
      </div>
      <div>${p.content}</div>
      <div class="post-actions">
        <button>❤️ Curtir</button>
        <button>💬 Comentar</button>
      </div>
    </div>`;
  }).join('');
  
  content.innerHTML = `<div class="card">
    <textarea id="newPost" placeholder="No que você está pensando?"></textarea>
    <button class="btn" onclick="addPost()" style="margin-top:8px">Publicar</button>
  </div>${posts}`;
}

function renderPerfil() {
  const content = document.getElementById('content');
  content.innerHTML = `<div class="card">
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:20px">
      <div class="avatar" style="width:64px;height:64px;font-size:28px">${currentUser.nome.charAt(0)}</div>
      <div><h2>${currentUser.nome}</h2><div style="color:#666">${currentUser.cargo}</div><span class="badge">⭐ ${currentUser.pontos} pontos</span></div>
    </div>
    <h3>Conquistas</h3>
    <div style="margin-top:16px">
      <div style="padding:12px;background:#f9f9f9;border-radius:8px;margin-bottom:8px">🥇 Colaborador do mês</div>
      <div style="padding:12px;background:#f9f9f9;border-radius:8px;margin-bottom:8px">📚 Trilha concluída</div>
    </div>
  </div>`;
}

function renderAvisos() {
  const content = document.getElementById('content');
  const avisos = db.avisos.map(a => `<div class="card"><h3>${a.titulo}</h3><p>${a.texto}</p></div>`).join('');
  content.innerHTML = avisos || '<div class="card">Nenhum aviso</div>';
}

function addPost() {
  const content = document.getElementById('newPost').value;
  if (content) {
    db.posts.unshift({
      id: 'p' + Date.now(),
      userId: currentUser.id,
      content: content,
      timestamp: Date.now(),
      likes: [],
      comments: []
    });
    saveDB();
    renderFeed();
  }
}

// Inicializa
initDB();
const savedUser = localStorage.getItem('fasa_user');
if (savedUser) currentUser = JSON.parse(savedUser);
render();
</script>
</body>
</html>
