body{margin:0;font-family:var(--f-body);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}

.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;font-weight:500;padding:4px 12px 4px 4px;border-radius:var(--radius-pill);background:var(--primary-lt);color:var(--primary-dk);border:1px solid transparent}

.app-shell{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex:none;background:var(--card);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}

.page{padding:24px 28px;max-width:1040px}
.page.wide{max-width:none}

      enquetes: [
        { id: 'e1', pergunta: 'Qual tema você quer no próximo treinamento?', opcoes: [{ t: 'Medicamentos de alta vigilância', v: 8 }, { t: 'Boas práticas de manipulação', v: 5 }], votouIds: [] },
      ],
      sugestoes: [
        { id: 's1', autorId: 'u1', texto: 'Sugiro criar um checklist rápido no app para conferência de materiais.', ts: now - 3600e3 * 12, apoios: ['u4'] },
      ],
      chats: {
        'u1_u2': [{ de: 'u2', texto: 'Oi! Viu o aviso do treinamento?', ts: now - 3600e3 * 3 }]
      }
    };
  }

  function getDB() { return _db; }
  function saveDB(db) { _db = db; }
  function getSession() { return _session; }
  function setSession(userId) { _session = { userId, ts: Date.now() }; }
  function clearSession() { _session = null; }
  function currentUser() {
    const s = getSession();
    if (!s) return null;
    return getDB().usuarios.find(u => u.id === s.userId) || null;
  }
  function initials(nome) { return (nome || '?').split(' ').filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase(); }
  function avatarHtml(pessoa, sizeClass) {
    sizeClass = sizeClass || '';
    const cls = ('avatar ' + sizeClass).trim();
    if (pessoa && pessoa.foto_url) {
      return `<div class="${cls}" style="padding:0;overflow:hidden"><img src="${pessoa.foto_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%"></div>`;
    }
    return `<div class="${cls}">${initials((pessoa && pessoa.nome) || '?')}</div>`;
  }
  function timeAgo(ts) {
    const diff = Date.now() - ts, h = Math.floor(diff / 3600e3);
    if (h < 1) return 'agora há pouco';
    if (h < 24) return `há ${h}h`;
    const d = Math.floor(h / 24);
    return `há ${d}d`;
  }
  function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function logoMark(size = 30) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="40" height="40" rx="12" fill="#1F6F5C"/>
      <rect x="9" y="17" width="22" height="10" rx="5" fill="#F3F7F3"/>
      <rect x="9" y="17" width="11" height="10" rx="5" fill="#E8873A"/>
    </svg>`;
  }
  function toast(msg) {
    let el = document.querySelector('.toast');
    if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 2200);
  }
  function go(route) { location.hash = '#/' + route; }

  return { seed, getDB, saveDB, getSession, setSession, clearSession, currentUser, initials, avatarHtml, timeAgo, escapeHtml, logoMark, toast, go, EMOJIS, COMUNIDADES, NAV_ITEMS };
})();

/* ---------------- Render de Reações & Comentários do Post ---------------- */
function renderPostCardHTML(post, user) {
  const db = FASA.getDB();
  const autor = db.usuarios.find(u => u.id === post.autorId) || { nome: 'Usuário', cargo: 'Equipe' };
  if (!post.reacoes) post.reacoes = {};
  if (!post.comentarios) post.comentarios = [];

  const emojisButtons = FASA.EMOJIS.map(emoji => {
    const list = post.reacoes[emoji] || [];
    const count = list.length;
    const reacted = list.includes(user.id);
    return `<button class="reaction-btn ${reacted ? 'active' : ''}" data-post="${post.id}" data-emoji="${emoji}">
      <span>${emoji}</span> ${count > 0 ? `<span>${count}</span>` : ''}
    </button>`;
  }).join('');

  const commentsListHTML = post.comentarios.map(c => {
    const cAutor = db.usuarios.find(u => u.id === c.autorId) || { nome: 'Usuário' };
    return `<div class="comment-item">
      <div class="c-head">
        <span class="c-author">${FASA.escapeHtml(cAutor.nome)}</span>
        <span class="c-time">${FASA.timeAgo(c.ts)}</span>
      </div>
      <div class="c-text">${FASA.escapeHtml(c.texto)}</div>
    </div>`;
  }).join('');

  return `
    <div class="card post" id="post-${post.id}">
      <div class="post-head">
        ${FASA.avatarHtml(autor)}
        <div class="meta">
          <div class="name">${FASA.escapeHtml(autor.nome)}</div>
          <div class="sub">${FASA.escapeHtml(autor.cargo)} · ${FASA.timeAgo(post.ts)}</div>
        </div>
      </div>
      <div class="post-body">${FASA.escapeHtml(post.texto)}</div>
      
      <!-- Reações de Emojis -->
      <div class="reactions-bar">
        ${emojisButtons}
        <button class="toggle-comments-btn" data-target="cbox-${post.id}">💬 ${post.comentarios.length} comentários</button>
      </div>

      <!-- Área de Comentários -->
      <div class="comments-section" id="cbox-${post.id}">
        <div class="comments-list">${commentsListHTML}</div>
        <div class="comment-input-box">
          <input type="text" placeholder="Escreva um comentário..." id="cinput-${post.id}">
          <button class="btn btn-primary btn-sm" data-btn-comment="${post.id}">Enviar</button>
        </div>
      </div>
    </div>
  `;
}

function bindPostEvents(container, refreshFn) {
  const user = FASA.currentUser();
  const db = FASA.getDB();

  // Reação com Emojis
  container.querySelectorAll('.reaction-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const postId = btn.dataset.post;
      const emoji = btn.dataset.emoji;
      const post = db.posts.find(p => p.id === postId);
      if (!post) return;
      if (!post.reacoes) post.reacoes = {};
      if (!post.reacoes[emoji]) post.reacoes[emoji] = [];

      const index = post.reacoes[emoji].indexOf(user.id);
      if (index >= 0) {
        post.reacoes[emoji].splice(index, 1);
      } else {
        post.reacoes[emoji].push(user.id);
      }
      FASA.saveDB(db);
      refreshFn();
    });
  });

  // Enviar Comentário
  container.querySelectorAll('[data-btn-comment]').forEach(btn => {
    btn.addEventListener('click', () => {
      const postId = btn.dataset.btnComment;
      const input = document.getElementById(`cinput-${postId}`);
      const texto = (input.value || '').trim();
      if (!texto) return;

      const post = db.posts.find(p => p.id === postId);
      if (!post) return;
      if (!post.comentarios) post.comentarios = [];

      post.comentarios.push({
        autorId: user.id,
        texto: texto,
        ts: Date.now()
      });
      FASA.saveDB(db);
      FASA.toast('Comentário publicado!');
      refreshFn();
    });
  });
}

            <h3>Comunidades ativas</h3>

  draw();

/* ---------------- Roteador ---------------- */
function handleRoute() {
  FASA.seed();
  const route = (location.hash.replace('#/', '') || 'login').split('?')[0];
  const user = FASA.currentUser();

  if (!user && route !== 'login') { FASA.go('login'); return; }

  switch (route) {
    case 'login': renderLogin(); break;
    case 'feed': renderFeed(); break;
    case 'perfil': renderPerfil(); break;
    case 'chat': renderChat(); break;
    case 'avisos': renderAvisos(); break;
    case 'escala': renderEscala(); break;
    case 'biblioteca': renderBiblioteca(); break;
    case 'enquetes': renderEnquetes(); break;
    case 'sugestoes': renderSugestoes(); break;
    case 'ranking': renderRanking(); break;
    case 'admin': user && user.admin ? renderAdmin() : renderFeed(); break;
    default: renderFeed();
  }
}

window.addEventListener('hashchange', handleRoute);
window.addEventListener('DOMContentLoaded', handleRoute);
