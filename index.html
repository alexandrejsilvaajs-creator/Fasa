<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FASA - Farmácia Social App</title>

  <!-- Icones e Fontes -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #0284c7;
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text); padding-bottom: 70px; }

    header { position: sticky; top: 0; background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 12px 16px; font-weight: 700; color: var(--primary); font-size: 1.2rem; z-index: 10; }
    
    .container { max-width: 500px; margin: 0 auto; padding: 12px; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }

    textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px; resize: none; font-family: inherit; margin-bottom: 8px; }
    
    .btn-pub { background: var(--primary); color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 600; float: right; cursor: pointer; }
    
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--bg-card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; }
    .nav-btn { background: none; border: none; color: var(--muted); font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .nav-btn.active { color: var(--primary); font-weight: 600; }
  </style>
</head>
<body>

  <header><i class="fa-solid fa-house-medical"></i> FASA</header>

  <main class="container">
    <div class="card">
      <textarea id="post-text" rows="3" placeholder="O que você quer compartilhar hoje?"></textarea>
      <button class="btn-pub" onclick="criarPost()">Publicar</button>
      <div style="clear:both;"></div>
    </div>

    <div id="feed-lista">
      <!-- Os posts vão aparecer aqui -->
    </div>
  </main>

  <nav class="nav-bar">
    <button class="nav-btn active"><i class="fa-solid fa-newspaper fa-lg"></i>Feed</button>
    <button class="nav-btn"><i class="fa-solid fa-calendar-days fa-lg"></i>Escalas</button>
    <button class="nav-btn"><i class="fa-solid fa-comments fa-lg"></i>Chat</button>
    <button class="nav-btn"><i class="fa-solid fa-book-medical fa-lg"></i>Docs</button>
  </nav>

  <script>
    function criarPost() {
      const txt = document.getElementById('post-text').value;
      if(!txt.trim()) return alert('Digite um texto!');
      
      const feed = document.getElementById('feed-lista');
      feed.innerHTML = `
        <div class="card">
          <div style="font-weight:600; margin-bottom:4px;">Colaborador</div>
          <p style="font-size:14px;">${txt}</p>
        </div>
      ` + feed.innerHTML;
      
      document.getElementById('post-text').value = '';
    }
  </script>
</body>
</html>
