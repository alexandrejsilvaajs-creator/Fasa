    </div>
    <div class="auth-form-wrap">
      <div class="auth-form" id="login-form">
        <div class="mark-mobile">${FASA.logoMark(34)}<span>FASA</span></div>
        <h1>Bem-vindo de volta</h1>
        <p class="sub">Entre com seu e-mail para acessar o FASA.</p>
        <div class="err" id="login-err">E-mail ou senha inválidos.</div>
        <div class="field"><label>E-mail</label><input id="usuario" type="text" placeholder="voce@email.com" value="alexandre.jsilva.ajs@gmail.com"></div>
        <div class="field"><label>Senha</label><input id="senha" type="password" placeholder="••••••••" value="Farmaciasat@2026"></div>
        <div class="field-row">
          <label class="checkline"><input type="checkbox"> Lembrar acesso</label>
          <a href="#" class="link" id="forgot-link">Esqueci minha senha</a>
        </div>
        <button type="button" id="login-submit" class="btn btn-primary btn-block">Entrar</button>
        <p class="form-foot">Não tem conta? <a class="link" id="go-cadastro">Como pedir acesso</a></p>
      </div>
    </div>
  </div>`;

  document.getElementById('go-cadastro').addEventListener('click', () => FASA.go('cadastro'));
  document.getElementById('forgot-link').addEventListener('click', (e) => {
    e.preventDefault();
    FASA.toast('Link de redefinição enviado para o seu e-mail (simulado).');
  });

  async function doLogin() {
    const email = document.getElementById('usuario').value.trim().toLowerCase();
    const senha = document.getElementById('senha').value;
    const errBox = document.getElementById('login-err');
    const btn = document.getElementById('login-submit');
    errBox.classList.remove('show');
    btn.textContent = 'Entrando...';
    btn.disabled = true;

    const { data: loginData, error: loginError } = await sb.auth.signInWithPassword({ email, password: senha });
    if (loginError) {
      errBox.textContent = 'E-mail ou senha inválidos.';
      errBox.classList.add('show');
      btn.textContent = 'Entrar';
      btn.disabled = false;
      return;
    }

    const { data: perfil, error: perfilError } = await sb.from('usuarios').select('*').eq('id', loginData.user.id).single();
    if (perfilError || !perfil) {
      errBox.textContent = 'Login funcionou, mas seu perfil ainda não foi cadastrado. Fale com a liderança.';
      errBox.classList.add('show');
      btn.textContent = 'Entrar';
      btn.disabled = false;
      return;
    }

    // mescla o perfil real no "banco" local, pra telas ainda não migradas
    // (Chat, Admin, etc.) continuarem funcionando com seu nome/cargo reais
    FASA.seed();
    const db = FASA.getDB();
    const jaExiste = db.usuarios.find(u => u.id === perfil.id);
    if (jaExiste) {
      Object.assign(jaExiste, perfil);
    } else {
      db.usuarios.unshift(perfil);
    }
    FASA.saveDB(db);
    FASA.setSession(perfil.id);
    FASA.go('feed');
  }
  document.getElementById('login-submit').addEventListener('click', doLogin);
  document.getElementById('senha').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  document.getElementById('usuario').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
}

/* ---------------- Feed ---------------- */
function renderFeed() {
  const { user, pageEl } = renderShell('feed', 'Início');
  let arquivoSelecionado = null;
  const REACOES = [
    { tipo: 'like', emoji: '👍', label: 'Curtir' },
    { tipo: 'amei', emoji: '❤️', label: 'Amei' },
    { tipo: 'haha', emoji: '😂', label: 'Haha' },
    { tipo: 'uau', emoji: '😮', label: 'Uau' },
    { tipo: 'triste', emoji: '😢', label: 'Triste' },
    { tipo: 'grr', emoji: '😡', label: 'Grr' },
  ];
  function reacaoInfo(tipo) { return REACOES.find(r => r.tipo === tipo) || REACOES[0]; }

  async function fetchPosts() {
    const { data, error } = await sb
      .from('posts')
      .select('*, usuarios!posts_autor_id_fkey(nome,cargo,foto_url), post_likes(usuario_id,tipo), comentarios(id,autor_id,texto,criado_em,usuarios!comentarios_autor_id_fkey(nome,foto_url))')
      .order('criado_em', { ascending: false });
    if (error) { FASA.toast('Erro ao carregar posts: ' + error.message); return []; }
    return data;
  }

  function anexoHtml(p) {
    if (!p.arquivo_url) return '';
    if ((p.arquivo_tipo || '').startsWith('image/')) {
      return `<img src="${p.arquivo_url}" style="max-width:100%;border-radius:10px;margin-bottom:12px;display:block">`;
    }
    return `<a href="${p.arquivo_url}" target="_blank" style="display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:12px;font-size:13px;color:var(--primary-dk)">📎 ${FASA.escapeHtml(p.arquivo_nome || 'Anexo')}</a>`;
  }

  function resumoReacoes(likes) {
    if (!likes.length) return '';
    const contagem = {};
    likes.forEach(l => { const t = l.tipo || 'like'; contagem[t] = (contagem[t] || 0) + 1; });
    const ordenado = Object.entries(contagem).sort((a, b) => b[1] - a[1]);
    return `<div style="display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted);padding:6px 0">
      <span style="display:inline-flex">${ordenado.slice(0, 3).map(([t]) => reacaoInfo(t).emoji).join('')}</span>
      <span>${likes.length}</span>
    </div>`;
  }

  function postsHtml(list) {
    return list.map(p => {
      const autor = p.usuarios || { nome: 'Ex-colaborador', cargo: '' };
      const likes = p.post_likes || [];
      const minhaReacao = likes.find(l => l.usuario_id === user.id);
      const comentarios = (p.comentarios || []).sort((a, b) => new Date(a.criado_em) - new Date(b.criado_em));
      const souAutor = p.autor_id === user.id;
      const infoReacao = minhaReacao ? reacaoInfo(minhaReacao.tipo) : null;
      return `
      <div class="card post" data-id="${p.id}">
        <div class="post-head">${FASA.avatarHtml(autor)}
          <div class="meta" style="flex:1"><div class="name">${FASA.escapeHtml(autor.nome)}</div><div class="sub">${FASA.escapeHtml(autor.cargo || '')} · ${FASA.timeAgo(new Date(p.criado_em).getTime())}</div></div>
          ${souAutor ? '<button class="icon-btn del-post-btn" title="Excluir publicação">🗑</button>' : ''}
        </div>
        <div class="post-body">${FASA.escapeHtml(p.texto)}</div>
        ${anexoHtml(p)}
        ${resumoReacoes(likes)}
        <div class="post-actions" style="position:relative">
          <button class="like-btn ${infoReacao ? 'liked' : ''}" style="${infoReacao ? `color:${infoReacao.tipo === 'like' ? 'var(--primary-dk)' : 'var(--accent-dk)'}` : ''}">${infoReacao ? `${infoReacao.emoji} ${infoReacao.label}` : '🙂 Reagir'}</button>
          <button class="comment-btn">💬 Comentar ${comentarios.length ? `(${comentarios.length})` : ''}</button>
          <button class="share-btn">↗ Compartilhar</button>
          <div class="reacao-pop" style="display:none;position:absolute;bottom:38px;left:0;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 8px;box-shadow:var(--shadow-lg);gap:4px;z-index:5">
            ${REACOES.map(r => `<span class="reacao-choice" data-tipo="${r.tipo}" style="cursor:pointer;font-size:22px;padding:2px 4px" title="${r.label}">${r.emoji}</span>`).join('')}
          </div>
        </div>
        <div class="comments-list">${comentarios.map(c => `<div class="comment-item"><b>${FASA.escapeHtml((c.usuarios || {}).nome || 'Colaborador')}</b><br>${FASA.escapeHtml(c.texto)}</div>`).join('')}</div>
        <div class="comment-box"><input type="text" placeholder="Escreva um comentário..."><button class="btn btn-sm btn-primary send-comment">Enviar</button></div>
      </div>`;
    }).join('') || `<div class="empty"><div class="big">📭</div>Ainda não há publicações. Seja o primeiro a postar!</div>`;
  }

  function side() {
    const emPlantao = FASA.getDB().usuarios.slice(0, 3);
    return `
    <div class="side-card card"><h3>Quem está de plantão agora</h3><div class="mini-list">

    </div><a class="btn btn-ghost btn-sm btn-block" style="margin-top:14px" data-route="escala">Ver escala completa</a></div>`;
  }

  function paintPreview() {
    const wrap = document.getElementById('anexo-preview-wrap');
    if (!arquivoSelecionado) { wrap.innerHTML = ''; return; }

    document.getElementById('anexo-remover').addEventListener('click', () => { arquivoSelecionado = null; paintPreview(); });
  }

  async function paint() {
    pageEl.innerHTML = `<div class="two-col"><div>
      <div class="card composer">${FASA.avatarHtml(user)}
        <div style="flex:1"><textarea id="post-text" placeholder="No que você está pensando, ${user.nome.split(' ')[0]}?"></textarea>
        <div id="anexo-preview-wrap"></div>
        <input type="file" id="foto-input-composer" accept="image/*" style="display:none">
        <input type="file" id="anexo-input-composer" style="display:none">
        <div class="composer-actions"><div class="composer-tools"><button class="tool-btn" id="foto-btn-composer">📷 Foto</button><button class="tool-btn" id="anexo-btn-composer">📎 Anexo</button></div>
        <button class="btn btn-primary btn-sm" id="post-submit">Publicar</button></div></div></div>
      <div id="posts-list"><div class="empty">Carregando publicações...</div></div>
    </div><div>${side()}</div></div>`;

    pageEl.querySelectorAll('[data-route]').forEach(a => a.addEventListener('click', () => FASA.go(a.dataset.route)));

    const fotoInput = document.getElementById('foto-input-composer');
    const anexoInput = document.getElementById('anexo-input-composer');
    document.getElementById('foto-btn-composer').addEventListener('click', () => fotoInput.click());
    document.getElementById('anexo-btn-composer').addEventListener('click', () => anexoInput.click());
    fotoInput.addEventListener('change', () => { if (fotoInput.files[0]) { arquivoSelecionado = fotoInput.files[0]; paintPreview(); } });
    anexoInput.addEventListener('change', () => { if (anexoInput.files[0]) { arquivoSelecionado = anexoInput.files[0]; paintPreview(); } });

    document.getElementById('post-submit').addEventListener('click', async () => {
      const ta = document.getElementById('post-text'), texto = ta.value.trim();
      if (!texto && !arquivoSelecionado) return;
      const btn = document.getElementById('post-submit');
      btn.disabled = true;
      btn.textContent = 'Publicando...';

      let payload = { autor_id: user.id, texto };
      if (arquivoSelecionado) {
        const path = `${user.id}/${Date.now()}-${arquivoSelecionado.name}`;
        const { error: upError } = await sb.storage.from('posts-media').upload(path, arquivoSelecionado);
        if (upError) { FASA.toast('Erro ao enviar arquivo: ' + upError.message); btn.disabled = false; btn.textContent = 'Publicar'; return; }
        const { data: pub } = sb.storage.from('posts-media').getPublicUrl(path);
        payload.arquivo_url = pub.publicUrl;
        payload.arquivo_tipo = arquivoSelecionado.type;
        payload.arquivo_nome = arquivoSelecionado.name;
      }

      const { error } = await sb.from('posts').insert(payload);
      btn.disabled = false;
      btn.textContent = 'Publicar';
      if (error) { FASA.toast('Erro ao publicar: ' + error.message); return; }
      ta.value = '';
      arquivoSelecionado = null;
      paintPreview();
      FASA.toast('Publicação criada!');
      refresh();
    });

    refresh();
  }

  async function refresh() {
    const list = await fetchPosts();
    const listEl = document.getElementById('posts-list');
    if (!listEl) return;
    listEl.innerHTML = postsHtml(list);
    bindPostEvents();
  }

  function bindPostEvents() {
    pageEl.querySelectorAll('.post').forEach(postEl => {
      const id = postEl.dataset.id;
      const likeBtn = postEl.querySelector('.like-btn');
      const pop = postEl.querySelector('.reacao-pop');
      likeBtn.addEventListener('click', async () => {
        const jaReagiu = likeBtn.classList.contains('liked');
        if (jaReagiu) {
          await sb.from('post_likes').delete().eq('post_id', id).eq('usuario_id', user.id);
          refresh();
        } else {
          pop.style.display = pop.style.display === 'none' ? 'flex' : 'none';
        }
      });
      pop.querySelectorAll('.reacao-choice').forEach(choice => choice.addEventListener('click', async () => {
        const tipo = choice.dataset.tipo;
        pop.style.display = 'none';
        await sb.from('post_likes').upsert({ post_id: id, usuario_id: user.id, tipo }, { onConflict: 'post_id,usuario_id' });
        refresh();
      }));
      postEl.querySelector('.comment-btn').addEventListener('click', () => postEl.querySelector('.comment-box').classList.toggle('open'));
      postEl.querySelector('.share-btn').addEventListener('click', () => FASA.toast('Publicação compartilhada no seu perfil!'));
      const sendBtn = postEl.querySelector('.send-comment');
      if (sendBtn) sendBtn.addEventListener('click', async () => {
        const input = postEl.querySelector('.comment-box input'), texto = input.value.trim();
        if (!texto) return;
        const { error } = await sb.from('comentarios').insert({ post_id: id, autor_id: user.id, texto });
        if (error) { FASA.toast('Erro ao comentar: ' + error.message); return; }
        refresh();
      });
      const delBtn = postEl.querySelector('.del-post-btn');
      if (delBtn) delBtn.addEventListener('click', async () => {
        if (!confirm('Excluir esta publicação? Essa ação não pode ser desfeita.')) return;
        const { error } = await sb.from('posts').delete().eq('id', id);
        if (error) { FASA.toast('Erro ao excluir: ' + error.message); return; }
        FASA.toast('Publicação excluída.');
        refresh();
      });
    });
  }

  paint();
}

/* ---------------- Perfil ---------------- */
async function renderPerfil() {
  const { user, pageEl } = renderShell('perfil', 'Meu Perfil');
  pageEl.innerHTML = `<div class="empty">Carregando perfil...</div>`;

  const { data: authData } = await sb.auth.getUser();
  const meuId = (authData && authData.user) ? authData.user.id : user.id;

  const { data: meusPosts, error } = await sb
    .from('posts')
    .select('*, post_likes(usuario_id)')
    .eq('autor_id', meuId)
    .order('criado_em', { ascending: false });

  if (error) { FASA.toast('Erro ao carregar perfil: ' + error.message); }
  const posts = meusPosts || [];
  const curtidasRecebidas = posts.reduce((s, p) => s + (p.post_likes || []).length, 0);

  const conquistas = [
    { ic: '🏅', t: 'Colaborador do mês', d: 'Reconhecido pela equipe' },
    { ic: '📚', t: 'Trilha concluída', d: 'Boas Práticas de Manipulação' },
    { ic: '💬', t: 'Voz ativa', d: '10+ contribuições em comunidades' },
  ];

  let editMode = false;

  function headerHtml() {
    const capaFallback = `background:linear-gradient(135deg,var(--primary),var(--accent))`;

    if (!editMode) {
      return `
      <div class="card" style="padding:0;overflow:hidden;margin-bottom:20px">
        <div style="position:relative;${user.capa_url ? '' : `height:130px;${capaFallback}`}">
          ${user.capa_url ? `<img src="${user.capa_url}" style="width:100%;display:block">` : ''}
          <button id="capa-btn" title="Alterar capa" style="position:absolute;bottom:10px;right:${user.capa_url ? '96px' : '10px'};background:rgba(22,36,31,.55);color:#fff;border:none;border-radius:var(--radius-pill);padding:6px 14px;font-size:12px;cursor:pointer">📷 Capa</button>
          ${user.capa_url ? `<button id="capa-remover-btn" title="Excluir capa" style="position:absolute;bottom:10px;right:10px;background:rgba(194,69,69,.75);color:#fff;border:none;border-radius:var(--radius-pill);padding:6px 14px;font-size:12px;cursor:pointer">🗑 Excluir</button>` : ''}
          <input type="file" id="capa-input" accept="image/*" style="display:none">
        </div>
        <div style="padding:0 20px 24px;text-align:center;margin-top:${user.capa_url ? '-40px' : '-40px'}">
          <div style="position:relative;width:80px;margin:0 auto 12px">
            ${FASA.avatarHtml(user, 'lg')}
            <button id="foto-btn" title="Alterar foto" style="position:absolute;bottom:-2px;right:-2px;width:26px;height:26px;border-radius:50%;background:var(--accent);border:2px solid #fff;color:#fff;font-size:12px;cursor:pointer">📷</button>
            <input type="file" id="foto-input" accept="image/*" style="display:none">
          </div>
          <h1 style="font-size:22px">${FASA.escapeHtml(user.nome)}</h1>
          <p style="color:var(--muted);font-size:13.5px;margin:4px 0 12px">${FASA.escapeHtml(user.cargo || '')} · ${FASA.escapeHtml(user.setor || '')}</p>
          ${user.bio ? `<p style="font-size:13.5px;color:var(--ink-soft);max-width:420px;margin:0 auto 14px">${FASA.escapeHtml(user.bio)}</p>` : ''}
          <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:16px">
            <span class="pill">Matrícula ${FASA.escapeHtml(user.matricula)}</span><span class="pill accent">${FASA.escapeHtml(user.tempo_empresa || 'A definir')} de empresa</span>
            ${user.ramal ? `<span class="pill">☎ Ramal ${FASA.escapeHtml(user.ramal)}</span>` : ''}
            ${user.data_admissao ? `<span class="pill">📅 Desde ${new Date(user.data_admissao + 'T00:00').toLocaleDateString('pt-BR')}</span>` : ''}
            ${user.admin ? '<span class="pill muted">Administrador</span>' : ''}
          </div>
          ${(user.habilidades || []).length ? `<div style="display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:16px">${user.habilidades.map(h => `<span class="pill muted">${FASA.escapeHtml(h)}</span>`).join('')}</div>` : ''}
          <button class="btn btn-ghost btn-sm" id="edit-perfil-btn">✎ Editar perfil</button>
        </div>
      </div>`;
    }

    return `
      <div class="card" style="padding:0;overflow:hidden;margin-bottom:20px">
        <div style="${user.capa_url ? '' : `height:130px;${capaFallback}`}">
          ${user.capa_url ? `<img src="${user.capa_url}" style="width:100%;display:block">` : ''}
        </div>
        <div style="padding:20px">
          <h3 style="margin-bottom:14px">Editar perfil</h3>
          <div class="field"><label>Cargo</label><input id="ep-cargo" value="${FASA.escapeHtml(user.cargo || '')}"></div>
          <div class="field"><label>Setor</label><input id="ep-setor" value="${FASA.escapeHtml(user.setor || '')}"></div>
          <div class="field"><label>Tempo de empresa</label><input id="ep-tempo" value="${FASA.escapeHtml(user.tempo_empresa || '')}"></div>
          <div class="field"><label>Ramal</label><input id="ep-ramal" value="${FASA.escapeHtml(user.ramal || '')}"></div>
          <div class="field"><label>Data de admissão</label><input type="date" id="ep-admissao" value="${user.data_admissao || ''}"></div>
          <div class="field"><label>Habilidades (separadas por vírgula)</label><input id="ep-habilidades" value="${FASA.escapeHtml((user.habilidades || []).join(', '))}" placeholder="Ex: Excel, Manipulação, Atendimento"></div>
          <div class="field"><label>Bio (uma frase sobre você)</label><textarea id="ep-bio" rows="3" style="width:100%;padding:12px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit">${FASA.escapeHtml(user.bio || '')}</textarea></div>
          <div style="display:flex;gap:10px">
            <button class="btn btn-primary" id="ep-salvar">Salvar</button>
            <button class="btn btn-ghost" id="ep-cancelar">Cancelar</button>
          </div>
        </div>
      </div>`;
  }

  function bindHeaderEvents() {
    if (!editMode) {
      document.getElementById('edit-perfil-btn').addEventListener('click', () => { editMode = true; paintHeader(); });

      const fotoBtn = document.getElementById('foto-btn');
      const fotoInput = document.getElementById('foto-input');
      fotoBtn.addEventListener('click', () => fotoInput.click());
      fotoInput.addEventListener('change', () => uploadImagem(fotoInput.files[0], 'avatar', 'foto_url', fotoBtn));

      const capaBtn = document.getElementById('capa-btn');
      const capaInput = document.getElementById('capa-input');
      capaBtn.addEventListener('click', () => capaInput.click());
      capaInput.addEventListener('change', () => uploadImagem(capaInput.files[0], 'capa', 'capa_url', capaBtn));

      const capaRemoverBtn = document.getElementById('capa-remover-btn');
      if (capaRemoverBtn) capaRemoverBtn.addEventListener('click', async () => {
        if (!confirm('Excluir a foto de capa?')) return;
        const { error: updError } = await sb.from('usuarios').update({ capa_url: null }).eq('id', user.id);
        if (updError) { FASA.toast('Erro ao excluir: ' + updError.message); return; }
        user.capa_url = null;
        const db = FASA.getDB();
        const jaExiste = db.usuarios.find(u => u.id === user.id);
        if (jaExiste) jaExiste.capa_url = null;
        FASA.saveDB(db);
        FASA.toast('Capa removida.');
        paintHeader();
      });
    } else {
      document.getElementById('ep-cancelar').addEventListener('click', () => { editMode = false; paintHeader(); });
      document.getElementById('ep-salvar').addEventListener('click', async () => {
        const cargo = document.getElementById('ep-cargo').value.trim();
        const setor = document.getElementById('ep-setor').value.trim();
        const tempo_empresa = document.getElementById('ep-tempo').value.trim();
        const ramal = document.getElementById('ep-ramal').value.trim();
        const data_admissao = document.getElementById('ep-admissao').value || null;
        const habilidades = document.getElementById('ep-habilidades').value.split(',').map(h => h.trim()).filter(Boolean);
        const bio = document.getElementById('ep-bio').value.trim();
        const { error: updError } = await sb.from('usuarios').update({ cargo, setor, tempo_empresa, ramal, data_admissao, habilidades, bio }).eq('id', user.id);
        if (updError) { FASA.toast('Erro ao salvar: ' + updError.message); return; }
        Object.assign(user, { cargo, setor, tempo_empresa, ramal, data_admissao, habilidades, bio });
        const db = FASA.getDB();
        const jaExiste = db.usuarios.find(u => u.id === user.id);
        if (jaExiste) Object.assign(jaExiste, { cargo, setor, tempo_empresa, ramal, data_admissao, habilidades, bio });
        FASA.saveDB(db);
        editMode = false;
        FASA.toast('Perfil atualizado!');
        paintHeader();
      });
    }
  }

  async function uploadImagem(file, nomeArquivo, coluna, btnEl) {
    if (!file) return;
    btnEl.textContent = '…';
    const ext = file.name.split('.').pop();
    const path = `${user.id}/${nomeArquivo}.${ext}`;

    const { error: upError } = await sb.storage.from('avatars').upload(path, file, { upsert: true });
    if (upError) { FASA.toast('Erro ao enviar imagem: ' + upError.message); paintHeader(); return; }

    const { data: pub } = sb.storage.from('avatars').getPublicUrl(path);
    const url = pub.publicUrl + '?t=' + Date.now();

    const { error: updError } = await sb.from('usuarios').update({ [coluna]: url }).eq('id', user.id);
    if (updError) { FASA.toast('Erro ao salvar imagem: ' + updError.message); paintHeader(); return; }

    user[coluna] = url;
    const db = FASA.getDB();
    const jaExiste = db.usuarios.find(u => u.id === user.id);
    if (jaExiste) jaExiste[coluna] = url;
    FASA.saveDB(db);

    FASA.toast('Imagem atualizada!');
    paintHeader();
  }

  function paintHeader() {
    document.getElementById('perfil-header').outerHTML = `<div id="perfil-header">${headerHtml()}</div>`;
    bindHeaderEvents();
  }

  pageEl.innerHTML = `
    <div id="perfil-header">${headerHtml()}</div>
    <div class="grid grid-3" style="margin-bottom:20px">
      <div class="card stat-card"><div class="num">${posts.length}</div><div class="lbl">Publicações</div></div>
      <div class="card stat-card"><div class="num">${curtidasRecebidas}</div><div class="lbl">Curtidas recebidas</div></div>
      <div class="card stat-card"><div class="num">${user.pontos}</div><div class="lbl">Pontos de reconhecimento</div></div>
    </div>
    <div class="card" style="margin-bottom:20px"><h3 style="margin-bottom:14px">Conquistas</h3><div class="grid grid-3">
      ${conquistas.map(c => `<div style="text-align:center;padding:14px;border:1px solid var(--line);border-radius:var(--radius-sm)"><div style="font-size:26px;margin-bottom:6px">${c.ic}</div><div style="font-weight:700;font-size:13px">${c.t}</div><div style="font-size:11.5px;color:var(--muted)">${c.d}</div></div>`).join('')}
    </div></div>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h3>Minhas publicações</h3><button class="btn btn-ghost btn-sm" id="perfil-refresh-btn">↻ Atualizar</button></div>
      ${posts.length ? posts.map(p => `<div style="padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px"><div style="color:var(--muted);font-size:11.5px;margin-bottom:4px">${FASA.timeAgo(new Date(p.criado_em).getTime())}</div>${FASA.escapeHtml(p.texto)}${p.arquivo_url ? ((p.arquivo_tipo || '').startsWith('image/') ? `<img src="${p.arquivo_url}" style="max-width:100%;border-radius:8px;margin-top:8px;display:block">` : `<a href="${p.arquivo_url}" target="_blank" style="display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);margin-top:8px;color:var(--primary-dk)">📎 ${FASA.escapeHtml(p.arquivo_nome || 'Anexo')}</a>`) : ''}</div>`).join('') : `<div class="empty">Você ainda não publicou nada.</div>`}
    </div>`;

  bindHeaderEvents();
  document.getElementById('perfil-refresh-btn').addEventListener('click', () => renderPerfil());
}

/* ---------------- Comunidades ---------------- */
async function renderComunidades() {
  const { user, pageEl } = renderShell('comunidades', 'Comunidades');
  pageEl.innerHTML = `<div class="empty">Carregando comunidades...</div>`;

  async function load() {
    const { data: comunidades, error: e1 } = await sb.from('comunidades').select('*').order('nome');
    const { data: membros, error: e2 } = await sb.from('comunidade_membros').select('comunidade_id');
    const { data: minhas, error: e3 } = await sb.from('comunidade_membros').select('comunidade_id').eq('usuario_id', user.id);
    if (e1 || e2 || e3) { FASA.toast('Erro ao carregar comunidades'); return; }

    const contagem = {};
    (membros || []).forEach(m => { contagem[m.comunidade_id] = (contagem[m.comunidade_id] || 0) + 1; });
    const joined = new Set((minhas || []).map(m => m.comunidade_id));

    pageEl.innerHTML = `
      <p style="color:var(--muted);font-size:13.5px;margin-bottom:18px">Participe das comunidades da sua equipe para trocar experiências, tirar dúvidas e acompanhar novidades por setor.</p>
      <div class="grid grid-3">
        ${(comunidades || []).map(c => {
          const isIn = joined.has(c.id);
          return `<div class="card comm-card" data-id="${c.id}"><div class="comm-banner"></div><h3>${FASA.escapeHtml(c.nome)}</h3><div class="desc">${FASA.escapeHtml(c.descricao || '')}</div>
          <div class="foot"><span class="pill muted">${contagem[c.id] || 0} membros</span><button class="btn btn-sm ${isIn ? 'btn-ghost' : 'btn-primary'} join-btn">${isIn ? 'Participando' : 'Participar'}</button></div></div>`;
        }).join('')}
      </div>`;

    pageEl.querySelectorAll('.comm-card').forEach(card => {
      card.querySelector('.join-btn').addEventListener('click', async () => {
        const id = card.dataset.id;
        if (joined.has(id)) {
          await sb.from('comunidade_membros').delete().eq('comunidade_id', id).eq('usuario_id', user.id);
        } else {
          await sb.from('comunidade_membros').insert({ comunidade_id: id, usuario_id: user.id });
        }
        load();
      });
    });
  }
  load();
}

function renderAvisos() {
  const { user, pageEl } = renderShell('avisos', 'Avisos');
  const podePublicar = user.admin;

  async function paint() {
    pageEl.innerHTML = `<div class="empty">Carregando avisos...</div>`;

      .from('avisos')

    pageEl.innerHTML = `
      ${podePublicar ? `<div class="card" style="margin-bottom:20px"><h3 style="margin-bottom:12px">Publicar novo aviso</h3>
        <div class="field"><input id="av-titulo" placeholder="Título do aviso"></div>
        <div class="field"><textarea id="av-texto" rows="3" style="width:100%;padding:12px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit" placeholder="Escreva o aviso..."></textarea></div>
        <button class="btn btn-accent" id="av-submit">Publicar aviso</button></div>`
        : `<div class="card" style="margin-bottom:20px;color:var(--muted);font-size:13px">Somente líderes podem publicar avisos. Você pode visualizar todos os comunicados abaixo.</div>`}
      <div class="card" style="display:flex;flex-direction:column;gap:20px">
        ${(avisos || []).map(a => { const au = a.usuarios || { nome: 'Liderança' }; return `<div class="aviso" style="display:flex;justify-content:space-between;gap:10px"><div><h3>${FASA.escapeHtml(a.titulo)}</h3><div class="sub">${FASA.escapeHtml(au.nome)} · ${FASA.timeAgo(new Date(a.criado_em).getTime())}</div><p>${FASA.escapeHtml(a.texto)}</p></div>${podePublicar ? `<button class="icon-btn del-aviso-btn" data-id="${a.id}" title="Excluir aviso">🗑</button>` : ''}</div>`; }).join('') || `<div class="empty">Nenhum aviso publicado ainda.</div>`}
      </div>`;
    pageEl.querySelectorAll('.del-aviso-btn').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('Excluir este aviso?')) return;
      const { error: delError } = await sb.from('avisos').delete().eq('id', b.dataset.id);
      if (delError) { FASA.toast('Erro ao excluir: ' + delError.message); return; }
      paint();
    }));
    const btn = document.getElementById('av-submit');
    if (btn) btn.addEventListener('click', async () => {
      const titulo = document.getElementById('av-titulo').value.trim(), texto = document.getElementById('av-texto').value.trim();
      if (!titulo || !texto) return;
      const { error: insError } = await sb.from('avisos').insert({ autor_id: user.id, titulo, texto });
      if (insError) { FASA.toast('Erro ao publicar: ' + insError.message); return; }
      FASA.toast('Aviso publicado!'); paint();
    });
  }
  paint();
}

/* ---------------- Escala ---------------- */
async function renderEscala() {
  const { user, pageEl } = renderShell('escala', 'Escalas');
  pageEl.innerHTML = `<div class="empty">Carregando escala...</div>`;

  const ABAS = [
    { id: 'todas', label: 'Todas' },
    { id: 'noturno-a', label: 'Noturno A' },
    { id: 'noturno-b', label: 'Noturno B' },
    { id: 'diurno', label: 'Diurno' },
    { id: 'diurno-a', label: 'Diurno A' },
    { id: 'diurno-b', label: 'Diurno B' },
    { id: 'plantao-diurno', label: 'Plantão Diurno' },
  ];
  const CORES_AUSENCIA = { 'Folga': 'ok', 'Férias': 'muted', 'Afastamento': 'warn', 'Descanso': 'ok', 'Banco de Horas': 'off' };
  let abaFiltro = 'todas';
  let selecionado = new Date();
  let busca = '';
  let subview = 'calendario';

  function iso(d) { return d.toISOString().slice(0, 10); }
  function addDias(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
  function inicioSemana(d) { const r = new Date(d); r.setDate(r.getDate() - r.getDay()); return r; }
  const DIAS_CURTO = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

  const [{ data: escalas, error: e1 }, { data: ausencias, error: e2 }] = await Promise.all([
    sb.from('escalas').select('id, data, turno, aba, usuario_id, usuarios!escalas_usuario_id_fkey(nome,cargo,foto_url)').not('data', 'is', null),
    sb.from('ausencias').select('id, tipo, status, data_inicio, data_fim, observacao, usuario_id, usuarios!ausencias_usuario_id_fkey(nome,cargo,foto_url)'),
  ]);
  if (e1 || e2) FASA.toast('Erro ao carregar escala/ausências');

  function subNavHtml() {
    const itens = [{ id: 'calendario', ic: '📅', label: 'Calendário' }, { id: 'negociacoes', ic: '🔄', label: 'Negociações' }, { id: 'banco', ic: '🕐', label: 'Banco de Horas' }];
    return `<div class="tabs" style="margin-bottom:18px">${itens.map(i => `<div class="tab ${i.id === subview ? 'active' : ''}" data-subview="${i.id}">${i.ic} ${i.label}</div>`).join('')}</div>`;
  }
  function bindSubNav() {
    pageEl.querySelectorAll('[data-subview]').forEach(t => t.addEventListener('click', () => { subview = t.dataset.subview; negSubview = null; renderSub(); }));
  }
  let negSubview = null; // null = menu | 'turnos' | 'folgas' | 'descansos' | 'remanejamentos'

  function escalasDoDia(dataISO) {
    let linhas = (escalas || []).filter(r => r.data === dataISO);
    if (abaFiltro !== 'todas') linhas = linhas.filter(r => r.aba === abaFiltro);
    if (busca.trim()) { const t = busca.trim().toLowerCase(); linhas = linhas.filter(r => ((r.usuarios || {}).nome || '').toLowerCase().includes(t)); }
    return linhas;
  }
  function ausenciasDoDia(dataISO) {
    let linhas = (ausencias || []).filter(a => (a.status || 'Aprovada') === 'Aprovada' && a.data_inicio <= dataISO && dataISO <= a.data_fim);
    if (busca.trim()) { const t = busca.trim().toLowerCase(); linhas = linhas.filter(a => ((a.usuarios || {}).nome || '').toLowerCase().includes(t)); }
    return linhas;
  }
  function temAlgo(dataISO) { return escalasDoDia(dataISO).length > 0 || ausenciasDoDia(dataISO).length > 0; }

  function proximoPlantao() {
    const hojeISO = iso(new Date());
    const minhas = (escalas || []).filter(r => r.usuario_id === user.id && r.data >= hojeISO).sort((a, b) => a.data.localeCompare(b.data));
    return minhas[0] || null;
  }

  function paintCalendario() {
    const dataISO = iso(selecionado);
    const semanaInicio = inicioSemana(selecionado);
    const dias = Array.from({ length: 7 }, (_, i) => addDias(semanaInicio, i));

    const trabalhando = escalasDoDia(dataISO);
    const ausentes = ausenciasDoDia(dataISO);
    const proximo = proximoPlantao();

    pageEl.innerHTML = subNavHtml() + `
      <!-- Cabeçalho -->
      <div class="card" style="display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap">
        ${FASA.avatarHtml(user, 'lg')}
        <div style="flex:1;min-width:180px">
          <h1 style="font-size:19px">${FASA.escapeHtml(user.nome)}</h1>
          <p style="color:var(--muted);font-size:13px;margin:2px 0 0">${FASA.escapeHtml(user.cargo || '')} · ${FASA.escapeHtml(user.setor || '')}</p>
        </div>
      </div>

      <!-- Próximo plantão -->
      <div class="card" style="background:linear-gradient(135deg,var(--primary-dk),var(--primary));color:#fff;margin-bottom:18px;border:none">
        <div class="eyebrow" style="color:rgba(255,255,255,.75)">Próximo plantão</div>
        ${proximo ? `
          <h2 style="color:#fff;font-size:22px;margin:8px 0 4px">${new Date(proximo.data + 'T00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'long' })} · ${FASA.escapeHtml(proximo.turno)}</h2>
        ` : `<p style="opacity:.9;font-size:14px;margin-top:8px">Nenhum plantão futuro cadastrado pra você ainda.</p>`}
      </div>

      <!-- Calendário semanal -->
      <div class="card" style="margin-bottom:18px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
          <h3 style="font-size:16px">${MESES[selecionado.getMonth()]} ${selecionado.getFullYear()}</h3>
          <div style="display:flex;gap:6px">
            <button class="icon-btn" id="semana-anterior">◀</button>
            <button class="icon-btn" id="semana-proxima">▶</button>
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;gap:4px">
          ${dias.map(d => {
            const di = iso(d);
            const isHoje = di === iso(new Date());
            const isSel = di === dataISO;
            return `<div class="cal-dia ${isSel ? 'sel' : ''} ${isHoje ? 'hoje' : ''}" data-data="${di}" style="flex:1;text-align:center;cursor:pointer;padding:8px 2px;border-radius:12px;${isSel ? 'background:var(--primary);color:#fff' : ''}">
              <div style="font-size:10.5px;color:${isSel ? 'rgba(255,255,255,.8)' : 'var(--muted)'}">${DIAS_CURTO[d.getDay()]}</div>
              <div style="font-weight:700;font-size:15px;margin:2px 0">${d.getDate()}</div>
              <div style="height:5px">${temAlgo(di) ? `<span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:${isSel ? '#fff' : 'var(--accent)'}"></span>` : ''}</div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <!-- Filtro por aba + busca -->
      <div class="tabs">${ABAS.map(a => `<div class="tab ${a.id === abaFiltro ? 'active' : ''}" data-aba="${a.id}">${a.label}</div>`).join('')}</div>
      <div class="topbar-search" style="margin-bottom:18px;max-width:none"><input id="escala-busca" placeholder="🔍 Buscar colaborador..." value="${FASA.escapeHtml(busca)}"></div>

      <!-- Trabalhando neste dia -->
      <div class="card" style="margin-bottom:14px">
        <h3 style="font-size:15px;margin-bottom:12px">Trabalhando em ${selecionado.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })}</h3>
        <div class="mini-list">
          ${trabalhando.map(r => { const p = r.usuarios || {}; return `<div class="mini-item">${FASA.avatarHtml(p, 'sm')}<div class="t"><div class="n">${FASA.escapeHtml(p.nome || '—')}</div><div class="s">${FASA.escapeHtml(p.cargo || '')}</div></div><span class="pill accent">${FASA.escapeHtml(r.turno)}</span></div>`; }).join('') || `<div class="empty">Ninguém escalado neste dia (com esse filtro).</div>`}
        </div>
      </div>

      <!-- Ausentes neste dia -->
      <div class="card">
        <h3 style="font-size:15px;margin-bottom:12px">Ausências neste dia</h3>
        <div class="mini-list">
          ${ausentes.map(a => { const p = a.usuarios || {}; return `<div class="mini-item">${FASA.avatarHtml(p, 'sm')}<div class="t"><div class="n">${FASA.escapeHtml(p.nome || '—')}</div><div class="s">${FASA.escapeHtml(a.observacao || '')}</div></div><span class="badge ${CORES_AUSENCIA[a.tipo] || 'off'}">${FASA.escapeHtml(a.tipo)}</span></div>`; }).join('') || `<div class="empty">Ninguém ausente neste dia.</div>`}
        </div>
      </div>
      <p style="color:var(--muted);font-size:12.5px;margin-top:14px">A escala é definida pela liderança de cada setor e pode ser ajustada pela Administração.</p>`;

    bindSubNav();
    pageEl.querySelectorAll('.cal-dia').forEach(el => el.addEventListener('click', () => { selecionado = new Date(el.dataset.data + 'T00:00'); paintCalendario(); }));
    document.getElementById('semana-anterior').addEventListener('click', () => { selecionado = addDias(selecionado, -7); paintCalendario(); });
    document.getElementById('semana-proxima').addEventListener('click', () => { selecionado = addDias(selecionado, 7); paintCalendario(); });
    pageEl.querySelectorAll('.tab[data-aba]').forEach(t => t.addEventListener('click', () => { abaFiltro = t.dataset.aba; paintCalendario(); }));
    const buscaInput = document.getElementById('escala-busca');
    buscaInput.addEventListener('input', (e) => { busca = e.target.value; paintCalendario(); });
    buscaInput.focus();
    buscaInput.setSelectionRange(busca.length, busca.length);
  }

  function voltarBtnHtml() {
    return `<button class="btn btn-ghost btn-sm" id="neg-voltar" style="margin-bottom:14px">← Voltar</button>`;
  }
  function bindVoltar(fn) {
    const btn = document.getElementById('neg-voltar');
    if (btn) btn.addEventListener('click', () => { negSubview = null; fn(); });
  }

  function paintNegociacoesMenu() {
    const itens = [
      { id: 'turnos', ic: '🔄', label: 'Turnos', desc: 'Solicitar troca de plantão' },
      { id: 'folgas', ic: '🌂', label: 'Folgas', desc: 'Folga, férias ou atestado' },
      { id: 'descansos', ic: '🛌', label: 'Descansos', desc: 'Solicitar um descanso avulso' },
      { id: 'remanejamentos', ic: '🔀', label: 'Remanejamentos', desc: 'Pedir mudança de turno/escala' },
    ];
    pageEl.innerHTML = subNavHtml() + `
      <div class="card" style="padding:0">
        ${itens.map((i, idx) => `
          <div class="neg-menu-item" data-neg="${i.id}" style="display:flex;align-items:center;gap:14px;padding:16px;cursor:pointer;${idx < itens.length - 1 ? 'border-bottom:1px solid var(--line)' : ''}">
            <div style="font-size:22px">${i.ic}</div>
            <div style="flex:1"><div style="font-weight:700;font-size:14.5px">${i.label}</div><div style="font-size:12.5px;color:var(--muted)">${i.desc}</div></div>
            <div style="color:var(--muted);font-size:18px">›</div>
          </div>`).join('')}
      </div>`;
    bindSubNav();
    pageEl.querySelectorAll('.neg-menu-item').forEach(el => el.addEventListener('click', () => { negSubview = el.dataset.neg; paintNegociacoes(); }));
  }

  async function paintNegTurnos() {
    pageEl.innerHTML = subNavHtml() + voltarBtnHtml() + `<div class="empty">Carregando negociações...</div>`;
    const { data: trocas, error: e3 } = await sb
      .from('trocas_plantao')
      .select('id, motivo, status, criado_em, solicitante_id, escala_id, colega_id, usuarios!trocas_plantao_solicitante_id_fkey(nome), colega:usuarios!trocas_plantao_colega_id_fkey(nome), escalas(data, turno)')
      .order('criado_em', { ascending: false });
    if (e3) FASA.toast('Erro ao carregar negociações: ' + e3.message);

    const minhasEscalasFuturas = (escalas || []).filter(r => r.usuario_id === user.id && r.data >= iso(new Date()));
    const colegasMap = new Map((escalas || []).filter(r => r.usuario_id !== user.id).map(r => [r.usuario_id, r.usuarios]));
    const colegas = [...colegasMap.entries()].filter(([, v]) => v);

    const STATUS_COR = { Pendente: 'warn', Aprovada: 'ok', Recusada: 'off', Cancelada: 'off' };

    pageEl.innerHTML = subNavHtml() + voltarBtnHtml() + `
      <h2 style="font-size:18px;margin-bottom:14px">🔄 Turnos</h2>
      <div class="card" style="margin-bottom:18px">
        <h3 style="margin-bottom:12px">Solicitar troca de plantão</h3>
        ${minhasEscalasFuturas.length ? `
          <div class="grid grid-2" style="margin-bottom:0">
            <div class="field"><label>Qual plantão seu</label><select id="ng-escala">${minhasEscalasFuturas.map(r => `<option value="${r.id}">${new Date(r.data + 'T00:00').toLocaleDateString('pt-BR')} · ${FASA.escapeHtml(r.turno)}</option>`).join('')}</select></div>
            <div class="field"><label>Trocar com (opcional)</label><select id="ng-colega"><option value="">Qualquer colega</option>${colegas.map(([id, v]) => `<option value="${id}">${FASA.escapeHtml(v.nome || '')}</option>`).join('')}</select></div>
          </div>
          <div class="field"><label>Motivo (opcional)</label><input id="ng-motivo" placeholder="Ex: compromisso pessoal"></div>
          <button class="btn btn-accent" id="ng-submit">Solicitar troca</button>
        ` : `<div class="empty">Você não tem plantões futuros nesta lista pra trocar.</div>`}
      </div>
      <h3 style="font-size:15px;margin-bottom:12px">${user.admin ? 'Todas as solicitações' : 'Minhas solicitações'}</h3>
      <div style="display:flex;flex-direction:column;gap:12px">
        ${(trocas || []).filter(t => user.admin || t.solicitante_id === user.id).map(t => `
          <div class="card" data-id="${t.id}">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
              <div>
                <b>${FASA.escapeHtml((t.usuarios || {}).nome || '—')}</b>
                <div style="font-size:12.5px;color:var(--muted)">${t.escalas ? new Date(t.escalas.data + 'T00:00').toLocaleDateString('pt-BR') + ' · ' + FASA.escapeHtml(t.escalas.turno) : ''}</div>
                ${t.colega_id ? `<div style="font-size:12px;color:var(--muted)">Proposto: ${FASA.escapeHtml((t.colega || {}).nome || '—')}</div>` : ''}
                ${t.motivo ? `<p style="font-size:13px;color:var(--ink-soft);margin:6px 0 0">${FASA.escapeHtml(t.motivo)}</p>` : ''}
              </div>
              <span class="badge ${STATUS_COR[t.status] || 'off'}">${FASA.escapeHtml(t.status)}</span>
            </div>
            <div style="display:flex;gap:8px;margin-top:10px">
              ${user.admin && t.status === 'Pendente' ? `<button class="btn btn-sm btn-primary ng-aprovar">Aprovar</button><button class="btn btn-sm btn-ghost ng-recusar">Recusar</button>` : ''}
              ${(t.solicitante_id === user.id && t.status === 'Pendente') ? `<button class="btn btn-sm btn-ghost ng-cancelar">Cancelar solicitação</button>` : ''}
            </div>
          </div>`).join('') || `<div class="card"><div class="empty">Nenhuma solicitação ainda.</div></div>`}
      </div>`;

    bindSubNav();
    bindVoltar(paintNegociacoesMenu);
    const submitBtn = document.getElementById('ng-submit');
    if (submitBtn) submitBtn.addEventListener('click', async () => {
      const escala_id = document.getElementById('ng-escala').value;
      const colega_id = document.getElementById('ng-colega').value || null;
      const motivo = document.getElementById('ng-motivo').value.trim();
      const { error: insError } = await sb.from('trocas_plantao').insert({ solicitante_id: user.id, escala_id, colega_id, motivo });
      if (insError) { FASA.toast('Erro ao solicitar: ' + insError.message); return; }
      FASA.toast('Solicitação enviada!');
      paintNegTurnos();
    });
    pageEl.querySelectorAll('.card[data-id]').forEach(card => {
      const id = card.dataset.id;
      const aprovar = card.querySelector('.ng-aprovar');
      if (aprovar) aprovar.addEventListener('click', async () => {
        const { error: updError } = await sb.from('trocas_plantao').update({ status: 'Aprovada', respondido_em: new Date().toISOString() }).eq('id', id);
        if (updError) { FASA.toast('Erro: ' + updError.message); return; }
        FASA.toast('Troca aprovada! Ajuste a escala em Administração se necessário.');
        paintNegTurnos();
      });
      const recusar = card.querySelector('.ng-recusar');
      if (recusar) recusar.addEventListener('click', async () => {
        const { error: updError } = await sb.from('trocas_plantao').update({ status: 'Recusada', respondido_em: new Date().toISOString() }).eq('id', id);
        if (updError) { FASA.toast('Erro: ' + updError.message); return; }
        FASA.toast('Troca recusada.');
        paintNegTurnos();
      });
      const cancelar = card.querySelector('.ng-cancelar');
      if (cancelar) cancelar.addEventListener('click', async () => {
        const { error: updError } = await sb.from('trocas_plantao').update({ status: 'Cancelada' }).eq('id', id);
        if (updError) { FASA.toast('Erro: ' + updError.message); return; }
        paintNegTurnos();
      });
    });
  }

  async function paintNegAusencia(config) {
    // config = { tipos, tituloIcone, tituloTexto, subtitulo }
    pageEl.innerHTML = subNavHtml() + voltarBtnHtml() + `<div class="empty">Carregando...</div>`;
    const { data: minhas, error: e4 } = await sb
      .from('ausencias')
      .select('id, tipo, status, data_inicio, data_fim, observacao')
      .eq('usuario_id', user.id)
      .in('tipo', config.tipos)
      .order('data_inicio', { ascending: false });
    if (e4) FASA.toast('Erro ao carregar solicitações: ' + e4.message);

    const STATUS_COR = { Pendente: 'warn', Aprovada: 'ok', Recusada: 'off' };
    const hojeISO = iso(new Date());

    pageEl.innerHTML = subNavHtml() + voltarBtnHtml() + `
      <h2 style="font-size:18px;margin-bottom:14px">${config.tituloIcone} ${config.tituloTexto}</h2>
      <div class="card" style="margin-bottom:18px">
        <h3 style="margin-bottom:12px">${config.subtitulo}</h3>
        <div class="grid grid-2">
          ${config.tipos.length > 1 ? `<div class="field"><label>Tipo</label><select id="au-tipo">${config.tipos.map(t => `<option>${t}</option>`).join('')}</select></div>` : `<input type="hidden" id="au-tipo" value="${config.tipos[0]}">`}
          <div class="field"><label>Data início</label><input type="date" id="au-inicio" value="${hojeISO}"></div>
          <div class="field"><label>Data fim</label><input type="date" id="au-fim" value="${hojeISO}"></div>
        </div>
        <div class="field"><label>Observação (opcional)</label><input id="au-obs" placeholder="Ex: consulta médica, viagem em família..."></div>
        <button class="btn btn-accent" id="au-submit">Enviar solicitação</button>
      </div>
      <h3 style="font-size:15px;margin-bottom:12px">Minhas solicitações</h3>
      <div style="display:flex;flex-direction:column;gap:12px">
        ${(minhas || []).map(a => `
          <div class="card" data-id="${a.id}">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
              <div>
                <b>${FASA.escapeHtml(a.tipo)}</b>
                <div style="font-size:12.5px;color:var(--muted)">${new Date(a.data_inicio + 'T00:00').toLocaleDateString('pt-BR')} — ${new Date(a.data_fim + 'T00:00').toLocaleDateString('pt-BR')}</div>
                ${a.observacao ? `<p style="font-size:13px;color:var(--ink-soft);margin:6px 0 0">${FASA.escapeHtml(a.observacao)}</p>` : ''}
              </div>
              <span class="badge ${STATUS_COR[a.status] || 'off'}">${FASA.escapeHtml(a.status)}</span>
            </div>
            ${a.status === 'Pendente' ? `<button class="btn btn-sm btn-ghost au-cancelar" style="margin-top:10px">Cancelar solicitação</button>` : ''}
          </div>`).join('') || `<div class="card"><div class="empty">Nenhuma solicitação ainda.</div></div>`}
      </div>`;

    bindSubNav();
    bindVoltar(paintNegociacoesMenu);
    document.getElementById('au-submit').addEventListener('click', async () => {
      const tipo = document.getElementById('au-tipo').value;
      const data_inicio = document.getElementById('au-inicio').value;
      const data_fim = document.getElementById('au-fim').value;
      const observacao = document.getElementById('au-obs').value.trim();
      if (!data_inicio || !data_fim) { FASA.toast('Preencha as datas.'); return; }
      if (data_fim < data_inicio) { FASA.toast('A data de fim não pode ser antes da data de início.'); return; }
      const { error: insError } = await sb.from('ausencias').insert({ usuario_id: user.id, tipo, data_inicio, data_fim, observacao, status: 'Pendente' });
      if (insError) { FASA.toast('Erro ao enviar: ' + insError.message); return; }
      FASA.toast('Solicitação enviada! Aguarde a aprovação da liderança.');
      paintNegAusencia(config);

    pageEl.querySelectorAll('.au-cancelar').forEach(btn => btn.addEventListener('click', async () => {
      const id = btn.closest('.card[data-id]').dataset.id;
      const { error: delError } = await sb.from('ausencias').delete().eq('id', id);
      if (delError) { FASA.toast('Erro ao cancelar: ' + delError.message); return; }
      paintNegAusencia(config);
    }));
  }

  async function paintNegRemanejamentos() {
    pageEl.innerHTML = subNavHtml() + voltarBtnHtml() + `<div class="empty">Carregando...</div>`;
    const ESCALAS_NOMES = ['Noturno A', 'Noturno B', 'Diurno', 'Diurno A', 'Diurno B', 'Plantão Diurno'];
    const minhaEscalaAtual = (escalas.find(r => r.usuario_id === user.id) || {}).turno || '';
    const { data: minhas, error: e5 } = await sb
      .from('remanejamentos')
      .select('id, aba_atual, aba_desejada, motivo, status, criado_em')
      .eq('solicitante_id', user.id)
      .order('criado_em', { ascending: false });
    if (e5) FASA.toast('Erro ao carregar remanejamentos: ' + e5.message);

    const STATUS_COR = { Pendente: 'warn', Aprovado: 'ok', Recusado: 'off' };

    pageEl.innerHTML = subNavHtml() + voltarBtnHtml() + `
      <h2 style="font-size:18px;margin-bottom:14px">🔀 Remanejamentos</h2>
      <div class="card" style="margin-bottom:18px">
        <h3 style="margin-bottom:12px">Pedir mudança de turno/escala</h3>
        <div class="field"><label>Escala/turno desejado</label><select id="rm-desejada">${ESCALAS_NOMES.map(n => `<option>${n}</option>`).join('')}</select></div>
        <div class="field"><label>Motivo (opcional)</label><input id="rm-motivo" placeholder="Ex: mudança de horário de estudo"></div>
        <button class="btn btn-accent" id="rm-submit">Enviar pedido</button>
      </div>
      <h3 style="font-size:15px;margin-bottom:12px">Minhas solicitações</h3>
      <div style="display:flex;flex-direction:column;gap:12px">
        ${(minhas || []).map(r => `
          <div class="card" data-id="${r.id}">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
              <div>
                <b>${FASA.escapeHtml(r.aba_atual || 'Atual')} → ${FASA.escapeHtml(r.aba_desejada)}</b>

      FASA.toast('Pedido enviado!');
      paintNegRemanejamentos();
    });
    pageEl.querySelectorAll('.rm-cancelar').forEach(btn => btn.addEventListener('click', async () => {
      const id = btn.closest('.card[data-id]').dataset.id;
      const { error: delError } = await sb.from('remanejamentos').delete().eq('id', id);
      if (delError) { FASA.toast('Erro ao cancelar: ' + delError.message); return; }
      paintNegRemanejamentos();

  function paintNegociacoes() {
    if (negSubview === 'turnos') paintNegTurnos();
    else if (negSubview === 'folgas') paintNegAusencia({ tipos: ['Folga', 'Férias', 'Afastamento'], tituloIcone: '🌂', tituloTexto: 'Folgas', subtitulo: 'Solicitar folga, férias ou atestado' });
    else if (negSubview === 'descansos') paintNegAusencia({ tipos: ['Descanso'], tituloIcone: '🛌', tituloTexto: 'Descansos', subtitulo: 'Solicitar um descanso avulso' });
    else if (negSubview === 'remanejamentos') paintNegRemanejamentos();
    else paintNegociacoesMenu();
  }

  async function paintBancoHoras() {
    pageEl.innerHTML = subNavHtml() + `<div class="empty">Carregando banco de horas...</div>`;
    const { data: lancamentos, error: e6 } = await sb
      .from('banco_horas')
      .select('id, tipo, horas, data, aba, observacao, status')
      .eq('usuario_id', user.id)
      .order('data', { ascending: false });
    if (e6) FASA.toast('Erro ao carregar banco de horas: ' + e6.message);

    const aprovados = (lancamentos || []).filter(l => l.status === 'Aprovada');
    const saldo = aprovados.reduce((s, l) => s + (l.tipo === 'Crédito' ? Number(l.horas) : -Number(l.horas)), 0);
    const STATUS_COR = { Pendente: 'warn', Aprovada: 'ok', Recusada: 'off' };
    const hojeISO = iso(new Date());

    pageEl.innerHTML = subNavHtml() + `
      <div class="card" style="background:linear-gradient(135deg,var(--primary-dk),var(--primary));color:#fff;margin-bottom:18px;border:none">
        <div class="eyebrow" style="color:rgba(255,255,255,.75)">Seu saldo atual</div>
        <h2 style="color:#fff;font-size:28px;margin:8px 0 0">${saldo >= 0 ? '+' : ''}${saldo.toFixed(1)}h</h2>
      </div>

      <div class="card" style="margin-bottom:18px">
        <h3 style="margin-bottom:12px">Lançar horas</h3>
        <div class="grid grid-2">
          <div class="field"><label>Tipo</label><select id="bh-tipo"><option>Crédito</option><option>Débito</option></select></div>
          <div class="field"><label>Quantidade (horas)</label><input type="number" id="bh-horas" min="0" step="0.5" placeholder="Ex: 4"></div>
          <div class="field"><label>Data</label><input type="date" id="bh-data" value="${hojeISO}"></div>
          <div class="field"><label>Escala (opcional)</label><select id="bh-aba"><option value="">—</option>${ABAS.filter(a => a.id !== 'todas').map(a => `<option value="${a.id}">${a.label}</option>`).join('')}</select></div>
        </div>
        <div class="field"><label>Observação (opcional)</label><input id="bh-obs" placeholder="Ex: hora extra do plantão de sábado"></div>
        <button class="btn btn-accent" id="bh-submit">Enviar solicitação</button>
      </div>

      <h3 style="font-size:15px;margin-bottom:12px">Meu histórico</h3>
      <div style="display:flex;flex-direction:column;gap:12px">
        ${(lancamentos || []).map(l => `
          <div class="card" data-id="${l.id}">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
              <div>
                <b>${l.tipo === 'Crédito' ? '➕' : '➖'} ${l.tipo} · ${Number(l.horas).toFixed(1)}h</b>
                <div style="font-size:12.5px;color:var(--muted)">${new Date(l.data + 'T00:00').toLocaleDateString('pt-BR')}${l.aba ? ' · ' + FASA.escapeHtml((ABAS.find(a => a.id === l.aba) || {}).label || l.aba) : ''}</div>
                ${l.observacao ? `<p style="font-size:13px;color:var(--ink-soft);margin:6px 0 0">${FASA.escapeHtml(l.observacao)}</p>` : ''}
              </div>
              <span class="badge ${STATUS_COR[l.status] || 'off'}">${FASA.escapeHtml(l.status)}</span>
            </div>
            ${l.status === 'Pendente' ? `<button class="btn btn-sm btn-ghost bh-cancelar" style="margin-top:10px">Cancelar solicitação</button>` : ''}
          </div>`).join('') || `<div class="card"><div class="empty">Nenhum lançamento ainda.</div></div>`}
      </div>`;

    bindSubNav();
    document.getElementById('bh-submit').addEventListener('click', async () => {
      const tipo = document.getElementById('bh-tipo').value;
      const horas = parseFloat(document.getElementById('bh-horas').value);
      const data = document.getElementById('bh-data').value;
      const aba = document.getElementById('bh-aba').value || null;
      const observacao = document.getElementById('bh-obs').value.trim();
      if (!horas || horas <= 0) { FASA.toast('Informe a quantidade de horas.'); return; }
      if (!data) { FASA.toast('Selecione uma data.'); return; }
      const { error: insError } = await sb.from('banco_horas').insert({ usuario_id: user.id, tipo, horas, data, aba, observacao, status: 'Pendente' });
      if (insError) { FASA.toast('Erro ao enviar: ' + insError.message); return; }
      FASA.toast('Solicitação enviada! Aguarde a aprovação da liderança.');
      paintBancoHoras();
    });
    pageEl.querySelectorAll('.bh-cancelar').forEach(btn => btn.addEventListener('click', async () => {
      const id = btn.closest('.card[data-id]').dataset.id;
      const { error: delError } = await sb.from('banco_horas').delete().eq('id', id);
      if (delError) { FASA.toast('Erro ao cancelar: ' + delError.message); return; }
      paintBancoHoras();
    }));
  }

  function renderSub() {
    if (subview === 'negociacoes') paintNegociacoes();
    else if (subview === 'banco') paintBancoHoras();
    else paintCalendario();
  }
  renderSub();
}

/* ---------------- Biblioteca ---------------- */
function renderBiblioteca() {
  const { user, pageEl } = renderShell('biblioteca', 'Biblioteca');
  const cats = ['Todos', 'POPs', 'Protocolos', 'Manuais', 'Vídeos', 'PDF', 'Fotos'];
  let activeCat = 'Todos';
  const ICONS = { PDF: '📄', 'Vídeo': '🎬', Foto: '🖼️' };
  let todosDocs = [];

  async function carregar() {
    const { data, error } = await sb.from('biblioteca').select('*').order('atualizado_em', { ascending: false });
    if (error) { FASA.toast('Erro ao carregar biblioteca: ' + error.message); return; }
    todosDocs = data || [];
    paint();
  }

  async function enviarArquivo(file, categoriaPadrao) {
    if (!file) return;
    FASA.toast('Enviando...');
    const path = `${user.id}/${Date.now()}-${file.name}`;
    const { error: upError } = await sb.storage.from('biblioteca-arquivos').upload(path, file);
    if (upError) { FASA.toast('Erro ao enviar: ' + upError.message); return; }
    const { data: pub } = sb.storage.from('biblioteca-arquivos').getPublicUrl(path);
    const tipo = file.type.startsWith('image/') ? 'Foto' : (file.type === 'application/pdf' ? 'PDF' : 'Documento');
    const { error: insError } = await sb.from('biblioteca').insert({
      nome: file.name, categoria: categoriaPadrao, tipo, arquivo_url: pub.publicUrl, enviado_por: user.id,
    });
    if (insError) { FASA.toast('Erro ao salvar: ' + insError.message); return; }
    FASA.toast('Documento enviado!');
    carregar();
  }

  function paint() {
    const docs = todosDocs.filter(d => activeCat === 'Todos' || d.categoria === activeCat || d.tipo === activeCat);
    pageEl.innerHTML = `
      <div class="card" style="margin-bottom:18px">
        <h3 style="margin-bottom:12px">Compartilhar documento ou foto</h3>
        <div class="grid grid-2" style="margin-bottom:12px">
          <div class="field"><label>Categoria</label><select id="bib-categoria"><option>POPs</option><option>Protocolos</option><option>Manuais</option><option>Vídeos</option></select></div>
        </div>
        <div class="composer-tools">
          <button class="tool-btn" id="bib-doc-btn">📎 Anexar documento</button>
          <button class="tool-btn" id="bib-foto-btn">📷 Tirar/enviar foto</button>
        </div>
        <input type="file" id="bib-doc-input" style="display:none">
        <input type="file" id="bib-foto-input" accept="image/*" capture="environment" style="display:none">
      </div>
      <div class="tabs">${cats.map(c => `<div class="tab ${c === activeCat ? 'active' : ''}" data-cat="${c}">${c}</div>`).join('')}</div>
      <div class="grid grid-2">${docs.map(d => `
        <div class="card doc-card"><div class="doc-ic">${ICONS[d.tipo] || '📁'}</div>
        <div style="flex:1"><h3>${FASA.escapeHtml(d.nome)}</h3><div class="meta">${FASA.escapeHtml(d.categoria)} · ${FASA.escapeHtml(d.tipo)} · atualizado ${FASA.timeAgo(new Date(d.atualizado_em).getTime())}</div></div>
        <button class="btn btn-ghost btn-sm abrir-doc" data-url="${d.arquivo_url || ''}">Abrir</button></div>`).join('') || `<div class="empty" style="grid-column:1/-1">Nenhum documento nesta categoria.</div>`}</div>`;

    pageEl.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { activeCat = t.dataset.cat; paint(); }));
    pageEl.querySelectorAll('.abrir-doc').forEach(b => b.addEventListener('click', () => {
      if (b.dataset.url) window.open(b.dataset.url, '_blank'); else FASA.toast('Este documento ainda não tem arquivo anexado.');
    }));

    const docInput = document.getElementById('bib-doc-input');
    const fotoInput = document.getElementById('bib-foto-input');
    document.getElementById('bib-doc-btn').addEventListener('click', () => docInput.click());
    document.getElementById('bib-foto-btn').addEventListener('click', () => fotoInput.click());
    docInput.addEventListener('change', () => enviarArquivo(docInput.files[0], document.getElementById('bib-categoria').value));
    fotoInput.addEventListener('change', () => enviarArquivo(fotoInput.files[0], 'Fotos'));
  }
  pageEl.innerHTML = `<div class="empty">Carregando biblioteca...</div>`;
  carregar();
}

/* ---------------- Enquetes ---------------- */
function renderEnquetes() {
  const { user, pageEl } = renderShell('enquetes', 'Enquetes');
  let numOpcoes = 2;

  function formHtml() {
    if (!user.admin) return '';
    let campos = '';
    for (let i = 0; i < numOpcoes; i++) {
      campos += `<div class="field"><input class="eq-opcao" placeholder="Opção ${i + 1}"></div>`;
    }
    return `<div class="card" style="margin-bottom:20px">
      <h3 style="margin-bottom:12px">Criar enquete</h3>
      <div class="field"><input id="eq-pergunta" placeholder="Qual é a pergunta?"></div>
      <div id="eq-opcoes-wrap">${campos}</div>
      <div style="display:flex;gap:10px;margin-bottom:14px">
        <button class="btn btn-ghost btn-sm" id="eq-add-opcao" type="button">+ Adicionar opção</button>
      </div>
      <button class="btn btn-accent" id="eq-submit">Criar enquete</button>
    </div>`;
  }

  function bindForm() {
    if (!user.admin) return;
    document.getElementById('eq-add-opcao').addEventListener('click', () => {
      if (numOpcoes >= 10) { FASA.toast('Máximo de 10 opções.'); return; }
      numOpcoes++;
      document.getElementById('eq-opcoes-wrap').innerHTML = Array.from({ length: numOpcoes }).map((_, i) => `<div class="field"><input class="eq-opcao" placeholder="Opção ${i + 1}"></div>`).join('');
    });
    document.getElementById('eq-submit').addEventListener('click', async () => {
      const pergunta = document.getElementById('eq-pergunta').value.trim();
      const opcoes = [...pageEl.querySelectorAll('.eq-opcao')].map(i => i.value.trim()).filter(Boolean);
      if (!pergunta || opcoes.length < 2) { FASA.toast('Escreva a pergunta e pelo menos 2 opções.'); return; }
      const { data: enq, error: e1 } = await sb.from('enquetes').insert({ pergunta }).select().single();
      if (e1) { FASA.toast('Erro ao criar enquete: ' + e1.message); return; }
      const { error: e2 } = await sb.from('enquete_opcoes').insert(opcoes.map(texto => ({ enquete_id: enq.id, texto })));
      if (e2) { FASA.toast('Erro ao criar opções: ' + e2.message); return; }
      FASA.toast('Enquete criada!');
      numOpcoes = 2;
      paint();
    });
  }

  async function paint() {
    pageEl.innerHTML = `<div class="empty">Carregando enquetes...</div>`;
    const { data: enquetes, error: e1 } = await sb.from('enquetes').select('*, enquete_opcoes(*)').order('criado_em', { ascending: false });
    const { data: meusVotos, error: e2 } = await sb.from('enquete_votos').select('enquete_id, opcao_id').eq('usuario_id', user.id);
    if (e1 || e2) { FASA.toast('Erro ao carregar enquetes'); return; }
    const votosMap = {};
    (meusVotos || []).forEach(v => { votosMap[v.enquete_id] = v.opcao_id; });

    pageEl.innerHTML = `${formHtml()}<div class="grid grid-2">${(enquetes || []).map(e => {
      const opcoes = e.enquete_opcoes || [];
      const total = opcoes.reduce((s, o) => s + o.votos, 0) || 1;
      const voted = !!votosMap[e.id];
      return `<div class="card" data-id="${e.id}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px">
          <h3 style="font-size:15px">${FASA.escapeHtml(e.pergunta)}</h3>
          ${user.admin ? '<button class="icon-btn del-enquete-btn" title="Excluir enquete">🗑</button>' : ''}
        </div>
        <div style="font-size:11.5px;color:var(--muted);margin-bottom:12px">${FASA.timeAgo(new Date(e.criado_em).getTime())}</div>
        ${opcoes.map(o => { const pct = Math.round((o.votos / total) * 100); return `<div class="poll-opt ${voted ? 'voted' : ''}" data-opcao="${o.id}">${voted ? `<div class="fill" style="width:${pct}%"></div>` : ''}<div class="txt"><span>${FASA.escapeHtml(o.texto)}</span><span>${voted ? pct + '%' : ''}</span></div></div>`; }).join('')}
        <div style="font-size:11.5px;color:var(--muted);margin-top:8px">${total} voto(s) ${voted ? '· você já votou' : '· toque em uma opção para votar'}</div></div>`;
    }).join('') || `<div class="empty">Nenhuma enquete no momento.${user.admin ? '' : ' Peça pra liderança criar uma!'}</div>`}</div>`;

    bindForm();
    pageEl.querySelectorAll('.del-enquete-btn').forEach(btn => btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('Excluir esta enquete? Os votos também serão apagados.')) return;
      const card = btn.closest('.card[data-id]');
      const { error: delError } = await sb.from('enquetes').delete().eq('id', card.dataset.id);
      if (delError) { FASA.toast('Erro ao excluir: ' + delError.message); return; }
      FASA.toast('Enquete excluída.');
      paint();
    }));
    pageEl.querySelectorAll('.card[data-id]').forEach(card => {
      const eid = card.dataset.id;
      card.querySelectorAll('.poll-opt').forEach(opt => opt.addEventListener('click', async () => {
        if (votosMap[eid]) return;
        const opcaoId = opt.dataset.opcao;
        const { error: voteError } = await sb.from('enquete_votos').insert({ enquete_id: eid, usuario_id: user.id, opcao_id: opcaoId });
        if (voteError) { FASA.toast('Erro ao votar: ' + voteError.message); return; }
        const { data: opcaoAtual } = await sb.from('enquete_opcoes').select('votos').eq('id', opcaoId).single();
        await sb.from('enquete_opcoes').update({ votos: (opcaoAtual?.votos || 0) + 1 }).eq('id', opcaoId);
        paint();
      }));
    });
  }
  paint();
}

/* ---------------- Sugestões ---------------- */
function renderSugestoes() {
  const { user, pageEl } = renderShell('sugestoes', 'Sugestões');

  async function paint() {
    pageEl.innerHTML = `<div class="empty">Carregando sugestões...</div>`;
    const { data: sugs, error } = await sb
      .from('sugestoes')
      .select('*, usuarios!sugestoes_autor_id_fkey(nome), sugestao_apoios(usuario_id)')
      .order('criado_em', { ascending: false });
    if (error) { FASA.toast('Erro ao carregar sugestões: ' + error.message); }
    const lista = (sugs || []).sort((a, b) => (b.sugestao_apoios || []).length - (a.sugestao_apoios || []).length);

    pageEl.innerHTML = `
      <div class="card" style="margin-bottom:20px"><h3 style="margin-bottom:12px">Compartilhe uma ideia</h3>
        <div class="field"><textarea id="sug-texto" rows="3" style="width:100%;padding:12px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit" placeholder="O que podemos melhorar?"></textarea></div>
        <button class="btn btn-accent" id="sug-submit">Enviar sugestão</button></div>
      <div style="display:flex;flex-direction:column;gap:14px">${lista.map(s => {
        const au = s.usuarios || { nome: 'Colaborador' };
        const apoios = s.sugestao_apoios || [];
        const apoiado = apoios.some(a => a.usuario_id === user.id);
        const souAutor = s.autor_id === user.id;
        return `<div class="card" data-id="${s.id}"><div class="post-head"><div class="avatar sm">${FASA.initials(au.nome)}</div><div class="meta" style="flex:1"><div class="name">${FASA.escapeHtml(au.nome)}</div><div class="sub">${FASA.timeAgo(new Date(s.criado_em).getTime())}</div></div>${(souAutor || user.admin) ? '<button class="icon-btn del-sug-btn" title="Excluir sugestão">🗑</button>' : ''}</div>
        <p style="font-size:13.5px;color:var(--ink-soft);margin:10px 0">${FASA.escapeHtml(s.texto)}</p>
        <button class="btn btn-sm ${apoiado ? 'btn-primary' : 'btn-ghost'} apoiar-btn">👍 Apoiar (${apoios.length})</button></div>`;
      }).join('') || `<div class="empty">Nenhuma sugestão ainda. Seja o primeiro!</div>`}</div>`;

    document.getElementById('sug-submit').addEventListener('click', async () => {
      const texto = document.getElementById('sug-texto').value.trim();
      if (!texto) return;
      const { error: insError } = await sb.from('sugestoes').insert({ autor_id: user.id, texto });
      if (insError) { FASA.toast('Erro ao enviar: ' + insError.message); return; }
      FASA.toast('Sugestão enviada!'); paint();
    });
    pageEl.querySelectorAll('.del-sug-btn').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('Excluir esta sugestão?')) return;
      const card = b.closest('.card[data-id]');
      const { error: delError } = await sb.from('sugestoes').delete().eq('id', card.dataset.id);
      if (delError) { FASA.toast('Erro ao excluir: ' + delError.message); return; }
      paint();
    }));
    pageEl.querySelectorAll('.card[data-id]').forEach(card => {
      card.querySelector('.apoiar-btn').addEventListener('click', async () => {
        const id = card.dataset.id;
        const apoiado = card.querySelector('.apoiar-btn').classList.contains('btn-primary');
        if (apoiado) {
          await sb.from('sugestao_apoios').delete().eq('sugestao_id', id).eq('usuario_id', user.id);
        } else {
          await sb.from('sugestao_apoios').insert({ sugestao_id: id, usuario_id: user.id });
        }
        paint();
      });
    });
  }
  paint();
}

async function renderChat() {
