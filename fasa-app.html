  pageEl.classList.add('wide');
  pageEl.innerHTML = `<div class="empty">Carregando conversas...</div>`;
  const EMOJIS = ['😀','😁','😂','🤣','😊','😇','🙂','😉','😍','🥰','😘','😋','😜','🤔','😐','😴','😪','😢','😭','😱','😡','🤬','🥳','😎','🤩','😷','🤒','🙏','👍','👎','👏','🙌','🤝','💪','👋','✌️','🤞','❤️','🧡','💚','💙','💜','🖤','🔥','✨','🎉','🎂','👏','🙏','✅','❌','❗','❓','💡','📌','📎','⏰','😴','🤯'];

  let outros = [];
  let grupos = [];
  let allMsgs = [];
  let activeType = null, activeId = null;
  let search = '';

  async function carregarBase() {
    const { data: usuarios } = await sb.from('usuarios').select('*').neq('id', user.id).order('nome');
    outros = usuarios || [];

    const { data: minhasGm } = await sb.from('grupo_membros').select('grupo_id').eq('usuario_id', user.id);
    const grupoIds = (minhasGm || []).map(g => g.grupo_id);
    if (grupoIds.length) {
      const { data: gs } = await sb.from('grupos').select('*').in('id', grupoIds);
      grupos = gs || [];
    } else {
      grupos = [];
    }

    if (!activeId) {
      if (grupos[0]) { activeType = 'group'; activeId = grupos[0].id; }
      else if (outros[0]) { activeType = 'user'; activeId = outros[0].id; }
    }
  }

  async function carregarMensagens() {
    const orFiltro = `remetente_id.eq.${user.id},destinatario_id.eq.${user.id}`;
    const { data: dms } = await sb.from('mensagens').select('*').is('grupo_id', null).or(orFiltro).order('criado_em', { ascending: true });
    let gms = [];
    if (grupos.length) {
      const ids = grupos.map(g => g.id);
      const { data } = await sb.from('mensagens').select('*').in('grupo_id', ids).order('criado_em', { ascending: true });
      gms = data || [];
    }
    allMsgs = [...(dms || []), ...gms];
  }

  function userById(id) { return id === user.id ? user : outros.find(u => u.id === id); }

  function convList() {
    const userConvs = outros.filter(u => u.nome.toLowerCase().includes(search.toLowerCase())).map(u => {
      const msgs = allMsgs.filter(m => !m.grupo_id && ((m.remetente_id === user.id && m.destinatario_id === u.id) || (m.remetente_id === u.id && m.destinatario_id === user.id)));
      const last = msgs[msgs.length - 1];
      return { type: 'user', id: u.id, nome: u.nome, pessoa: u, lastMsg: last ? last.texto : 'Diga olá 👋' };
    });
    const groupConvs = grupos.filter(g => g.nome.toLowerCase().includes(search.toLowerCase())).map(g => {
      const msgs = allMsgs.filter(m => m.grupo_id === g.id);
      const last = msgs[msgs.length - 1];
      return { type: 'group', id: g.id, nome: g.nome, lastMsg: last ? last.texto : 'Grupo criado' };
    });
    return [...groupConvs, ...userConvs];
  }

  function paintList() {
    const list = convList();
    pageEl.querySelector('#chat-list-inner').innerHTML = list.map(c => `
      <div class="chat-conv ${c.type === activeType && c.id === activeId ? 'active' : ''}" data-type="${c.type}" data-id="${c.id}">
        ${c.type === 'group' ? '<div class="avatar sm" style="background:var(--accent)">👥</div>' : FASA.avatarHtml(c.pessoa, 'sm')}
        <div class="t"><div class="n">${FASA.escapeHtml(c.nome)}</div><div class="m">${FASA.escapeHtml(c.lastMsg)}</div></div></div>`).join('') || `<div class="empty" style="padding:20px 10px">Nenhuma conversa encontrada.</div>`;
    pageEl.querySelectorAll('.chat-conv').forEach(el => el.addEventListener('click', () => { activeType = el.dataset.type; activeId = el.dataset.id; paintList(); paintMain(); }));
  }

  function paintMain() {
    const mainWrap = pageEl.querySelector('#chat-main-wrap');
    if (!activeId) { mainWrap.innerHTML = `<div class="empty" style="margin:auto">Nenhuma conversa ainda. Escreva pra alguém da equipe!</div>`; return; }
    const isGroup = activeType === 'group';
    const info = isGroup ? grupos.find(g => g.id === activeId) : outros.find(u => u.id === activeId);
    if (!info) { mainWrap.innerHTML = `<div class="empty" style="margin:auto">Conversa não encontrada.</div>`; return; }
    const nome = FASA.escapeHtml(info.nome);
    const sub = isGroup ? 'Grupo' : `${FASA.escapeHtml(info.cargo || '')} · ${FASA.escapeHtml(info.setor || '')}`;
    const msgs = isGroup
      ? allMsgs.filter(m => m.grupo_id === activeId)
      : allMsgs.filter(m => !m.grupo_id && ((m.remetente_id === user.id && m.destinatario_id === activeId) || (m.remetente_id === activeId && m.destinatario_id === user.id)));

    mainWrap.innerHTML = `
      <div class="chat-head">${isGroup ? '<div class="avatar sm" style="background:var(--accent)">👥</div>' : FASA.avatarHtml(info, 'sm')}
        <div><div style="font-weight:700;font-size:14px">${nome}</div><div style="font-size:11.5px;color:var(--muted)">${sub}</div></div></div>
      <div class="chat-msgs" id="chat-msgs">${msgs.map(m => `
        <div class="msg ${m.remetente_id === user.id ? 'out' : 'in'}" data-id="${m.id}">${isGroup && m.remetente_id !== user.id ? `<b style="display:block;font-size:11px;opacity:.8">${FASA.escapeHtml((userById(m.remetente_id) || {}).nome || '')}</b>` : ''}${FASA.escapeHtml(m.texto)}<span class="time">${new Date(m.criado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</span>${m.remetente_id === user.id ? `<button class="msg-del-btn" data-id="${m.id}" title="Excluir mensagem" style="background:none;border:none;color:inherit;opacity:.7;font-size:11px;cursor:pointer;margin-left:8px">✕</button>` : ''}</div>`).join('') || `<div class="empty" style="margin:auto">Nenhuma mensagem ainda. Diga olá!</div>`}</div>
      <div style="position:relative">
        <div id="emoji-pop" style="display:none;position:absolute;bottom:64px;left:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:var(--shadow-lg);gap:4px;flex-wrap:wrap;width:260px;max-height:220px;overflow-y:auto">
          ${EMOJIS.map(e => `<span style="cursor:pointer;font-size:18px;padding:4px" class="emoji-choice">${e}</span>`).join('')}
        </div>
        <div class="chat-input">
          <button class="icon-btn" id="emoji-btn" title="Emoji">😊</button>
          <input type="text" id="chat-text-input" placeholder="Escreva uma mensagem...">
          <button class="btn btn-primary btn-sm" id="chat-send-btn">Enviar</button>
        </div>
      </div>`;

    const msgsWrap = document.getElementById('chat-msgs');
    msgsWrap.scrollTop = msgsWrap.scrollHeight;
    msgsWrap.addEventListener('click', async (e) => {
      const btn = e.target.closest('.msg-del-btn');
      if (!btn) return;
      if (!confirm('Excluir esta mensagem?')) return;
      const { error: delError } = await sb.from('mensagens').delete().eq('id', btn.dataset.id);
      if (delError) { FASA.toast('Erro ao excluir: ' + delError.message); return; }
      await carregarMensagens();
      renderMessagesOnly();
      paintList();
    });
    const input = document.getElementById('chat-text-input');

    async function send(texto) {
      texto = texto.trim();
      if (!texto) return;
      const payload = isGroup ? { remetente_id: user.id, grupo_id: activeId, texto } : { remetente_id: user.id, destinatario_id: activeId, texto };
      const { error } = await sb.from('mensagens').insert(payload);
      if (error) { FASA.toast('Erro ao enviar: ' + error.message); return; }
      input.value = '';
      await carregarMensagens();
      renderMessagesOnly();
      paintList();
    }
    document.getElementById('chat-send-btn').addEventListener('click', () => send(input.value));
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(input.value); });
    const emojiBtn = document.getElementById('emoji-btn'), emojiPop = document.getElementById('emoji-pop');
    emojiBtn.addEventListener('click', () => { emojiPop.style.display = emojiPop.style.display === 'none' ? 'flex' : 'none'; });
    emojiPop.querySelectorAll('.emoji-choice').forEach(e => e.addEventListener('click', () => { input.value += e.textContent; emojiPop.style.display = 'none'; input.focus(); }));
  }

  // Atualiza só a lista de mensagens (sem recriar o input/emoji), pra não
  // fechar o seletor de emoji nem apagar o que a pessoa está digitando
  // quando a conversa atualiza sozinha em segundo plano.
  function renderMessagesOnly() {
    const msgsWrap = document.getElementById('chat-msgs');
    if (!msgsWrap || !activeId) return;
    const isGroup = activeType === 'group';
    const info = isGroup ? grupos.find(g => g.id === activeId) : outros.find(u => u.id === activeId);
    if (!info) return;
    const msgs = isGroup
      ? allMsgs.filter(m => m.grupo_id === activeId)
      : allMsgs.filter(m => !m.grupo_id && ((m.remetente_id === user.id && m.destinatario_id === activeId) || (m.remetente_id === activeId && m.destinatario_id === user.id)));
    const pertoDoFim = msgsWrap.scrollTop + msgsWrap.clientHeight >= msgsWrap.scrollHeight - 40;
    msgsWrap.innerHTML = msgs.map(m => `
      <div class="msg ${m.remetente_id === user.id ? 'out' : 'in'}" data-id="${m.id}">${isGroup && m.remetente_id !== user.id ? `<b style="display:block;font-size:11px;opacity:.8">${FASA.escapeHtml((userById(m.remetente_id) || {}).nome || '')}</b>` : ''}${FASA.escapeHtml(m.texto)}<span class="time">${new Date(m.criado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</span>${m.remetente_id === user.id ? `<button class="msg-del-btn" data-id="${m.id}" title="Excluir mensagem" style="background:none;border:none;color:inherit;opacity:.7;font-size:11px;cursor:pointer;margin-left:8px">✕</button>` : ''}</div>`).join('') || `<div class="empty" style="margin:auto">Nenhuma mensagem ainda. Diga olá!</div>`;
    if (pertoDoFim) msgsWrap.scrollTop = msgsWrap.scrollHeight;
  }

  await carregarBase();
  await carregarMensagens();

  pageEl.innerHTML = `<div class="chat-shell card" style="padding:0;overflow:hidden">
    <div class="chat-list"><div class="chat-search field"><input id="chat-search-input" placeholder="🔍 Pesquisar conversa..."></div><div id="chat-list-inner"></div></div>
    <div class="chat-main" id="chat-main-wrap"></div></div>`;
  document.getElementById('chat-search-input').addEventListener('input', (e) => { search = e.target.value; paintList(); });
  paintList(); paintMain();

  if (_chatPollInterval) clearInterval(_chatPollInterval);
  _chatPollInterval = setInterval(async () => {
    await carregarMensagens();
    renderMessagesOnly();
    paintList();
  }, 4000);
}

/* ---------------- Admin ---------------- */
function renderAdmin() {
  const { user, pageEl } = renderShell('admin', 'Administração');
  if (!user.admin) { pageEl.innerHTML = `<div class="empty"><div class="big">🔒</div>Esta área é restrita à liderança.</div>`; return; }

  let tab = 'painel';
  const TABS = [{ id: 'painel', label: 'Painel' }, { id: 'usuarios', label: 'Usuários' }, { id: 'escalas', label: 'Escalas' }, { id: 'ausencias', label: 'Ausências' }, { id: 'banco', label: 'Banco de Horas' }, { id: 'avisos', label: 'Avisos' }, { id: 'comunidades', label: 'Comunidades' }, { id: 'documentos', label: 'Documentos' }];
  function shellHtml(inner) { return `<div class="tabs">${TABS.map(t => `<div class="tab ${t.id === tab ? 'active' : ''}" data-tab="${t.id}">${t.label}</div>`).join('')}</div>${inner}`; }
  function bindTabs() { pageEl.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { tab = t.dataset.tab; render(); })); }

  async function paintPainel() {
    pageEl.innerHTML = shellHtml(`<div class="empty">Carregando painel...</div>`);
    const [{ count: totalUsuarios }, { data: postsRecentes }, { count: totalDocs }, { count: totalAvisos }] = await Promise.all([
      sb.from('usuarios').select('*', { count: 'exact', head: true }),
      sb.from('posts').select('*, usuarios!posts_autor_id_fkey(nome)').order('criado_em', { ascending: false }).limit(5),
      sb.from('biblioteca').select('*', { count: 'exact', head: true }),
      sb.from('avisos').select('*', { count: 'exact', head: true }),
    ]);
    const { count: posts24h } = await sb.from('posts').select('*', { count: 'exact', head: true }).gt('criado_em', new Date(Date.now() - 86400e3).toISOString());

    const stats = [
      { n: totalUsuarios || 0, l: 'Usuários cadastrados' },
      { n: posts24h || 0, l: 'Posts nas últimas 24h' },
      { n: totalDocs || 0, l: 'Documentos na Biblioteca' },
      { n: totalAvisos || 0, l: 'Avisos publicados' },
    ];
    pageEl.innerHTML = shellHtml(`
      <div class="grid grid-4" style="margin-bottom:20px">${stats.map(s => `<div class="card stat-card"><div class="num">${s.n}</div><div class="lbl">${s.l}</div></div>`).join('')}</div>
      <div class="card"><h3 style="margin-bottom:14px">Atividade recente</h3>
        ${(postsRecentes || []).map(p => { const au = p.usuarios || { nome: 'Colaborador' }; return `<div style="padding:8px 0;border-bottom:1px solid var(--line);font-size:13px"><b>${FASA.escapeHtml(au.nome)}</b> publicou · <span style="color:var(--muted)">${FASA.timeAgo(new Date(p.criado_em).getTime())}</span></div>`; }).join('') || `<div class="empty">Nenhuma atividade ainda.</div>`}
      </div>`);
    bindTabs();
  }

  async function paintUsuarios() {
    pageEl.innerHTML = shellHtml(`<div class="empty">Carregando usuários...</div>`);
    const { data: usuarios, error } = await sb.from('usuarios').select('*').order('nome');
    if (error) { FASA.toast('Erro ao carregar usuários: ' + error.message); }

    pageEl.innerHTML = shellHtml(`
      <div class="card" style="margin-bottom:18px;color:var(--muted);font-size:13px">
        Pra adicionar alguém novo, convide pelo <b>Supabase → Authentication → Users → Invite user</b>.
        O perfil aparece aqui automaticamente — é só editar matrícula, cargo e setor.
      </div>
      <div class="card table-wrap"><table><thead><tr><th>Nome</th><th>Matrícula</th><th>Cargo</th><th>Setor</th><th>Perfil</th><th></th></tr></thead><tbody>
        ${(usuarios || []).map(u => `<tr data-id="${u.id}">
          <td><input class="ed-nome" value="${FASA.escapeHtml(u.nome || '')}" style="border:none;background:none;width:100px;font:inherit"></td>
          <td><input class="ed-matricula" value="${FASA.escapeHtml(u.matricula || '')}" style="border:none;background:none;width:80px;font:inherit"></td>
          <td><input class="ed-cargo" value="${FASA.escapeHtml(u.cargo || '')}" style="border:none;background:none;width:110px;font:inherit"></td>
          <td><input class="ed-setor" value="${FASA.escapeHtml(u.setor || '')}" style="border:none;background:none;width:100px;font:inherit"></td>
          <td><label class="checkline"><input type="checkbox" class="ed-admin" ${u.admin ? 'checked' : ''}> <span class="badge ${u.admin ? 'ok' : 'off'}">${u.admin ? 'Admin' : 'Colaborador'}</span></label></td>
          <td style="display:flex;gap:6px"><button class="icon-action salvar-user" title="Salvar">💾</button><button class="icon-action del-user" title="Excluir perfil">🗑</button></td>
        </tr>`).join('')}
      </tbody></table></div>`);
    bindTabs();

    pageEl.querySelectorAll('tr[data-id]').forEach(tr => {
      const id = tr.dataset.id;
      tr.querySelector('.salvar-user').addEventListener('click', async () => {
        const nome = tr.querySelector('.ed-nome').value.trim();
        const matricula = tr.querySelector('.ed-matricula').value.trim();
        const cargo = tr.querySelector('.ed-cargo').value.trim();
        const setor = tr.querySelector('.ed-setor').value.trim();
        const admin = tr.querySelector('.ed-admin').checked;
        const { error: updError } = await sb.from('usuarios').update({ nome, matricula, cargo, setor, admin }).eq('id', id);
        if (updError) { FASA.toast('Erro ao salvar: ' + updError.message); return; }
        FASA.toast('Usuário atualizado!');
        paintUsuarios();
      });
      tr.querySelector('.del-user').addEventListener('click', async () => {
        if (id === user.id) { FASA.toast('Você não pode excluir seu próprio perfil.'); return; }
        if (!confirm('Excluir o perfil deste usuário? Isso não remove o login dele, só os dados no FASA.')) return;
        const { error: delError } = await sb.from('usuarios').delete().eq('id', id);
        if (delError) { FASA.toast('Erro ao excluir: ' + delError.message); return; }
        paintUsuarios();
      });
    });
  }

  async function paintEscalas() {
    pageEl.innerHTML = shellHtml(`<div class="empty">Carregando escalas...</div>`);
    const ABAS = [
      { id: 'noturno-a', label: 'Noturno A' },
      { id: 'noturno-b', label: 'Noturno B' },
      { id: 'diurno', label: 'Diurno' },
      { id: 'diurno-a', label: 'Diurno A' },
      { id: 'diurno-b', label: 'Diurno B' },
      { id: 'plantao-diurno', label: 'Plantão Diurno (Manhã/Tarde)' },
    ];

    const { data: usuarios } = await sb.from('usuarios').select('id, nome').order('nome');
    const { data: rows, error } = await sb
      .from('escalas')
      .select('id, data, turno, aba, usuario_id, usuarios!escalas_usuario_id_fkey(nome)')
      .order('data');
    if (error) { FASA.toast('Erro ao carregar escalas: ' + error.message); }

    function turnoOptions(aba) {
      if (aba === 'plantao-noturno') return ['Plantão A', 'Plantão B'];
      if (aba === 'plantao-diurno') return ['Manhã', 'Tarde'];
      return null; // sem escolha — o turno é o próprio nome da aba
    }
    const hojeISO = new Date().toISOString().slice(0, 10);

    pageEl.innerHTML = shellHtml(`
      <div class="card" style="margin-bottom:18px">
        <h3 style="margin-bottom:12px">Adicionar à escala</h3>
        <div class="grid grid-3">
          <div class="field"><label>Escala</label><select id="es-aba">${ABAS.map(a => `<option value="${a.id}">${a.label}</option>`).join('')}</select></div>
          <div class="field" id="es-turno-wrap"><label>Turno / Plantão</label><select id="es-turno"></select></div>
          <div class="field"><label>Data</label><input type="date" id="es-data" value="${hojeISO}"></div>
          <div class="field"><label>Colaborador</label><select id="es-usuario">${(usuarios || []).map(u => `<option value="${u.id}">${FASA.escapeHtml(u.nome)}</option>`).join('')}</select></div>
        </div>
        <button class="btn btn-primary" id="es-submit">Adicionar</button>
      </div>
      <div class="tabs">${ABAS.map((a, i) => `<div class="tab ${i === 0 ? 'active' : ''}" data-aba-filtro="${a.id}">${a.label}</div>`).join('')}</div>
      <div class="card table-wrap" id="es-lista-wrap"></div>`);
    bindTabs();

    const abaSelect = document.getElementById('es-aba');
    const turnoWrap = document.getElementById('es-turno-wrap');
    const turnoSelect = document.getElementById('es-turno');
    function atualizarCampos() {
      const opcoes = turnoOptions(abaSelect.value);
      if (opcoes) { turnoWrap.style.display = ''; turnoSelect.innerHTML = opcoes.map(t => `<option>${t}</option>`).join(''); }
      else { turnoWrap.style.display = 'none'; }
    }
    abaSelect.addEventListener('change', atualizarCampos);
    atualizarCampos();

    let filtroAtivo = ABAS[0].id;
    function pintarLista() {
      const linhas = (rows || []).filter(r => r.aba === filtroAtivo);
      document.getElementById('es-lista-wrap').innerHTML = `
        <table><thead><tr><th>Data</th><th>Turno/Plantão</th><th>Colaborador</th><th></th></tr></thead><tbody>
          ${linhas.map(r => `<tr><td>${r.data ? new Date(r.data + 'T00:00').toLocaleDateString('pt-BR') : '—'}</td><td>${FASA.escapeHtml(r.turno)}</td><td>${FASA.escapeHtml((r.usuarios || {}).nome || '—')}</td><td><button class="icon-action del-escala" data-id="${r.id}">🗑</button></td></tr>`).join('') || `<tr><td colspan="4"><div class="empty">Nenhuma escala nesta aba.</div></td></tr>`}
        </tbody></table>`;
      document.querySelectorAll('.del-escala').forEach(btn => btn.addEventListener('click', async () => {
        const { error: delError } = await sb.from('escalas').delete().eq('id', btn.dataset.id);
        if (delError) { FASA.toast('Erro ao excluir: ' + delError.message); return; }
        paintEscalas();
      }));
    }
    pageEl.querySelectorAll('[data-aba-filtro]').forEach(t => t.addEventListener('click', () => {
      pageEl.querySelectorAll('[data-aba-filtro]').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      filtroAtivo = t.dataset.abaFiltro;
      pintarLista();
    }));
    pintarLista();

    const DIAS_SEMANA = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
    document.getElementById('es-submit').addEventListener('click', async () => {
      const aba = abaSelect.value;
      const opcoes = turnoOptions(aba);
      const turno = opcoes ? turnoSelect.value : ABAS.find(a => a.id === aba).label;
      const data = document.getElementById('es-data').value;
      const usuario_id = document.getElementById('es-usuario').value;
      if (!usuario_id) { FASA.toast('Selecione um colaborador.'); return; }
      if (!data) { FASA.toast('Selecione uma data.'); return; }
      const dia = DIAS_SEMANA[new Date(data + 'T00:00').getDay()];
      const { error: insError } = await sb.from('escalas').insert({ aba, turno, dia, data, usuario_id });
      if (insError) { FASA.toast('Erro ao adicionar: ' + insError.message); return; }
      FASA.toast('Adicionado à escala!');
      paintEscalas();
    });
  }

  async function paintAusencias() {
    pageEl.innerHTML = shellHtml(`<div class="empty">Carregando ausências...</div>`);
    const { data: usuarios } = await sb.from('usuarios').select('id, nome').order('nome');
    const { data: ausencias, error } = await sb
      .from('ausencias')
      .select('id, tipo, status, data_inicio, data_fim, observacao, usuarios!ausencias_usuario_id_fkey(nome)')
      .order('data_inicio', { ascending: false });
    if (error) { FASA.toast('Erro ao carregar ausências: ' + error.message); }
    const hojeISO = new Date().toISOString().slice(0, 10);
    const STATUS_COR = { Pendente: 'warn', Aprovada: 'ok', Recusada: 'off' };
    const pendentes = (ausencias || []).filter(a => a.status === 'Pendente');
    const resto = (ausencias || []).filter(a => a.status !== 'Pendente');

    pageEl.innerHTML = shellHtml(`
      <div class="card" style="margin-bottom:18px">
        <h3 style="margin-bottom:12px">Registrar ausência diretamente</h3>
        <div class="grid grid-2" style="margin-bottom:0">
          <div class="field"><label>Colaborador</label><select id="au-usuario">${(usuarios || []).map(u => `<option value="${u.id}">${FASA.escapeHtml(u.nome)}</option>`).join('')}</select></div>
          <div class="field"><label>Tipo</label><select id="au-tipo"><option>Folga</option><option>Férias</option><option>Afastamento</option><option>Descanso</option><option>Banco de Horas</option></select></div>
          <div class="field"><label>Data início</label><input type="date" id="au-inicio" value="${hojeISO}"></div>
          <div class="field"><label>Data fim</label><input type="date" id="au-fim" value="${hojeISO}"></div>
        </div>
        <div class="field"><label>Observação (opcional)</label><input id="au-obs" placeholder="Ex: atestado médico, viagem..."></div>
        <button class="btn btn-primary" id="au-submit">Registrar (já aprovado)</button>
      </div>
      ${pendentes.length ? `
      <div class="card" style="margin-bottom:18px">
        <h3 style="margin-bottom:12px">Solicitações pendentes de aprovação</h3>
        <div style="display:flex;flex-direction:column;gap:10px">
          ${pendentes.map(a => `<div class="card" data-id="${a.id}" style="box-shadow:none;border:1px solid var(--line)">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
              <div><b>${FASA.escapeHtml((a.usuarios || {}).nome || '—')}</b> · ${FASA.escapeHtml(a.tipo)}
                <div style="font-size:12.5px;color:var(--muted)">${new Date(a.data_inicio + 'T00:00').toLocaleDateString('pt-BR')} — ${new Date(a.data_fim + 'T00:00').toLocaleDateString('pt-BR')}</div>
                ${a.observacao ? `<p style="font-size:13px;color:var(--ink-soft);margin:6px 0 0">${FASA.escapeHtml(a.observacao)}</p>` : ''}
              </div>
              <span class="badge warn">Pendente</span>
            </div>
            <div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-sm btn-primary au-aprovar">Aprovar</button><button class="btn btn-sm btn-ghost au-recusar">Recusar</button></div>
          </div>`).join('')}
        </div>
      </div>` : ''}
      <div class="card table-wrap"><table><thead><tr><th>Colaborador</th><th>Tipo</th><th>Início</th><th>Fim</th><th>Status</th><th></th></tr></thead><tbody>
        ${resto.map(a => `<tr data-id="${a.id}"><td>${FASA.escapeHtml((a.usuarios || {}).nome || '—')}</td><td>${FASA.escapeHtml(a.tipo)}</td><td>${new Date(a.data_inicio + 'T00:00').toLocaleDateString('pt-BR')}</td><td>${new Date(a.data_fim + 'T00:00').toLocaleDateString('pt-BR')}</td><td><span class="badge ${STATUS_COR[a.status] || 'ok'}">${FASA.escapeHtml(a.status)}</span></td><td><button class="icon-action del-ausencia">🗑</button></td></tr>`).join('') || `<tr><td colspan="6"><div class="empty">Nenhuma ausência registrada.</div></td></tr>`}
      </tbody></table></div>`);
    bindTabs();

    pageEl.querySelectorAll('.au-aprovar').forEach(btn => btn.addEventListener('click', async () => {
      const id = btn.closest('.card[data-id]').dataset.id;
      const { error: updError } = await sb.from('ausencias').update({ status: 'Aprovada' }).eq('id', id);
      if (updError) { FASA.toast('Erro: ' + updError.message); return; }
      FASA.toast('Ausência aprovada!');
      paintAusencias();
    }));
    pageEl.querySelectorAll('.au-recusar').forEach(btn => btn.addEventListener('click', async () => {
      const id = btn.closest('.card[data-id]').dataset.id;
      const { error: updError } = await sb.from('ausencias').update({ status: 'Recusada' }).eq('id', id);
      if (updError) { FASA.toast('Erro: ' + updError.message); return; }
      FASA.toast('Solicitação recusada.');
      paintAusencias();
    }));

    document.getElementById('au-submit').addEventListener('click', async () => {
      const usuario_id = document.getElementById('au-usuario').value;
      const tipo = document.getElementById('au-tipo').value;
      const data_inicio = document.getElementById('au-inicio').value;
      const data_fim = document.getElementById('au-fim').value;
      const observacao = document.getElementById('au-obs').value.trim();
      if (!usuario_id || !data_inicio || !data_fim) { FASA.toast('Preencha colaborador e as datas.'); return; }
      if (data_fim < data_inicio) { FASA.toast('A data de fim não pode ser antes da data de início.'); return; }
      const { error: insError } = await sb.from('ausencias').insert({ usuario_id, tipo, data_inicio, data_fim, observacao, status: 'Aprovada' });
      if (insError) { FASA.toast('Erro ao registrar: ' + insError.message); return; }
      FASA.toast('Ausência registrada!');
      paintAusencias();
    });
    pageEl.querySelectorAll('.del-ausencia').forEach(btn => btn.addEventListener('click', async (e) => {
      const id = e.target.closest('tr').dataset.id;
      const { error: delError } = await sb.from('ausencias').delete().eq('id', id);
      if (delError) { FASA.toast('Erro ao excluir: ' + delError.message); return; }
      paintAusencias();
    }));
  }

  async function paintBancoHorasAdmin() {
    pageEl.innerHTML = shellHtml(`<div class="empty">Carregando banco de horas...</div>`);
    const { data: usuarios } = await sb.from('usuarios').select('id, nome').order('nome');
    const { data: lancamentos, error } = await sb
      .from('banco_horas')
      .select('id, tipo, horas, data, aba, observacao, status, usuarios!banco_horas_usuario_id_fkey(nome)')
      .order('data', { ascending: false });
    if (error) { FASA.toast('Erro ao carregar banco de horas: ' + error.message); }
    const hojeISO = new Date().toISOString().slice(0, 10);
    const STATUS_COR = { Pendente: 'warn', Aprovada: 'ok', Recusada: 'off' };
    const pendentes = (lancamentos || []).filter(l => l.status === 'Pendente');
    const resto = (lancamentos || []).filter(l => l.status !== 'Pendente');

    pageEl.innerHTML = shellHtml(`
      <div class="card" style="margin-bottom:18px">
        <h3 style="margin-bottom:12px">Lançar horas diretamente</h3>
        <div class="grid grid-2">
          <div class="field"><label>Colaborador</label><select id="bh-usuario">${(usuarios || []).map(u => `<option value="${u.id}">${FASA.escapeHtml(u.nome)}</option>`).join('')}</select></div>
          <div class="field"><label>Tipo</label><select id="bh-tipo"><option>Crédito</option><option>Débito</option></select></div>
          <div class="field"><label>Horas</label><input type="number" id="bh-horas" min="0" step="0.5"></div>
          <div class="field"><label>Data</label><input type="date" id="bh-data" value="${hojeISO}"></div>
        </div>
        <div class="field"><label>Observação (opcional)</label><input id="bh-obs" placeholder="Ex: hora extra aprovada previamente"></div>
        <button class="btn btn-primary" id="bh-submit">Registrar (já aprovado)</button>
      </div>
      ${pendentes.length ? `
      <div class="card" style="margin-bottom:18px">
        <h3 style="margin-bottom:12px">Solicitações pendentes</h3>
        <div style="display:flex;flex-direction:column;gap:10px">
          ${pendentes.map(l => `<div class="card" data-id="${l.id}" style="box-shadow:none;border:1px solid var(--line)">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
              <div><b>${FASA.escapeHtml((l.usuarios || {}).nome || '—')}</b> · ${FASA.escapeHtml(l.tipo)} · ${Number(l.horas).toFixed(1)}h
                <div style="font-size:12.5px;color:var(--muted)">${new Date(l.data + 'T00:00').toLocaleDateString('pt-BR')}</div>
                ${l.observacao ? `<p style="font-size:13px;color:var(--ink-soft);margin:6px 0 0">${FASA.escapeHtml(l.observacao)}</p>` : ''}
              </div>
              <span class="badge warn">Pendente</span>
            </div>
            <div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-sm btn-primary bh-aprovar">Aprovar</button><button class="btn btn-sm btn-ghost bh-recusar">Recusar</button></div>
          </div>`).join('')}
        </div>
      </div>` : ''}
      <div class="card table-wrap"><table><thead><tr><th>Colaborador</th><th>Tipo</th><th>Horas</th><th>Data</th><th>Status</th><th></th></tr></thead><tbody>
        ${resto.map(l => `<tr data-id="${l.id}"><td>${FASA.escapeHtml((l.usuarios || {}).nome || '—')}</td><td>${FASA.escapeHtml(l.tipo)}</td><td>${Number(l.horas).toFixed(1)}h</td><td>${new Date(l.data + 'T00:00').toLocaleDateString('pt-BR')}</td><td><span class="badge ${STATUS_COR[l.status] || 'ok'}">${FASA.escapeHtml(l.status)}</span></td><td><button class="icon-action del-banco">🗑</button></td></tr>`).join('') || `<tr><td colspan="6"><div class="empty">Nenhum lançamento registrado.</div></td></tr>`}
      </tbody></table></div>`);
    bindTabs();

    pageEl.querySelectorAll('.bh-aprovar').forEach(btn => btn.addEventListener('click', async () => {
      const id = btn.closest('.card[data-id]').dataset.id;
      const { error: updError } = await sb.from('banco_horas').update({ status: 'Aprovada' }).eq('id', id);
      if (updError) { FASA.toast('Erro: ' + updError.message); return; }
      FASA.toast('Lançamento aprovado!');
      paintBancoHorasAdmin();
    }));
    pageEl.querySelectorAll('.bh-recusar').forEach(btn => btn.addEventListener('click', async () => {
      const id = btn.closest('.card[data-id]').dataset.id;
      const { error: updError } = await sb.from('banco_horas').update({ status: 'Recusada' }).eq('id', id);
      if (updError) { FASA.toast('Erro: ' + updError.message); return; }
      FASA.toast('Solicitação recusada.');
      paintBancoHorasAdmin();
    }));
    document.getElementById('bh-submit').addEventListener('click', async () => {
      const usuario_id = document.getElementById('bh-usuario').value;
      const tipo = document.getElementById('bh-tipo').value;
      const horas = parseFloat(document.getElementById('bh-horas').value);
      const data = document.getElementById('bh-data').value;
      const observacao = document.getElementById('bh-obs').value.trim();
      if (!usuario_id || !horas || horas <= 0 || !data) { FASA.toast('Preencha colaborador, horas e data.'); return; }
      const { error: insError } = await sb.from('banco_horas').insert({ usuario_id, tipo, horas, data, observacao, status: 'Aprovada' });
      if (insError) { FASA.toast('Erro ao registrar: ' + insError.message); return; }
      FASA.toast('Lançamento registrado!');
      paintBancoHorasAdmin();
    });
    pageEl.querySelectorAll('.del-banco').forEach(btn => btn.addEventListener('click', async (e) => {
      const id = e.target.closest('tr').dataset.id;
      const { error: delError } = await sb.from('banco_horas').delete().eq('id', id);
      if (delError) { FASA.toast('Erro ao excluir: ' + delError.message); return; }
      paintBancoHorasAdmin();
    }));
  }

  async function paintAvisos() {
    pageEl.innerHTML = shellHtml(`<div class="empty">Carregando avisos...</div>`);
    const { data: avisos, error } = await sb.from('avisos').select('*').order('criado_em', { ascending: false });
    if (error) { FASA.toast('Erro ao carregar avisos: ' + error.message); }

    pageEl.innerHTML = shellHtml(`
      <div class="card" style="margin-bottom:18px"><h3 style="margin-bottom:12px">Criar aviso</h3>
        <div class="field"><input id="aa-titulo" placeholder="Título"></div>
        <div class="field"><textarea id="aa-texto" rows="3" style="width:100%;padding:12px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit" placeholder="Texto do aviso"></textarea></div>
        <button class="btn btn-primary" id="aa-submit">Publicar</button></div>
      <div class="card">${(avisos || []).map(a => `<div class="aviso" style="margin-bottom:16px;display:flex;justify-content:space-between;gap:10px"><div><h3>${FASA.escapeHtml(a.titulo)}</h3><p>${FASA.escapeHtml(a.texto)}</p></div><button class="icon-action del-aviso" data-id="${a.id}">🗑</button></div>`).join('') || `<div class="empty">Nenhum aviso ainda.</div>`}</div>`);
    bindTabs();
    document.getElementById('aa-submit').addEventListener('click', async () => {
      const titulo = document.getElementById('aa-titulo').value.trim(), texto = document.getElementById('aa-texto').value.trim();
      if (!titulo || !texto) return;
      const { error: insError } = await sb.from('avisos').insert({ autor_id: user.id, titulo, texto });
      if (insError) { FASA.toast('Erro ao publicar: ' + insError.message); return; }
      FASA.toast('Aviso criado!'); paintAvisos();
    });
    pageEl.querySelectorAll('.del-aviso').forEach(btn => btn.addEventListener('click', async () => {
      const { error: delError } = await sb.from('avisos').delete().eq('id', btn.dataset.id);
      if (delError) { FASA.toast('Erro ao excluir: ' + delError.message); return; }
      paintAvisos();
    }));
  }

  async function paintComunidades() {
    pageEl.innerHTML = shellHtml(`<div class="empty">Carregando comunidades...</div>`);
    const { data: comunidades, error: e1 } = await sb.from('comunidades').select('*').order('nome');
    const { data: membros, error: e2 } = await sb.from('comunidade_membros').select('comunidade_id');
    if (e1 || e2) { FASA.toast('Erro ao carregar comunidades'); }
    const contagem = {};
    (membros || []).forEach(m => { contagem[m.comunidade_id] = (contagem[m.comunidade_id] || 0) + 1; });

    pageEl.innerHTML = shellHtml(`
      <div class="card"><h3 style="margin-bottom:12px">Comunidades ativas</h3>
        <p style="color:var(--muted);font-size:12.5px;margin-bottom:14px">Edite a descrição das comunidades exibidas para a equipe.</p>
        <div class="table-wrap"><table><thead><tr><th>Comunidade</th><th>Descrição</th><th>Membros</th><th></th></tr></thead><tbody>
          ${(comunidades || []).map(c => `<tr data-id="${c.id}"><td><b>${FASA.escapeHtml(c.nome)}</b></td><td><input class="ed-desc" value="${FASA.escapeHtml(c.descricao || '')}" style="border:none;background:none;width:100%;font:inherit"></td><td>${contagem[c.id] || 0}</td><td><button class="icon-action salvar-com" title="Salvar">💾</button></td></tr>`).join('')}
        </tbody></table></div></div>`);
    bindTabs();
    pageEl.querySelectorAll('tr[data-id]').forEach(tr => {
      tr.querySelector('.salvar-com').addEventListener('click', async () => {
        const descricao = tr.querySelector('.ed-desc').value.trim();
        const { error: updError } = await sb.from('comunidades').update({ descricao }).eq('id', tr.dataset.id);
        if (updError) { FASA.toast('Erro ao salvar: ' + updError.message); return; }
        FASA.toast('Comunidade atualizada!');
      });
    });
  }

  async function paintDocumentos() {
    pageEl.innerHTML = shellHtml(`<div class="empty">Carregando biblioteca...</div>`);
    const { data: docs, error } = await sb.from('biblioteca').select('*').order('atualizado_em', { ascending: false });
    if (error) { FASA.toast('Erro ao carregar biblioteca: ' + error.message); }

    pageEl.innerHTML = shellHtml(`
      <div class="card" style="margin-bottom:18px"><h3 style="margin-bottom:12px">Liberar novo documento</h3>
        <div class="grid grid-3">
          <div class="field"><input id="nd-nome" placeholder="Nome do documento (opcional se anexar arquivo)"></div>
          <div class="field"><select id="nd-categoria"><option>POPs</option><option>Protocolos</option><option>Manuais</option><option>Vídeos</option></select></div>
          <div class="field"><select id="nd-tipo"><option>PDF</option><option>Vídeo</option></select></div>
        </div>
        <div class="field"><label>Anexar arquivo (opcional)</label><input type="file" id="nd-arquivo"></div>
        <button class="btn btn-primary" id="nd-submit">Adicionar à Biblioteca</button></div>
      <div class="card table-wrap"><table><thead><tr><th>Nome</th><th>Categoria</th><th>Tipo</th><th></th></tr></thead><tbody>
        ${(docs || []).map(doc => `<tr data-id="${doc.id}"><td>${FASA.escapeHtml(doc.nome)}${doc.arquivo_url ? ' 📎' : ''}</td><td>${FASA.escapeHtml(doc.categoria)}</td><td>${FASA.escapeHtml(doc.tipo)}</td><td><button class="icon-action del-doc">🗑</button></td></tr>`).join('') || ''}
      </tbody></table></div>`);
    bindTabs();
    document.getElementById('nd-submit').addEventListener('click', async () => {
      const nomeDigitado = document.getElementById('nd-nome').value.trim();
      const categoria = document.getElementById('nd-categoria').value, tipo = document.getElementById('nd-tipo').value;
      const arquivo = document.getElementById('nd-arquivo').files[0];
      if (!nomeDigitado && !arquivo) { FASA.toast('Escreva um nome ou anexe um arquivo.'); return; }

      let arquivo_url = null;
      if (arquivo) {
        const path = `${user.id}/${Date.now()}-${arquivo.name}`;
        const { error: upError } = await sb.storage.from('biblioteca-arquivos').upload(path, arquivo);
        if (upError) { FASA.toast('Erro ao enviar arquivo: ' + upError.message); return; }
        const { data: pub } = sb.storage.from('biblioteca-arquivos').getPublicUrl(path);
        arquivo_url = pub.publicUrl;
      }

      const { error: insError } = await sb.from('biblioteca').insert({
        nome: nomeDigitado || arquivo.name, categoria, tipo, arquivo_url, enviado_por: user.id,
      });
      if (insError) { FASA.toast('Erro ao adicionar: ' + insError.message); return; }
      FASA.toast('Documento liberado!'); paintDocumentos();
    });
    pageEl.querySelectorAll('.del-doc').forEach(btn => btn.addEventListener('click', async (e) => {
      const id = e.target.closest('tr').dataset.id;
      const { error: delError } = await sb.from('biblioteca').delete().eq('id', id);
      if (delError) { FASA.toast('Erro ao excluir: ' + delError.message); return; }
      paintDocumentos();
    }));
  }

  function render() { ({ painel: paintPainel, usuarios: paintUsuarios, escalas: paintEscalas, ausencias: paintAusencias, banco: paintBancoHorasAdmin, avisos: paintAvisos, comunidades: paintComunidades, documentos: paintDocumentos })[tab](); }
  render();
}

/* ---------------- Router ---------------- */
const ROUTES = { feed: renderFeed, perfil: renderPerfil, chat: renderChat, comunidades: renderComunidades, avisos: renderAvisos, escala: renderEscala, biblioteca: renderBiblioteca, enquetes: renderEnquetes, sugestoes: renderSugestoes, ranking: renderRanking, admin: renderAdmin };

function router() {
  const route = location.hash.replace('#/', '') || '';
  const user = FASA.currentUser();

  if (route === 'login') { renderLogin(); return; }
  if (route === 'cadastro') { renderCadastro(); return; }

  if (!user) { FASA.go('login'); return; }

  const fn = ROUTES[route] || ROUTES.feed;
  fn();
}

FASA.seed();
window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', router);
router();
</script>
</body>
</html>
